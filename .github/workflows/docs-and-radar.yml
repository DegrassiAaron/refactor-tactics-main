# Primo workflow del repository. Copre i gate che finora giravano solo a mano — e che a mano
# vengono eseguiti quando ci si ricorda, cioe' non sempre.
#
# Il --check dei radar non e' un test sui grafici: siccome i rating vengono dai cataloghi (D-106),
# e' un test di regressione sui DATI COMPETITIVI. Toccare `Salute` in RT_HeroCatalog_v0.1.md lo
# rende rosso finche' gli SVG non sono rigenerati nello stesso commit.
name: docs e radar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # I documenti normativi non citano simboli C++ inesistenti, e ogni link risolve.
      - name: gate documentali
        run: |
          python scripts/check-docs-links.py
          python scripts/check-docs-symbols.py

      # Zero dipendenze: Node 22 esegue TypeScript con type stripping (D-108 aveva messo in conto
      # un package manager; non serve).
      - name: test della rubrica
        run: node --test "tools/radar/**/*.test.ts"

      # ⚠️ Gira su Linux, dove le fini riga sono LF. E' il caso che il .gitattributes protegge:
      # senza `eol=lf` gli SVG arriverebbero CRLF su Windows e questo passo sarebbe verde in CI e
      # rosso in locale — o viceversa.
      - name: i radar sono allineati ai cataloghi
        run: node tools/radar/generate.ts --check
