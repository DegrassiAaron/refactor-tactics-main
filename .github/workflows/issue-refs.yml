# Confronta i percorsi citati dalle issue aperte con l'albero del repository.
#
# Perche' esiste, e perche' su schedule invece che su push: il difetto che chiude non nasce da un
# commit, nasce dal **tempo**. Un percorso rimosso oggi rende false domani delle issue che nessuno
# tocchera' piu'. Il 2026-08-31 ne sono state corrette 63 in un giorno, trovate a mano da due sessioni
# in parallelo dieci giorni dopo la rimozione che le aveva prodotte.
#
# Gira anche su push quando cambia il tool o qualcosa sotto scripts/ e docs/, perche' una rimozione e'
# esattamente il momento in cui si vuole sapere chi la citava.
name: issue-refs

on:
  schedule:
    # 06:15 UTC ogni giorno: prima dell'orario di lavoro, dopo la notte di merge.
    - cron: '15 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/radar/issue-refs.ts'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/issue-refs.yml'

permissions:
  contents: read
  issues: read

concurrency:
  group: issue-refs
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 🔴 Obbligatorio. Il gate deduce i percorsi rimossi da `git log --diff-filter=D`: su un
          # clone shallow non vedrebbe nessuna cancellazione e passerebbe qualunque cosa. Il tool se
          # ne accorge e dichiara NOT RUN, ma la riga giusta e' questa.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: test del gate
        run: node --test tools/radar/issue-refs.test.ts

      - name: percorsi citati dalle issue aperte
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/radar/issue-refs.ts --check --repo "$GITHUB_REPOSITORY"
