<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RefactorTactics — Project Control Center</title>
<!--
  Vista READ-ONLY sopra gli artefatti generati da `scripts/feature_registry.py generate`.
  Nessun dato nasce qui: nessuno stato viene calcolato, nessuna percentuale inventata, nessuna
  scrittura verso GitHub. Se una vista chiede un valore che il generatore non produce, si
  estende il generatore — non questa pagina.
  Come si apre: `python -m http.server` dalla radice del repository, poi
  http://localhost:8000/docs/control-center/ . Vedi README.md.
-->
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2b303b;
    --fg: #e6e9ef; --dim: #99a1b3; --accent: #6ea8fe; --ok: #4ec98a;
    --warn: #e0b050; --bad: #e06c75; --todo: #6b7382;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --panel2: #eef0f4; --line: #d8dce4;
      --fg: #1b1f27; --dim: #5a6273; --accent: #1a5fd0; --ok: #1c8f5a;
      --warn: #9a6b00; --bad: #c0392b; --todo: #8a92a0;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: .92em; }
  header { padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .title h1 { margin: 0; font-size: 17px; letter-spacing: .2px; }
  .src { color: var(--dim); font-size: 12px; }
  .banner { margin: 10px 20px 0; padding: 10px 12px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel2); }
  .banner.bad { border-color: var(--bad); }
  nav { display: flex; gap: 2px; padding: 0 12px; background: var(--panel);
    border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--dim); padding: 10px 14px; font: inherit; cursor: pointer; white-space: nowrap; }
  nav button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  main { padding: 16px 20px 60px; max-width: 1500px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  select, input[type="search"] { background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; font: inherit; }
  input[type="search"] { min-width: 240px; }
  .cards { display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 11px 13px; cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .card h3 { margin: 0 0 2px; font-size: 13px; }
  .fid { color: var(--dim); font-size: 11px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 7px; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px;
    background: var(--panel2); color: var(--dim); border: 1px solid var(--line); }
  .gates { display: flex; gap: 2px; margin-top: 8px; }
  .g { flex: 1; height: 5px; border-radius: 2px; background: var(--todo); }
  .g.done { background: var(--ok); } .g.partial { background: var(--warn); }
  .g.na { background: var(--line); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--line);
    vertical-align: top; }
  th { color: var(--dim); font-weight: 600; font-size: 12px; }
  tbody tr:hover { background: var(--panel); }
  .stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
    margin-bottom: 18px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 11px 13px; }
  .stat .n { font-size: 22px; font-weight: 600; }
  .stat .l { color: var(--dim); font-size: 12px; }
  h2 { font-size: 14px; margin: 22px 0 9px; }
  .queue { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
  .qbox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 11px; }
  .qbox h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .4px; }
  .qbox li { margin-bottom: 5px; cursor: pointer; }
  .qbox ul { margin: 0; padding-left: 17px; }
  .BLOCKING h3 { color: var(--bad); } .READY h3 { color: var(--ok); }
  .WAITING h3 { color: var(--warn); } .DONE h3 { color: var(--dim); }
  #drawer { position: fixed; top: 0; right: 0; width: min(560px, 100%); height: 100%;
    background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto;
    padding: 18px 20px 60px; transform: translateX(100%); transition: transform .16s ease;
    box-shadow: -8px 0 26px #0006; }
  #drawer.open { transform: none; }
  /* Gli id delle feature sono lunghi e non hanno spazi: senza questo escono dal pannello. */
  #drawer, #drawer dd, #drawer .pill, #drawer a { overflow-wrap: anywhere; }
  /* I chip sono adiacenti senza spazi: senza un contenitore flex la riga non ha nessun punto
     in cui andare a capo, e una lista di id lunghi esce dal pannello. */
  .chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  #drawer h2 { margin-top: 0; font-size: 16px; }
  #drawer dt { color: var(--dim); font-size: 11px; text-transform: uppercase;
    letter-spacing: .5px; margin-top: 13px; }
  #drawer dd { margin: 3px 0 0; }
  .close { position: absolute; top: 12px; right: 16px; background: none; border: 0;
    color: var(--dim); font-size: 22px; cursor: pointer; }
  .broken { color: var(--bad); border-bottom: 1px dotted var(--bad); cursor: help; }
  .muted { color: var(--dim); }
  .pill { display: inline-block; margin: 2px 4px 2px 0; padding: 2px 8px; border-radius: 5px;
    background: var(--panel2); border: 1px solid var(--line); font-size: 12px; cursor: pointer; }
  .load { max-width: 640px; margin: 40px auto; text-align: center; }

  /* --- Execution Map --- */
  .execwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); padding: 4px 0; }
  .execwrap svg { display: block; }
  .execnode { cursor: pointer; }
  .execnode rect { fill: var(--panel2); stroke: var(--line); }
  .execnode:hover rect { stroke: var(--dim); }
  .execnode text { font-size: 11px; fill: var(--fg); }
  .execnode .sub { font-size: 9.5px; fill: var(--dim); }
  .lanelabel { font-size: 10px; fill: var(--dim); text-transform: uppercase;
    letter-spacing: .6px; }
  .lanerule { stroke: var(--line); stroke-dasharray: 2 4; }
  .edge { fill: none; stroke: var(--dim); }
  .edge.hard { stroke-width: 1.6; }
  .edge.follows { stroke-dasharray: 6 4; }
  .edge.related { stroke-dasharray: 1 4; }
  /* Le tracce — chi realizza (`implements`) e chi giudica (`verifies`) — non sono dipendenze, e
     senza una regola propria ereditavano il tratto pieno di `.edge`: la figura affermava una
     dipendenza dura dove il modello non ne dichiara nessuna. */
  .edge.implements, .edge.verifies { stroke-dasharray: 4 2 1 2; opacity: .75; }
  /* Il marker eredita `.edge { fill: none }` se gli si mette quella classe, e in SVG una regola
     CSS batte l'attributo di presentazione: la punta usciva vuota, cioè illeggibile a 7px. */
  .arrowhead { fill: var(--dim); stroke: none; }
  /* Il moncone: un lato libero si DISEGNA, non si omette. Il cerchietto vuoto in punta dice
     «la catena finisce qui», che è diverso da «la figura è tagliata qui». */
  .stub { stroke: var(--dim); stroke-width: 1.4; stroke-dasharray: 3 3; }
  .stub-cap { fill: var(--panel); stroke: var(--dim); stroke-width: 1.2; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  .legend svg { vertical-align: middle; }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>RefactorTactics — Project Control Center</h1>
    <span class="src" id="source">caricamento…</span>
  </div>
</header>
<div id="banners"></div>
<nav id="tabs"></nav>
<main id="view"><p class="muted">Caricamento degli artefatti…</p></main>
<aside id="drawer"><button class="close" title="Chiudi">×</button><div id="drawerBody"></div></aside>

<script type="module">
import {
  githubBase, issueUrl, milestoneUrl, docUrl, wikiRefUrl, epicCheckpointKey, roadmapContainer,
  buildIndex, brokenRefs, dependencyCycles, filterFeatures, sessionsForFeature, stalenessVerdict,
  executionIndex, executionIncoming, executionOutgoing, danglingEnds, topologicalDepths,
  filterExecution,
} from './graph.js';

const $ = (sel) => document.querySelector(sel);
const el = (tag, props = {}, kids = []) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const k of [].concat(kids)) node.append(k);
  return node;
};
const esc = (s) => String(s ?? '');

let REG = null, GRAPH = null, INDEX = null, BROKEN = [], PROJECT = null;
// La vista aperta sta nell'hash: `#execution` apre la Execution Map. Serve a due cose concrete
// — mandare a qualcuno il link della vista che si sta guardando, e ricaricare la pagina senza
// tornare all'Overview. Un hash sconosciuto non rompe niente: resta `overview`.
let tab = 'overview';

// I filtri sono PER VISTA, non globali. Con un oggetto solo la chiave `release` era condivisa fra
// Feature Map ed Execution Map: scegliere `v0.2` di là svuotava la mappa di qua — e siccome `v0.2`
// non e' fra le release dei nodi, nessuna `<option>` risultava selezionata e il menu mostrava
// l'etichetta neutra. Una vista vuota senza filtro visibile e' il modo peggiore di sbagliare,
// perche' sembra un dato assente e non una scelta.
const FILTERS = {};
const tabFilters = () => (FILTERS[tab] = FILTERS[tab] || {});

/** L'hash decide la vista. Un valore sconosciuto non rompe niente: la vista resta dov'è. */
function applyHash() {
  const wanted = location.hash.replace('#', '');
  if (TABS.some(([id]) => id === wanted)) tab = wanted;
}

// --- Caricamento ---------------------------------------------------------------------------

async function load() {
  try {
    const [reg, graph] = await Promise.all([
      fetch('../roadmap/feature-registry.json').then((r) => r.json()),
      fetch('../roadmap/project-graph.json').then((r) => r.json()),
    ]);
    boot(reg, graph);
  } catch (err) {
    offerFilePicker(err);
  }
}

/**
 * Aperta da `file://` il fetch relativo e' bloccato dal browser. Invece di dire «errore», la
 * pagina chiede i due file: e' lo stesso dato, e chi la apre cosi' vuole vedere il proprio
 * working tree, non il repository remoto.
 */
function offerFilePicker(err) {
  const input = el('input', { type: 'file', multiple: true, accept: '.json' });
  input.addEventListener('change', async () => {
    const byName = {};
    for (const file of input.files) byName[file.name] = JSON.parse(await file.text());
    const reg = byName['feature-registry.json'];
    const graph = byName['project-graph.json'];
    if (reg && graph) boot(reg, graph);
    else alert('Servono entrambi: feature-registry.json e project-graph.json');
  });
  $('#view').replaceChildren(el('div', { className: 'load' }, [
    el('p', { textContent: 'Non riesco a leggere gli artefatti da qui.' }),
    el('p', { className: 'muted', innerHTML:
      'Il modo previsto è servire il repository: <code>python -m http.server</code> dalla radice, '
      + 'poi <code>localhost:8000/docs/control-center/</code>.<br>'
      + 'Altrimenti seleziona i due file da <code>docs/roadmap/</code>:' }),
    input,
    el('p', { className: 'muted mono', textContent: String(err && err.message || err) }),
  ]));
}

function boot(reg, graph) {
  REG = reg; GRAPH = graph;
  PROJECT = reg.project || graph.project || {};
  INDEX = buildIndex(REG, GRAPH);
  BROKEN = brokenRefs(REG, GRAPH, INDEX);
  renderSource();
  applyHash();
  // Senza questo, Back e Forward cambiavano l'URL lasciando la vista dov'era: l'hash veniva letto
  // una volta sola al caricamento, e ogni passo indietro allargava lo scarto fra barra e pagina.
  window.addEventListener('hashchange', () => { applyHash(); renderTabs(); render(); });
  renderTabs();
  render();
  checkStaleness();
}

// --- Testata e staleness (R-4) --------------------------------------------------------------

function renderSource() {
  const base = githubBase(PROJECT);
  const audit = (REG.meta && REG.meta.last_full_audit) || {};
  const bits = [
    base ? `${base.owner}/${base.repository} @ ${base.branch}` : 'config GitHub assente',
    `${REG.count} feature`,
    audit.date ? `audit ${audit.date} (${audit.commit || '—'})` : 'audit non dichiarato',
    `caricato ${new Date().toLocaleTimeString('it-IT')}`,
  ];
  $('#source').textContent = bits.join(' · ');
}

/**
 * Il repository non ha CI: `generate` lo lancia una persona. Se il `.yaml` e' stato toccato dopo
 * l'ultimo `generate`, quello che vedi e' vecchio — e senza questo avviso sembrerebbe fresco.
 */
async function checkStaleness() {
  const base = githubBase(PROJECT);
  if (!base) return;
  const head = async (path) => {
    const url = `https://api.github.com/repos/${base.owner}/${base.repository}/commits`
      + `?path=${encodeURIComponent(path)}&sha=${base.branch}&per_page=1`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`GitHub API ${res.status}`);
    const [commit] = await res.json();
    return commit && { sha: commit.sha.slice(0, 7), date: commit.commit.committer.date };
  };
  try {
    const [y, j] = await Promise.all([
      head('docs/roadmap/feature-registry.yaml'),
      head('docs/roadmap/project-graph.json'),
    ]);
    const verdict = stalenessVerdict(y, j);
    if (!verdict.known) return;
    if (verdict.stale) {
      banner(`⚠️ Il registry è stato modificato dopo l'ultima rigenerazione — `
        + `sorgente <code>${verdict.yamlSha}</code> del ${verdict.yamlDate.toLocaleString('it-IT')}, `
        + `grafo <code>${verdict.jsonSha}</code> del ${verdict.jsonDate.toLocaleString('it-IT')}. `
        + `I dati mostrati possono essere vecchi: <code>python scripts/feature_registry.py generate</code>.`,
        true);
    } else {
      $('#source').textContent += ` · grafo ${verdict.jsonSha} allineato`;
    }
  } catch (err) {
    $('#source').textContent += ' · freschezza non verificabile (offline o rate limit)';
  }
}

function banner(html, bad = false) {
  $('#banners').append(el('div', { className: `banner${bad ? ' bad' : ''}`, innerHTML: html }));
}

// --- Tab -----------------------------------------------------------------------------------

const TABS = [
  ['overview', 'Overview'], ['roadmap', 'Roadmap'], ['features', 'Feature Map'],
  ['execution', 'Execution Map'],
  ['scenarios', 'Scenario Map'], ['editor', 'Editor Map'], ['queue', 'My Editor Queue'],
  ['warnings', 'Diagnostica'],
];

function renderTabs() {
  $('#tabs').replaceChildren(...TABS.map(([id, label]) => {
    const b = el('button', { textContent: label });
    b.setAttribute('aria-selected', String(id === tab));
    b.onclick = () => { tab = id; location.hash = id; renderTabs(); render(); };
    return b;
  }));
}

function render() {
  const view = $('#view');
  view.replaceChildren();
  ({ overview, roadmap, features, execution, scenarios, editor, queue, warnings })[tab](view);
}

// --- Overview ------------------------------------------------------------------------------

function overview(view) {
  const feats = REG.features;
  const gatesDone = feats.reduce((n, f) => n + f.gates_done, 0);
  const gatesTot = feats.reduce((n, f) => n + f.gates_applicable, 0);
  const done = feats.filter((f) => f.status === 'DONE' || f.status === 'RELEASE_READY').length;
  const blocked = feats.filter((f) => f.status === 'BLOCKED').length;
  const issues = new Set(feats.flatMap((f) => f.issues)).size;
  const gates = GRAPH.release_gates || [];
  const green = gates.filter((g) => g.state.startsWith('✅')).length;
  const q = GRAPH.editor_queue || {};

  view.append(el('div', { className: 'stats' }, [
    stat(`${done}/${feats.length}`, 'feature RELEASE_READY o DONE'),
    stat(`${gatesDone}/${gatesTot}`, 'gate delle feature (esclusi «na»)'),
    stat(`${green}/${gates.length}`, 'gate di release verdi'),
    stat(String(issues), 'issue citate dalle feature'),
    stat(String(blocked), 'feature BLOCKED', blocked ? 'bad' : null),
    stat(String((q.BLOCKING || []).length), 'sedute che bloccano la v0.1',
      (q.BLOCKING || []).length ? 'warn' : null),
    stat(String(GRAPH.diagnostics.warnings.length), 'warning del validator', 'warn'),
    stat(String(BROKEN.length), 'riferimenti rotti', BROKEN.length ? 'bad' : null),
  ]));

  view.append(el('h2', { textContent: 'Gate di release' }));
  view.append(table(['#', 'Gate', 'Stato'], gates.map((g) => [
    el('span', { className: 'mono', textContent: g.id }), stripMd(g.request), stripMd(g.state),
  ])));

  view.append(el('h2', { textContent: 'Perché non è Done — i gate più mancanti' }));
  const missing = {};
  for (const f of feats) {
    for (const [gate, value] of Object.entries(f.gates)) {
      if (value === 'todo' || value === 'partial') missing[gate] = (missing[gate] || 0) + 1;
    }
  }
  view.append(table(['Gate', 'Feature che non lo hanno chiuso'],
    Object.entries(missing).sort((a, b) => b[1] - a[1]).map(([gate, n]) => {
      const link = el('span', { className: 'pill', textContent: `${gate} · ${n}` });
      link.onclick = () => { tab = 'features'; tabFilters().gate = gate; renderTabs(); render(); };
      return [link, `${n} feature`];
    })));
}

const stat = (n, l, kind) => el('div', { className: 'stat' }, [
  el('div', { className: 'n', textContent: n,
    style: kind === 'bad' ? 'color:var(--bad)' : kind === 'warn' ? 'color:var(--warn)' : '' }),
  el('div', { className: 'l', textContent: l }),
]);

// --- Roadmap -------------------------------------------------------------------------------

function roadmap(view) {
  const rows = [];
  const containers = [
    ...Object.entries(GRAPH.epics).map(([id, s]) => [id, s, 'epic']),
    ...Object.entries(GRAPH.milestones).map(([id, s]) => [id, s, 'milestone']),
  ].sort((a, b) => a[2].localeCompare(b[2]) || num(a[0]) - num(b[0]));
  for (const [id, state, kind] of containers) {
    const fids = INDEX.featuresByContainer.get(id) || [];
    const cps = Object.entries(GRAPH.checkpoints)
      .filter(([key]) => key.startsWith(`${id}.`))
      .map(([key, st]) => chip(`${key} ${st}`, () => openCheckpoint(key)));
    rows.push([
      el('strong', { textContent: id }), kind, state || '—',
      el('span', { className: 'chips' }, fids.map((fid) => chip(fid, () => openFeature(fid)))),
      el('span', { className: 'chips' }, cps),
    ]);
  }
  view.append(el('h2', { textContent: 'Epic e milestone' }));
  view.append(table(['', 'Tipo', 'Stato', 'Feature', 'Checkpoint'], rows));
}

const num = (s) => parseInt(String(s).replace(/\D/g, ''), 10) || 0;

// --- Feature Map ---------------------------------------------------------------------------

function features(view) {
  const feats = REG.features;
  const uniq = (fn) => [...new Set(feats.map(fn).filter(Boolean))].sort();
  view.append(el('div', { className: 'filters' }, [
    select('release', 'Release', uniq((f) => f.release)),
    select('area', 'Area', uniq((f) => f.area)),
    select('kind', 'Kind', uniq((f) => f.kind)),
    select('priority', 'Priorità', uniq((f) => f.priority)),
    select('status', 'Status', uniq((f) => f.status)),
    select('container', 'Epic/Milestone', uniq(roadmapContainer)),
    select('gate', 'Gate mancante', Object.keys(feats[0].gates)),
    select('blocked', 'Bloccata', ['yes', 'no']),
    select('editor', 'Richiede editor', ['yes']),
    select('scenarioReady', 'Scenari', ['yes', 'planned']),
    search(),
  ]));
  const shown = filterFeatures(feats, tabFilters(), INDEX);
  view.append(el('p', { className: 'muted',
    textContent: `${shown.length} di ${feats.length} feature` }));
  view.append(el('div', { className: 'cards' }, shown.map(featureCard)));
}

function featureCard(f) {
  const card = el('div', { className: 'card' }, [
    el('div', { className: 'fid mono', textContent: f.feature_id }),
    el('h3', { textContent: f.title }),
    el('div', { className: 'row' }, [
      tag(f.status), tag(`${f.gates_done}/${f.gates_applicable} gate`), tag(f.release),
      tag(f.priority), roadmapContainer(f) ? tag(roadmapContainer(f)) : '',
    ]),
    el('div', { className: 'gates', title: Object.entries(f.gates)
      .map(([k, v]) => `${k}: ${v}`).join('\n') },
      Object.values(f.gates).map((v) => el('div', { className: `g ${v}` }))),
  ]);
  card.onclick = () => openFeature(f.feature_id);
  return card;
}

// --- Scenario Map --------------------------------------------------------------------------

function scenarios(view) {
  const caps = new Set(GRAPH.capabilities || []);
  const rows = (GRAPH.scenarios || []).map((s) => {
    const missing = (s.requires || []).filter((r) => !caps.has(r));
    const fids = INDEX.featuresByScenario.get(s.id) || [];
    return [
      el('span', { className: 'mono', textContent: s.id }),
      missing.length
        ? el('span', { className: 'broken', title: 'capability assenti nel harness',
            textContent: `mancano ${missing.join(', ')}` })
        : el('span', { className: 'muted', textContent: 'capability presenti' }),
      el('span', { className: 'chips' }, fids.map((fid) => chip(fid, () => openFeature(fid)))),
      link(docUrl(PROJECT, s.path), s.path),
    ];
  });
  view.append(el('p', { className: 'muted', textContent:
    `${rows.length} scenari · ${caps.size} capability dichiarate dal harness. `
    + `«Mancano» significa che lo scenario esce BLOCKED: è una specifica eseguibile scritta prima `
    + `della capability, non necessariamente un difetto.` }));
  view.append(table(['Scenario', 'Capability', 'Feature che lo dichiarano', 'File'], rows));

  const planned = REG.features.filter((f) => (f.scenarios_planned || []).length);
  if (planned.length) {
    view.append(el('h2', { textContent: 'Scenari pianificati (non ancora in repository)' }));
    view.append(table(['Feature', 'Scenari'], planned.map((f) => [
      chip(f.feature_id, () => openFeature(f.feature_id)),
      f.scenarios_planned.join(' · '),
    ])));
  }
}

// --- Execution Map -------------------------------------------------------------------------
//
// Risponde a una domanda che nessun'altra vista risponde: **cosa blocca cosa, e chi deve
// intervenire**. Non ricalcola nulla — `readiness` e `state` arrivano dal generatore; qui si
// filtra e si dispone. Il layout SÌ, perché è struttura visiva e non un giudizio.

const SVGNS = 'http://www.w3.org/2000/svg';
const svgEl = (name, attrs = {}, kids = []) => {
  const node = document.createElementNS(SVGNS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
  for (const kid of [].concat(kids)) if (kid) node.append(kid);
  return node;
};

const READINESS_LABEL = {
  READY: 'nulla lo blocca',
  BLOCKED: 'bloccato',
  WAITING_FOR_PIE: 'aspetta una seduta PIE',
  WAITING_FOR_ASSET: 'aspetta un asset',
  DONE: 'fatto',
  UNKNOWN: 'stato non misurabile senza rete',
};

function execution(view) {
  const ex = GRAPH.execution;
  if (!ex) {
    view.append(el('p', { className: 'muted', textContent:
      'Execution Map non ancora generata: `docs/roadmap/execution-graph.yaml` non esiste, '
      + 'oppure il grafo è stato rigenerato senza di esso.' }));
    return;
  }
  const index = executionIndex(GRAPH);
  const shown = filterExecution(ex.nodes, tabFilters());
  const uniq = (fn) => [...new Set(ex.nodes.map(fn).filter(Boolean))].sort();

  view.append(el('p', { className: 'muted', textContent:
    `${ex.stats.nodes} nodi · ${ex.stats.hard_edges} dipendenze dure · `
    + `${ex.stats.soft_edges} relazioni molli · fetta «${ex.status}». `
    + `Lo stato di ${ex.stats.state_unknown} nodi non è misurabile senza rete: il generatore `
    + 'non parla con GitHub, e il checkpoint di quei nodi non dichiara il glifo nell’owner.' }));

  view.append(el('div', { className: 'filters' }, [
    select('release', 'Release', uniq((n) => n.release)),
    select('lane', 'Lane', uniq((n) => n.execution_lane)),
    select('domain', 'Dominio', uniq((n) => n.domain_group)),
    select('readiness', 'Readiness', uniq((n) => n.readiness)),
    search(),
  ]));

  view.append(executionDiagram(index, shown));
  view.append(executionLegend());

  // Le capability non stanno nel disegno: un nodo in piu' per ognuna raddoppierebbe le frecce
  // senza aggiungere una posizione. Stanno qui, dove si legge la cosa che contano davvero —
  // quanti scenari del corpus aspettano, e chi li sbloccherà.
  const caps = ex.capabilities || [];
  if (caps.length) {
    view.append(el('h2', { textContent: 'Capability' }));
    view.append(table(
      ['Capability', 'Disponibile', 'La fornisce', 'Nodi in attesa', 'Scenari in attesa'],
      caps.map((c) => [
        el('strong', { textContent: c.id }),
        c.available ? `sì — ${c.available_source}` : 'no',
        el('span', { className: 'chips' }, c.providers.map((p) =>
          chip(execLabel(index.byId.get(p)) || p, () => openExecutionNode(p)))),
        el('span', { className: 'chips' }, c.consumers.map((p) =>
          chip(execLabel(index.byId.get(p)) || p, () => openExecutionNode(p)))),
        el('span', {}, [
          el('strong', { textContent: String(c.scenario_consumers.length) }),
          el('div', { className: 'muted', textContent: c.scenario_consumers.join(' · ') }),
        ]),
      ])));
  }

  view.append(el('h2', { textContent: 'Roads' }));
  // Stessa regola del disegno: sotto filtro, un prerequisito nascosto non si elenca e il lato
  // conta come libero. Tabella e figura devono dire la stessa cosa della stessa vista.
  const visibleIds = new Set(shown.map((n) => n.id));
  view.append(table(
    ['Nodo', 'Lane', 'Dominio', 'Readiness', 'Dipende da', 'Abilita', 'Feature'],
    shown.map((n) => {
      const ends = danglingEnds(index, n.id, visibleIds);
      const upstream = executionIncoming(index, n.id, { hardOnly: true })
        .filter((e) => visibleIds.has(e.from));
      const downstream = executionOutgoing(index, n.id, { hardOnly: true })
        .filter((e) => visibleIds.has(e.to));
      return [
        chip(execLabel(n), () => openExecutionNode(n.id)),
        tag((n.execution_lane || '—').toUpperCase()),
        n.domain_group || '—',
        el('span', { title: n.readiness_reason || '' }, [
          tag(n.readiness || '—'), ' ',
          el('span', { className: 'muted', textContent: READINESS_LABEL[n.readiness] || '' }),
        ]),
        ends.inbound
          ? stubCell('inbound', 'niente lo trattiene: è una radice della catena')
          : el('span', { className: 'chips' }, upstream.map((e) =>
              chip(execLabel(index.byId.get(e.from)) || e.from, () => openExecutionNode(e.from)))),
        ends.outbound
          ? stubCell('outbound', 'non sblocca niente di dichiarato: è una foglia della catena')
          : el('span', { className: 'chips' }, downstream.map((e) =>
              chip(execLabel(index.byId.get(e.to)) || e.to, () => openExecutionNode(e.to)))),
        el('span', { className: 'chips' }, (n.feature_ids || []).map((f) =>
          chip(f, () => openFeature(f)))),
      ];
    })));
}

/** Il moncone in forma di cella: stessa semantica del disegno, per chi legge la tabella. */
function stubCell(side, title) {
  const svg = svgEl('svg', { width: 34, height: 14, viewBox: '0 0 34 14' });
  const x1 = side === 'inbound' ? 5 : 0;
  const x2 = side === 'inbound' ? 30 : 25;
  svg.append(svgEl('line', { x1, y1: 7, x2, y2: 7, class: 'stub' }));
  svg.append(svgEl('circle', {
    cx: side === 'inbound' ? 4 : 30, cy: 7, r: 3, class: 'stub-cap' }));
  return el('span', { title, className: 'muted' }, [svg]);
}

const execLabel = (n) => {
  if (!n) return null;
  if (n.kind === 'issue') return `#${n.ref}`;
  if (n.kind === 'session') return n.ref;
  return n.id;
};

/**
 * Il diagramma. X = profondità topologica sulle sole dipendenze dure, Y = lane e dominio.
 *
 * Deterministico e senza librerie: due caricamenti danno la stessa figura, e la figura non
 * dipende da una simulazione fisica che nessuno può rifare uguale.
 */
function executionDiagram(index, shown) {
  const visible = new Set(shown.map((n) => n.id));
  const depths = topologicalDepths(index);
  const COL = 132, ROW = 46, W = 96, H = 30, PAD = 18, LANEW = 62;

  // Un gruppo = una coppia (lane, dominio). Puo' occupare PIU' righe: se due nodi cadono nella
  // stessa colonna, il secondo scende. Le righe del gruppo si allocano tutte insieme, prima di
  // disegnare, perche' l'etichetta di lane va scritta su ognuna — la prima stesura la scriveva
  // solo sulla riga iniziale e lasciava le altre con l'etichetta del gruppo successivo:
  // `#649` compariva sotto `PIE` mentre e' `CODE`, cioe' la figura diceva il falso proprio sul
  // dato per cui esiste la corsia.
  const groups = new Map();
  for (const n of shown) {
    const key = `${n.execution_lane}|${n.domain_group || ''}`;
    if (!groups.has(key)) groups.set(key, { lane: n.execution_lane, domain: n.domain_group, nodes: [] });
    groups.get(key).nodes.push(n);
  }
  const place = new Map();
  const laneRows = [];
  for (const group of groups.values()) {
    const perColumn = new Map();
    const base = laneRows.length;
    let used = 1;
    for (const n of group.nodes) {
      const col = depths.get(n.id) || 0;
      const offset = perColumn.get(col) || 0;
      perColumn.set(col, offset + 1);
      used = Math.max(used, offset + 1);
      place.set(n.id, { row: base + offset, col });
    }
    for (let i = 0; i < used; i += 1) laneRows.push({ lane: group.lane, domain: group.domain });
  }
  const cols = Math.max(1, ...[...place.values()].map((p) => p.col + 1));
  const width = LANEW + PAD * 2 + cols * COL;
  const height = PAD * 2 + laneRows.length * ROW + 10;
  const xy = (id) => {
    const p = place.get(id);
    return p ? { x: LANEW + PAD + p.col * COL, y: PAD + p.row * ROW } : null;
  };
  const rows = laneRows;

  const svg = svgEl('svg', { width, height, viewBox: `0 0 ${width} ${height}`,
    role: 'img', 'aria-label': 'Mappa delle dipendenze di esecuzione' });

  rows.forEach((r, i) => {
    const y = PAD + i * ROW + H / 2;
    svg.append(svgEl('text', { x: 6, y: y + 3, class: 'lanelabel' },
      document.createTextNode((r.lane || '').toUpperCase())));
    svg.append(svgEl('line', { x1: LANEW - 6, y1: y, x2: width - PAD, y2: y, class: 'lanerule' }));
  });

  for (const edge of (GRAPH.execution.edges || [])) {
    const from = xy(edge.from);
    const to = xy(edge.to);
    if (!from || !to || !visible.has(edge.from) || !visible.has(edge.to)) continue;
    const x1 = from.x + W;
    const y1 = from.y + H / 2;
    const x2 = to.x;
    const y2 = to.y + H / 2;
    const mid = (x1 + x2) / 2;
    const cls = `edge ${edge.hard ? 'hard' : edge.type}`;
    svg.append(svgEl('path', {
      d: `M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`,
      class: cls, 'marker-end': edge.hard ? 'url(#arrow)' : '',
    }, svgEl('title', {}, document.createTextNode(
      `${edge.from} → ${edge.to} · ${edge.type}${edge.rationale ? ` — ${edge.rationale}` : ''}`))));
  }

  const defs = svgEl('defs', {}, svgEl('marker', {
    id: 'arrow', viewBox: '0 0 8 8', refX: 7, refY: 4, markerWidth: 7, markerHeight: 7,
    orient: 'auto-start-reverse',
  }, svgEl('path', { d: 'M 0 0 L 8 4 L 0 8 z', class: 'arrowhead' })));
  svg.prepend(defs);

  for (const n of shown) {
    const p = xy(n.id);
    if (!p) continue;
    const ends = danglingEnds(index, n.id, visible);
    // I due monconi. Sono la richiesta esplicita di questa vista: un lato senza collegamenti
    // si vede COME lato libero, non come assenza di disegno.
    if (ends.inbound) {
      svg.append(svgEl('line', { x1: p.x - 22, y1: p.y + H / 2, x2: p.x, y2: p.y + H / 2, class: 'stub' }));
      svg.append(svgEl('circle', { cx: p.x - 25, cy: p.y + H / 2, r: 3.4, class: 'stub-cap' },
        svgEl('title', {}, document.createTextNode('niente lo trattiene: radice della catena'))));
    }
    if (ends.outbound) {
      svg.append(svgEl('line', { x1: p.x + W, y1: p.y + H / 2, x2: p.x + W + 22, y2: p.y + H / 2, class: 'stub' }));
      svg.append(svgEl('circle', { cx: p.x + W + 25, cy: p.y + H / 2, r: 3.4, class: 'stub-cap' },
        svgEl('title', {}, document.createTextNode('non sblocca niente di dichiarato: foglia della catena'))));
    }
    const g = svgEl('g', { class: 'execnode', tabindex: 0,
      'aria-label': `${execLabel(n)} — ${n.readiness}` });
    g.append(svgEl('rect', { x: p.x, y: p.y, width: W, height: H, rx: 5,
      'stroke-width': n.readiness === 'BLOCKED' ? 2 : 1 }));
    g.append(svgEl('text', { x: p.x + 8, y: p.y + 13 }, document.createTextNode(execLabel(n))));
    g.append(svgEl('text', { x: p.x + 8, y: p.y + 24, class: 'sub' },
      document.createTextNode(`${n.state || '—'} ${n.readiness}`)));
    g.append(svgEl('title', {}, document.createTextNode(
      `${n.id}\n${n.readiness} — ${n.readiness_reason || ''}`)));
    g.onclick = () => openExecutionNode(n.id);
    g.onkeydown = (e) => { if (e.key === 'Enter') openExecutionNode(n.id); };
    svg.append(g);
  }

  return el('div', { className: 'execwrap' }, [svg]);
}

function executionLegend() {
  const sample = (cls, extra = {}) => {
    const s = svgEl('svg', { width: 30, height: 10, viewBox: '0 0 30 10' });
    s.append(svgEl('line', Object.assign({ x1: 0, y1: 5, x2: 30, y2: 5, class: cls }, extra)));
    return s;
  };
  const stub = svgEl('svg', { width: 30, height: 10, viewBox: '0 0 30 10' });
  stub.append(svgEl('line', { x1: 6, y1: 5, x2: 30, y2: 5, class: 'stub' }));
  stub.append(svgEl('circle', { cx: 4, cy: 5, r: 3, class: 'stub-cap' }));
  return el('div', { className: 'legend' }, [
    el('span', {}, [sample('edge hard'), ' dipendenza dura']),
    el('span', {}, [sample('edge follows'), ' ordine consigliato (non blocca)']),
    el('span', {}, [sample('edge related'), ' collegata (non blocca)']),
    el('span', {}, [sample('edge implements'), ' realizza / verifica (non blocca)']),
    el('span', {}, [stub, ' lato libero: niente lo trattiene, o non sblocca niente']),
  ]);
}

function openExecutionNode(id) {
  const index = executionIndex(GRAPH);
  const n = index.byId.get(id);
  if (!n) return;
  const dl = el('dl');
  const add = (label, node) => { dl.append(el('dt', { textContent: label }), el('dd', {}, node)); };
  add('Readiness', el('span', {}, [
    tag(n.readiness), ' ',
    el('span', { className: 'muted', textContent: READINESS_LABEL[n.readiness] || '' }),
    el('div', { className: 'muted', textContent: n.readiness_reason || '' }),
  ]));
  add('Stato', n.state
    ? `${n.state} — da ${n.state_source}`
    : `non misurabile: ${n.state_note || 'nessuna fonte offline'}`);
  add('Classificazione', `${(n.execution_lane || '—').toUpperCase()} · ${n.domain_group || '—'} · `
    + `${n.release || '—'}${n.checkpoint ? ` · ${n.checkpoint}` : ''}`);
  if (n.kind === 'issue') add('Su GitHub', link(issueUrl(PROJECT, Number(n.ref)), `#${n.ref}`));
  if (n.kind === 'session') add('Seduta', chip(n.ref, () => openSession(n.ref)));

  const hardIn = executionIncoming(index, id, { hardOnly: true });
  add('Dipende da', hardIn.length
    ? el('span', { className: 'chips' }, hardIn.map((e) =>
        chip(execLabel(index.byId.get(e.from)) || e.from, () => openExecutionNode(e.from))))
    : stubCell('inbound', 'radice: niente lo trattiene'));
  const hardOut = executionOutgoing(index, id, { hardOnly: true });
  add('Abilita', hardOut.length
    ? el('span', { className: 'chips' }, hardOut.map((e) =>
        chip(execLabel(index.byId.get(e.to)) || e.to, () => openExecutionNode(e.to))))
    : stubCell('outbound', 'foglia: non sblocca niente di dichiarato'));

  const soft = [...executionIncoming(index, id), ...executionOutgoing(index, id)]
    .filter((e) => !e.hard && e.type !== 'provides');
  if (soft.length) add('Relazioni molli', el('div', {}, soft.map((e) => el('div', { className: 'muted' },
    document.createTextNode(`${e.type}: ${e.from} → ${e.to}${e.rationale ? ` — ${e.rationale}` : ''}`)))));

  for (const cap of (GRAPH.execution.capabilities || [])) {
    if (cap.providers.includes(id)) {
      add(`Fornisce ${cap.id}`, el('div', {}, [
        el('div', { textContent: cap.available ? 'disponibile' : 'non ancora disponibile' }),
        el('div', { className: 'muted', textContent:
          `${cap.scenario_consumers.length} scenari la aspettano` }),
        // Gli scenari non hanno un drawer proprio: si nominano, e la Scenario Map li mostra.
        el('span', { className: 'chips' }, cap.scenario_consumers.map((s) =>
          el('span', { className: 'pill', textContent: s }))),
      ]));
    }
    if (cap.consumers.includes(id)) {
      add(`Aspetta ${cap.id}`, el('span', { className: 'chips' },
        cap.providers.map((p) => chip(execLabel(index.byId.get(p)) || p, () => openExecutionNode(p)))));
    }
  }
  if (n.feature_ids.length) add('Feature', el('span', { className: 'chips' },
    n.feature_ids.map((f) => chip(f, () => openFeature(f)))));
  showDrawer(execLabel(n), n.id, dl);
}

function warnings(view) {
  const d = GRAPH.diagnostics;
  view.append(el('p', { className: 'muted', textContent:
    `${d.errors.length} errori · ${d.warnings.length} warning dal validator, `
    + `più ${BROKEN.length} riferimenti che non risolvono dentro gli artefatti.` }));

  if (BROKEN.length) {
    view.append(el('h2', { textContent: 'Riferimenti che non risolvono' }));
    view.append(table(['Da', 'Tipo', 'Riferimento'], BROKEN.map((b) => [
      chip(b.from, () => openRef(b.from)), b.kind,
      el('span', { className: 'broken', textContent: b.ref }),
    ])));
  }
  const cycles = dependencyCycles(REG);
  if (cycles.length) {
    view.append(el('h2', { textContent: 'Cicli fra dipendenze' }));
    view.append(table(['Ciclo'], cycles.map((c) => [c.join(' → ')])));
  }
  for (const [label, items] of [['Errori', d.errors], ['Warning', d.warnings]]) {
    if (!items.length) continue;
    view.append(el('h2', { textContent: `${label} del validator` }));
    // La classe si ricava dal testo dopo `[RT-FEAT-…]`, con i numeri normalizzati: senza questo
    // «3 scenari planned» e «4 scenari planned» diventano due classi, e il raggruppamento —
    // che serve a vedere quale difetto e' sistemico — non raggruppa piu' niente.
    const groups = {};
    for (const line of items) {
      const kind = (line.match(/\]\s*(.+?)(?::|$)/) || [null, line])[1]
        .replace(/\b\d+\b/g, 'N').slice(0, 70);
      (groups[kind] = groups[kind] || []).push(line);
    }
    view.append(table(['Classe', 'N', 'Voci'],
      Object.entries(groups).sort((a, b) => b[1].length - a[1].length).map(([kind, lines]) => [
        kind, String(lines.length),
        el('details', {}, [el('summary', { textContent: 'mostra' }),
          el('div', { className: 'mono', style: 'white-space:pre-wrap',
            textContent: lines.join('\n') })]),
      ])));
  }
}

// --- Drawer (R-8, R-9) ----------------------------------------------------------------------

function openRef(ref) {
  if (INDEX.featureById.has(ref)) return openFeature(ref);
  if (INDEX.sessionById.has(ref)) return openSession(ref);
  return openCheckpoint(ref);
}

function openFeature(fid) {
  const f = INDEX.featureById.get(fid);
  if (!f) return;
  const container = roadmapContainer(f);
  const dl = el('dl');
  const add = (label, node) => { dl.append(el('dt', { textContent: label }), el('dd', {}, node)); };

  add('Stato', `${f.status}${f.status_derived && f.status_derived !== f.status
    ? ` (derivato: ${f.status_derived})` : ''} — ${f.gates_done}/${f.gates_applicable} gate`);
  add('Gate', el('div', {}, Object.entries(f.gates).map(([k, v]) =>
    el('div', { innerHTML: `<span class="muted">${k}</span> — ${v}` }))));
  add('Classificazione', `${f.area} · ${f.kind} · ${f.release} · ${f.priority}`);
  if (container) add('Roadmap', chip(container, () => { tab = 'roadmap'; renderTabs(); render(); }));
  if ((f.roadmap.checkpoints || []).length) {
    add('Checkpoint', el('span', { className: 'chips' }, f.roadmap.checkpoints.map((cp) => {
      const key = epicCheckpointKey(cp);
      const state = GRAPH.checkpoints[key];
      return state === undefined
        ? el('span', { className: 'broken', textContent: key })
        : chip(`${key} ${state}`, () => openCheckpoint(key));
    })));
  }
  if (f.issues.length) add('Issue', el('span', { className: 'chips' }, f.issues.map((n) =>
    link(issueUrl(PROJECT, n), `#${n}`))));
  if (f.dependencies.length) add('Dipende da', refs(f.dependencies));
  const dependents = INDEX.dependents.get(fid) || [];
  if (dependents.length) add('Da cui dipendono', refs(dependents));
  if (f.completed_by.length) add('Completata da', refs(f.completed_by));
  const completes = INDEX.completes.get(fid) || [];
  if (completes.length) add('Completa', refs(completes));
  if (f.scenarios.length) add('Scenari', el('span', { className: 'chips' }, f.scenarios.map((s) =>
    INDEX.scenarioById.has(s)
      ? link(docUrl(PROJECT, INDEX.scenarioById.get(s).path), s)
      : el('span', { className: 'broken', textContent: s }))));
  if (f.scenarios_planned.length) add('Scenari pianificati',
    el('span', { className: 'muted', textContent: f.scenarios_planned.join(' · ') }));
  const sessions = sessionsForFeature(f, INDEX);
  if (sessions.length) add('Sedute in editor che passano per i suoi checkpoint',
    el('span', { className: 'chips' }, sessions.map((sid) => chip(sid, () => openSession(sid)))));
  if (f.tests.length) add('Test', el('span', { className: 'mono muted',
    textContent: f.tests.join(' · ') }));
  if (f.owner_specs.length) add('Spec owner', el('span', { className: 'chips' }, f.owner_specs.map((p) =>
    link(docUrl(PROJECT, p), p))));
  if (f.wiki_refs.length) add('Wiki', el('span', { className: 'chips' }, f.wiki_refs.map((r) =>
    link(wikiRefUrl(PROJECT, r), r))));
  if (f.last_verified && f.last_verified.date) {
    add('Ultima verifica', `${f.last_verified.date} · ${f.last_verified.commit || '—'}`);
  }
  if (f.notes) add('Note', el('div', { className: 'muted', textContent: f.notes }));

  showDrawer(f.title, f.feature_id, dl);
}

function openSession(sid) {
  const s = INDEX.sessionById.get(sid);
  if (!s) return;
  const dl = el('dl');
  const add = (label, node) => { dl.append(el('dt', { textContent: label }), el('dd', {}, node)); };
  add('Stato', `${s.state} · coda ${s.queue_group || '—'} · ${s.critical
    ? 'percorso critico' : 'fuori percorso critico'}`);
  add('Tipo di lavoro', s.execution_lane === 'asset'
    ? 'ASSET — costruisci e committi un asset'
    : 'PIE — guardi il gioco e dai un verdetto');
  if (s.produces) add('Produce', stripMd(s.produces));
  if (s.artifacts.length) add('Artefatti', el('div', {}, s.artifacts.map((a) =>
    el('div', {}, [link(docUrl(PROJECT, a.path), a.path), ' ', a.tracked ? '✅' : '⏳']))));
  if (s.unblocked_by.length) add('Attende', el('span', { className: 'chips' }, s.unblocked_by.map((p) => p.kind
    ? chip(`${p.ref} ${p.state || ''}`, () => openCheckpoint(p.ref))
    : el('span', { className: 'broken', textContent: p.ref }))));
  if (s.unblocks.length) add('Sblocca', el('span', { className: 'chips' }, s.unblocks.map((r) =>
    chip(r, () => openRef(r)))));
  if (s.shares_setup_with.length) add('Preparazione condivisa con',
    el('span', { className: 'chips' }, s.shares_setup_with.map((r) => chip(r, () => openSession(r)))));
  if (s.verifies.length) add('Verifica', el('div', {}, s.verifies.map((v) =>
    el('span', { className: 'pill', textContent: `${v.id} ${v.state || '❓'}` }))));
  if (s.issues.length) add('Issue', el('span', { className: 'chips' }, s.issues.map((n) =>
    link(issueUrl(PROJECT, n), `#${n}`))));
  if (s.done_when) add('Finita quando', s.done_when);
  const feats = INDEX.featuresBySession.get(sid) || [];
  if (feats.length) add('Feature che passano per gli stessi checkpoint', refs(feats));
  showDrawer(s.title, sid, dl);
}

function openCheckpoint(key) {
  const state = GRAPH.checkpoints[key] ?? GRAPH.epics[key] ?? GRAPH.milestones[key];
  const dl = el('dl');
  const add = (label, node) => { dl.append(el('dt', { textContent: label }), el('dd', {}, node)); };
  add('Stato dichiarato dal suo owner', state === undefined
    ? el('span', { className: 'broken', textContent: 'non risolve' }) : state);
  const feats = [...(INDEX.featuresByCheckpoint.get(key) || []),
                 ...(INDEX.featuresByContainer.get(key) || [])];
  if (feats.length) add('Feature', refs([...new Set(feats)]));
  const sessions = (GRAPH.editor_sessions || []).filter((s) =>
    (s.unblocks || []).includes(key) || (s.unblocked_by || []).some((p) => p.ref === key));
  if (sessions.length) add('Sedute collegate',
    el('span', { className: 'chips' }, sessions.map((s) => chip(s.id, () => openSession(s.id)))));
  const owner = key.startsWith('M') ? 'docs/roadmap/roadmap-checkpoint.md'
                                    : 'docs/roadmap/roadmap-v0.1.md';
  add('Owner del suo stato', link(docUrl(PROJECT, owner), owner));
  showDrawer(key, 'checkpoint', dl);
}

function showDrawer(title, subtitle, body) {
  $('#drawerBody').replaceChildren(
    el('div', { className: 'fid mono', textContent: subtitle }),
    el('h2', { textContent: title }), body);
  $('#drawer').classList.add('open');
}
$('#drawer .close').onclick = () => $('#drawer').classList.remove('open');
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') $('#drawer').classList.remove('open');
});

// --- Utility di rendering --------------------------------------------------------------------

function table(head, rows) {
  return el('table', {}, [
    el('thead', {}, el('tr', {}, head.map((h) => el('th', { textContent: h })))),
    el('tbody', {}, rows.map((cells) => el('tr', {}, cells.map((c) => el('td', {},
      typeof c === 'string' ? document.createTextNode(c) : c))))),
  ]);
}
const tag = (text) => el('span', { className: 'tag', textContent: esc(text) });
function chip(text, onclick) {
  const c = el('span', { className: 'pill', textContent: esc(text) });
  c.onclick = (e) => { e.stopPropagation(); onclick(); };
  return c;
}
const refs = (ids) => el('span', { className: 'chips' }, ids.map((id) => INDEX.featureById.has(id)
  ? chip(id, () => openFeature(id))
  : el('span', { className: 'broken', title: 'feature inesistente', textContent: id })));
function link(href, text) {
  if (!href) return el('span', { className: 'broken', title: 'config GitHub assente',
    textContent: esc(text) });
  return el('a', { href, target: '_blank', rel: 'noopener', textContent: esc(text),
    style: 'margin-right:8px' });
}
/** I dati vengono da markdown: qui si toglie l'enfasi, non si interpreta HTML. */
const stripMd = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '$1').replace(/`/g, '');

function select(key, label, options) {
  const s = el('select');
  s.append(el('option', { value: '', textContent: label }));
  for (const o of options) s.append(el('option', { value: o, textContent: o,
    selected: tabFilters()[key] === o }));
  s.onchange = () => { tabFilters()[key] = s.value || undefined; render(); };
  return s;
}
function search() {
  const i = el('input', { type: 'search', placeholder: 'Feature, titolo, #issue, scenario, spec…',
    value: tabFilters().text || '' });
  i.oninput = () => { tabFilters().text = i.value; render(); };
  return i;
}

load();
</script>
</body>
</html>
