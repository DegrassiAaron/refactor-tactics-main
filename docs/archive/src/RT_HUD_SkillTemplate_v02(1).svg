</defs>
<rect width="1600" height="1200" fill="#0B1118"/><text x="70" y="72" class="title">RefactorTactics - Editable Skill HUD Template v0.2</text><text x="70" y="104" class="small">All semantic icons are vector groups. Edit by group ID and replace / recolor symbols.</text><rect x="70" y="160" width="470" height="930" rx="28" fill="#111A24" stroke="#2A3A4A" stroke-width="2"/><text x="110" y="220" class="label">PHASE</text><text x="315" y="220" class="small">top</text><text x="110" y="288" class="label">TARGET</text><text x="315" y="288" class="small">upper-left</text><text x="110" y="356" class="label">SHAPE</text><text x="315" y="356" class="small">upper-right</text><text x="110" y="424" class="label">DELIVERY</text><text x="315" y="424" class="small">left</text><text x="110" y="492" class="label">PRIMARY EFFECT</text><text x="315" y="492" class="small">center icon/color</text><text x="110" y="560" class="label">PRIMARY VALUE</text><text x="315" y="560" class="small">center number</text><text x="110" y="628" class="label">RANGE / SIZE</text><text x="315" y="628" class="small">right</text><text x="110" y="696" class="label">SATELLITES</text><text x="315" y="696" class="small">lower row</text><text x="110" y="764" class="label">MODIFIERS</text><text x="315" y="764" class="small">bottom</text><text x="110" y="865" class="label">RULES</text><text x="110" y="900" class="small">Color = effect family, never phase.</text><text x="110" y="930" class="small">Number = magnitude, always with a symbol.</text><text x="110" y="960" class="small">Overwatch = Reaction trigger, not attack shape.</text><g id="hud_template"><rect x="650" y="160" width="860" height="930" rx="34" fill="#162231" stroke="#2A3A4A" stroke-width="3"/><g id="skill_name"><text x="1080" y="220" text-anchor="middle" class="label">SKILL NAME</text></g><g id="phase"><rect x="985" y="248" width="190" height="90" rx="18" fill="#111A24" stroke="#2A3A4A" stroke-width="3" stroke-dasharray="10 10"/><use href="#i-blast" x="1015" y="264" width="55" height="55"/><text x="1105" y="298" class="label">BLAST</text></g><g id="target"><rect x="720" y="382" width="220" height="130" rx="18" fill="#111A24" stroke="#2A3A4A" stroke-width="3" stroke-dasharray="10 10"/><circle cx="830" cy="420" r="13" fill="#E9EDF2"/><path d="M802 466 Q830 432 858 466" fill="none" stroke="#E9EDF2" stroke-width="9" stroke-linecap="round"/><text x="830" y="495" text-anchor="middle" class="small">TARGET / UNIT</text></g><g id="shape"><rect x="1220" y="382" width="220" height="130" rx="18" fill="#111A24" stroke="#2A3A4A" stroke-width="3" stroke-dasharray="10 10"/><path d="M1265 438 H1395" class="icon"/><text x="1330" y="495" text-anchor="middle" class="small">SHAPE / LINE</text></g><g id="delivery"><rect x="710" y="590" width="230" height="130" rx="18" fill="#111A24" stroke="#2A3A4A" stroke-width="3" stroke-dasharray="10 10"/><path d="M752 638 H848 M752 654 H848 M832 626 L858 646 L832 668" class="icon"/><text x="825" y="702" text-anchor="middle" class="small">DELIVERY / BEAM</text></g><g id="range"><rect x="1220" y="590" width="230" height="130" rx="18" fill="#111A24" stroke="#2A3A4A" stroke-width="3" stroke-dasharray="10 10"/><use href="#i-range" x="1258" y="608" width="60" height="60"/><text x="1350" y="652" class="value">7</text><text x="1335" y="702" text-anchor="middle" class="small">RANGE</text></g><g id="primary_badge"><polygon points="1218.6,510.0 1218.6,670.0 1080.0,750.0 941.4,670.0 941.4,510.0 1080.0,430.0" fill="#281317" stroke="#FF5E57" stroke-width="14"/><g id="primary_effect"><use href="#i-damage" x="1038" y="468" width="84" height="84"/></g><g id="primary_value"><text x="1080" y="678" text-anchor="middle" style="font:900 122px Arial;fill:white">5</text></g></g><g id="satellites"><rect x="790" y="810" width="580" height="120" rx="18" fill="#111A24" stroke="#2A3A4A" stroke-width="3" stroke-dasharray="10 10"/><use href="#i-radius" x="825" y="838" width="46" height="46"/><text x="875" y="875" class="label">2</text><use href="#i-push" x="930" y="838" width="46" height="46"/><text x="980" y="875" class="label">3</text><use href="#i-duration" x="1035" y="838" width="46" height="46"/><text x="1085" y="875" class="label">1</text><use href="#i-targets" x="1140" y="838" width="46" height="46"/><text x="1190" y="875" class="label">3</text><use href="#i-cooldown" x="1245" y="838" width="46" height="46"/><text x="1295" y="875" class="label">4</text><text x="1080" y="916" text-anchor="middle" class="small">SATELLITES</text></g><g id="modifiers"><rect x="790" y="955" width="580" height="95" rx="18" fill="#111A24" stroke="#2A3A4A" stroke-width="3" stroke-dasharray="10 10"/><use href="#m-pierce" x="850" y="970" width="120" height="60"/><use href="#m-friendly" x="1110" y="970" width="120" height="60"/><text x="1010" y="1018" class="label">PIERCE</text><text x="1250" y="1018" class="label">FF</text></g></g><text x="650" y="1140" class="small">Suggested workflow: duplicate SVG -> edit groups -> export 64 / 96 / 128 px -> test in UMG at real HUD size.</text></svg>