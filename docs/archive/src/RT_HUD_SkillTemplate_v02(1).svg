<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
<defs>
<style>
.title{font:700 48px Arial,sans-serif;fill:#ECF3F8}
.section{font:700 30px Arial,sans-serif;fill:#ECF3F8}
.label{font:700 18px Arial,sans-serif;fill:#ECF3F8}
.small{font:500 15px Arial,sans-serif;fill:#93A4B5}
.value{font:800 40px Arial,sans-serif;fill:white}
.card{fill:#111A24;stroke:#2A3A4A;stroke-width:2}
.icon{fill:none;stroke:#E9EDF2;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
</style>

