# Competenza del bot — cosa il bot SA GIOCARE, per personaggio e capability
#
# Owner della sola domanda che [D-102] pone e che nessun artefatto sapeva rispondere:
#
#   > Un risultato bot-contro-bot non e' evidenza di bilanciamento finche' il bot non e' **certificato**
#   > sulle capability che quel risultato produce.
#
# Se una capability decisiva e' `FAIL` o `UNTESTED`, la conclusione ammessa e' *«il bot non sa giocarla»*,
# **non** *«l'eroe e' debole»*. Un nerf deciso su un bot che non sa usare un'abilita' sembra funzionare — il
# win rate si muove — e il difetto vero resta coperto proprio dalla correzione. E' il tipo di errore che non
# lascia tracce, ed e' la ragione per cui questo file esiste (`#543`).
#
# Owner documentale della REGOLA: `docs/technical/runbooks/test-e-diagnosi.md` §3-ter. Qui vivono i DATI.
#
# ## Cosa NON va scritto qui
#
#   win rate, danno per turno, round per partita   sono METRICHE, e questo file dice se si possano leggere.
#                                                  Scriverle qui accanto farebbe di un dubbio una conferma.
#   un giudizio senza token                        uno `state` senza `evidence` e' un'opinione con una
#                                                  casella. L'unico ammesso senza evidenza e' `UNTESTED`,
#                                                  che dichiara di non averne.
#   una soglia                                     nessun numero di questo file fa fallire niente. `D-102`
#                                                  vieta di concludere, non di misurare.
#   un totale che invecchia                        quante righe PASS, quante capability coperte. Si contano
#                                                  col comando, non a memoria:
#                                                    python tools/bot-competence/check.py --check
#   lo stato di una feature o di una issue         vivono in `roadmap-v0.1.md`, in `roadmap-checkpoint.md` e
#                                                  su GitHub, che cambiano senza avvisare questo file.
#
# ## Il vocabolario delle capability, e perche' NON e' uno degli altri tre
#
# Le dieci voci qui sotto vengono dalla provenienza che `#543` dichiara — il handoff del 2026-08-11, §18.1 —
# e descrivono **cosa il bot sa giocare**. Nel repository esistono altri tre insiemi che si chiamano
# «capability» e rispondono a domande diverse: scriverne una qui sarebbe un quinto vocabolario.
#
#   corpus scenari (`AvailableCapabilities()`)   cosa l'HARNESS sa esprimere. `Cover`, `Reaction`,
#                                                `Structures`… Un nome uguale al nostro non e' lo stesso.
#   `CR-*` di `capability-roadmaps.md`           corsie di CONSEGNA, con release e owner.
#   capability trasversali di `CLAUDE.md` §12    proprieta' del CODICE: chi possiede quale sistema.
#
# ## La forma di un'evidenza: un tipo, un oracolo
#
#   test:<nome Automation completo>   risolve contro i letterali di `IMPLEMENT_*_AUTOMATION_TEST` sotto
#                                     `Source/RefactorTactics/Tests/` e `Source/RefactorTacticsEditor/`.
#                                     ⚠️ Il nome LETTERALE, mai derivato dall'id dell'eroe: i test di
#                                     `Hero.Muiren` si chiamano ancora `RefactorTactics.Heroes.Phase.*`,
#                                     e uno schema che derivasse il nome nascerebbe rosso su codice sano.
#   scenario:<scenarioId>             risolve contro il campo `scenarioId` di `Scenarios/**/*.json`.
#
# Due fatti veri sullo stesso stato sono due righe di `evidence`, non una frase piu' lunga.
#
# ## `applicable: false` — la domanda che non si pone, separata da quella senza risposta
#
# Gli stati restano **quattro**, come `D-102` li fissa. Ma «il bot non sa giocare lo scatto di Aevik» e
# «Aevik non ha uno scatto» sono due fatti diversi, e confonderli manderebbe la conclusione nel verso
# sbagliato: un `FAIL` su una capability che il roster non da' a quell'eroe metterebbe in dubbio dei numeri
# che quella capability non determina. ∴ due assi ortogonali: `state` dice cosa sappiamo dell'EVIDENZA,
# `applicable: false` dice che la domanda non si pone per il ROSTER, e obbliga a `motivo`.
#
# ## ⚠️ Che cosa questa fotografia NON e'
#
# 🔴 **Gli stati vengono da lettura statica, e i token verdi non li confermano.** Che i test citati siano
# verdi e' misurato (`meta.suite`); cio' che NON e' misurato e' il giudizio che li lega a una casella —
# «questo test esercita QUESTA capability con QUESTO eroe». Quella e' una lettura del corpo del test, e
# nessun comando la produce. ∴ un token verde dice «il fatto citato regge», mai «lo stato e' quello giusto».
#
# Il validator sta un gradino piu' in basso ancora: verifica che i token **risolvano**, non che passino —
# la distinzione fra «registrato» e «consentito» che `tools/asset-provenance/check.ts` dichiara per se'.
#
# ⚠️ **Una riga si contesta cambiando l'EVIDENZA, non il giudizio.** Se pensi che una `PARTIAL` sia una
# `PASS`, il modo di dimostrarlo e' un token nuovo che risolva; se pensi che una `PASS` sia troppo generosa,
# il modo e' mostrare che il token non esercita quella capability con quell'eroe.

schema_version: 1

meta:
  decision: D-102
  issue: 543
  owner: docs/technical/runbooks/test-e-diagnosi.md#3-ter
  fotografia: 2026-09-20
  base: origin/main b1b54bb2
  # ⚠️ Non «una suite e' passata», ma: OGNI token `test:` citato qui sotto e' stato eseguito e verde in
  # quella run. Le due cose non coincidono — un filtro puo' non contenere una famiglia citata, ed e'
  # precisamente l'errore che questa riga ha corretto: la prima stesura dichiarava una run che lasciava
  # fuori `Heroes.*` e `Overwatch.*`. Si riverifica cosi':
  #   filtro = Bot+Heroes+HexBot+HexBotPlay+Match+Overwatch+Scenario+Stress
  #   poi si confronta l'elenco dei `Path={...}` del log coi token di questo file.
  suite: 2026-09-20 — 438 test eseguiti, 438 `Result={Success}`; i 43 token `test:` citati qui
         sotto compaiono tutti nel log con `Result={Success}`, nessuno non eseguito.

# I documenti che pubblicano una metrica prodotta da partite AUTOMATICHE, e che percio' devono portarsi
# accanto lo stato di competenza che la determina.
#
# 🔑 **Questa lista non e' decorativa: il gate la fa valere.** `check.py --check` verifica che ognuno di
# questi file citi lo schema, ed esce 1 se l'annotazione sparisce. E' cio' che rende *«una conclusione di
# bilanciamento non e' producibile senza lo stato di competenza accanto»* una proprieta' difesa invece che
# una buona intenzione — per i documenti che la metrica la pubblicano davvero.
#
# ⛔ **Cosa il gate NON puo' fare**: riconoscere una conclusione di bilanciamento NUOVA, scritta in prosa in
# un documento che non e' in questa lista. Nessun comando legge l'intenzione di una frase. Chi pubblica una
# metrica bot-contro-bot altrove aggiunge il proprio file qui, e da quel momento il gate lo sorveglia.
consumers:
  - docs/roadmap/roadmap-checkpoint.md
  - docs/roadmap/v0.1-definition-of-done.md

# La prima riga dell'annotazione, cercata DENTRO ogni consumatore.
#
# 🔑 **Si cerca questa e non il nome del file**, perche' un documento puo' nominare `bot-competence.yaml`
# in una nota storica a mille righe dalla metrica: il gate sarebbe verde su un consumatore che pubblica il
# numero senza la competenza accanto. Chi cambia il testo dell'annotazione cambia anche questa riga, ed e'
# il momento giusto per accorgersene.
ancora: "🧭 **Competenza del bot accanto al numero**"

# Le dieci capability, rese OPERATIVE: ciascuna e' una frase falsificabile, non una definizione.
# Una frase che non si puo' mostrare falsa non puo' produrre un `FAIL`, e uno schema che non sa fallire
# e' un elenco di buone intenzioni.
vocabulary:
  - name: Movement
    means: >-
      Il bot produce una destinazione che `ReachableCells` ha gia' filtrato per budget, blocchi, occupanti e
      archi verticali, e la PRENOTA sullo snapshot condiviso cosi' che il compagno che pianifica dopo non la
      veda libera; a parita' di punteggio sceglie la mossa minima, e permutare le candidate non cambia l'esito.
  - name: BasicAttack
    means: >-
      Con un nemico CONOSCIUTO entro la gittata efficace, sullo stesso piano e in linea di vista, il bot
      genera la candidata «resta e spara», la pesa `WDamage * danno` piu' `WKill` se uccide, concentra il
      fuoco sul bersaglio che muore, e non propone mai un tiro che il gate di targeting rifiuterebbe.
  - name: Dash
    means: >-
      Quando l'eroe ha un'azione `IsFastMovement` pronta, il bot genera le candidate post-scatto, scarta
      quelle che `IsLinearReachable` rifiuta invece di proporre scatti che il resolver annullerebbe, e spende
      lo scatto solo quando batte il movimento normale.
  - name: Defense
    means: >-
      Sotto tiro il bot termina il piano dove la copertura riduce davvero il danno, il kiter arretra quando
      il nemico entra a meta' standoff, e sotto meta' HP usa un'azione che lo rimette in piedi invece di
      attaccare.
  - name: Reaction
    means: >-
      A ogni turno il bot arma UNA reazione fra quelle pronte, scegliendola per punteggio tattico e
      ricadendo sul kit solo a parita' esatta; lo fa prima di ogni `continue` della pianificazione.
  - name: Environment
    means: >-
      Il bot legge la superficie o lo stato pericoloso di una cella e ne tiene conto: evita di terminare il
      piano dove fa male, e sceglie un'azione ambientale quando il terreno la rende piu' redditizia di un
      colpo diretto.
  - name: CoreCombo
    means: >-
      Il bot mette in fila due azioni la cui seconda vale di piu' per effetto della prima — sbilanciare e poi
      spingere, bagnare e poi scaricare — invece di valutare ogni azione in isolamento nel turno corrente.
  - name: MapControl
    means: >-
      Il bot termina il piano sopra la cella obiettivo quando puo' prenderla, preferisce l'obiettivo
      all'avvicinamento dentro il raggio in cui il termine e' acceso, e nega o occupa il terreno erigendo o
      spostando coperture quando l'eroe sa farlo.
  - name: Information
    means: >-
      Il bot pianifica solo su cio' che la sua SQUADRA conosce — su un contatto incerto usa la cella
      dell'ultimo contatto, assume la salute integra e non assume la condizione — e senza nessuno da
      ingaggiare si muove per CAMMINO verso la cella da cui il contatto noto tornerebbe visibile.
  - name: AdvancedCounter
    means: >-
      Il bot anticipa: piazza un'azione predittiva sulla cella in cui il nemico ENTRERA', o arma una guardia
      reattiva sul corridoio che deve attraversare, invece di sparare dove il nemico e' adesso.

