      riparabile qui: dichiarare voci PIE che non esistono sarebbe peggio — e' il difetto che
      `asset-map.md` §6 documenta. Si chiude quando uno dei due campi diventa vero.
      ⏱️ **Aggiornato il 2026-08-18**: questa riga diceva *«dichiarare artefatti prima che `GBX-4` scelga il
