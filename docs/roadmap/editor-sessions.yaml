      quella squadra non conosce **non è a schermo**: né il cilindro, né l'anello, né il cuneo.
      Passando a `Team 1` la vista si ribalta, e in `Omniscient` torna tutto.
      ⚠️ **Il criterio che decide se il confine serviva davvero.** #1715 ha misurato che in partita il salto
      `1.0 / 0.35` del velo basta da solo. Qui il confine è stato aggiunto perché il TD ha camera libera e
      arene arbitrarie: **si guarda se aggiunge qualcosa o se raddoppia** ciò che il velo già dice. Se non
      aggiunge nulla, la risposta onesta è toglierlo — e la misura va scritta, come è stata scritta quella
      che ha chiuso #1715.
      🔑 **L'oracolo è `rt.Debug.Knowledge <team>`**: si apre lo stesso scenario in PIE e si confronta. Le
      due letture devono **concordare** — se divergono, il difetto è che il TD sta calcolando qualcosa di
      suo, che è precisamente ciò che questa slice esiste per non fare.
