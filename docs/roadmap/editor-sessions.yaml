      **Dal 2026-08-12 sono otto**: `PIE-HEX-LAYER-FOCUS`, `-CLICK` e `-PANEL` arrivano col merge di
      #565 (issue 567) e riusano l'asset generato del punto 3 senza aggiungere allestimento. Sono
