  - id: U41
    title: Il banco del laboratorio, e se serve davvero a chi lo apre
    block: 6
    critical: false
    execution_lane: pie
    produces: verdetto sull'usabilità del Playground Panel, e sui tre preset di camera
    artifacts: []
    unblocked_by: [U40]
    shares_setup_with: [U40]
    verifies: []
    issues: [1993]
    done_when: il pannello è cablato, e il verdetto sull'usabilità è scritto — compreso se i tre preset
      di camera inquadrano ciò che promettono
    unblocks: []
    steps: |
      **La domanda è una sola:** *chi apre il pannello capisce dove si trova, ci va, cambia ciò che
      guarda — senza toccare il Details?*

      ⚠️ **Come si apre, e cosa fare quando la voce di menu non si trova.** `Run Editor Utility Widget` è
      registrata in **due** posti — sul Blueprint
      (`AssetDefinition_EditorUtilityWidgetBlueprint.cpp:138`, plugin `EngineAssetDefinitions`, abilitato di
      default) **e** sulla classe generata (`AssetDefinition_WidgetBlueprintGeneratedClass.cpp:101`), che
      però il Content Browser nasconde. Se sul Blueprint non compare, **non dedurne che l'asset sia
      sbagliato**: misurato il 2026-09-02, l'asset dichiara `EditorUtilityWidgetBlueprint` e il plugin è
      attivo. Tre vie, in ordine di affidabilità:
      1. **doppio clic** sull'asset → pulsante **`Run Utility Widget`** nella toolbar dell'editor UMG
         (`BlutilityUMGEditorExtensions.cpp:55`);
      2. la **console Python** (Output Log → menu `Cmd` → `Python`), che non dipende da nessun menu:
         `import unreal; unreal.get_editor_subsystem(unreal.EditorUtilitySubsystem).spawn_and_register_tab(unreal.load_asset('/Game/RT/Editor/GrayKit/UI/WBP_RT_GrayKitPlayground'))`
      3. `Show Generated Classes` nei filtri → destro su `WBP_RT_GrayKitPlayground_C`.
      🔑 **Il pulsante `Run` è NASCOSTO se il tab esiste già** (`FIsActionButtonVisible` interroga
      `DoesTabExist`): al suo posto compare `Stop Utility Widget`. Vedere Stop — o non vedere Run — vuol
      dire che **il pannello è già aperto**, e va cercato fra le finestre, non riaperto.
      Il giro: aprire `WBP_RT_GrayKitPlayground` con una delle due vie sopra → con
      `L_GrayKitPlayground` aperta il pannello dice `Ready` → `Focus` sulla Station 01 → `Select
      Fixture` → il `Facing` si cambia **sei volte** e il marker segue **ogni volta**.

      ⚠️ **Poi si apre un'ALTRA mappa.** Il pannello deve dire `Error` **con una ragione leggibile**, non
      restare vuoto: un pannello muto e un pannello guasto hanno lo stesso aspetto, e il secondo manda a
      cercare un difetto che non c'è. La ragione nomina entrambe le mappe — è verificato headless da
      `PanelMapStateNamesTheReason`, ma che sia *leggibile* lo dice solo un occhio.

      ➕ **I tre preset di camera**: `Close` `100` · `Tactical` `450` · `Overview` `4000`.
      ⛔ Questi numeri vengono da `U25`, ma il legame è una **citazione, non un controllo**: `U25` li tiene
      in prosa e nessun test può leggerli da lì. Se qui inquadrano male, il posto dove dirlo è
      `CameraPresetArmLengths` — e va detto **perché** divergono, come la DoD di #1993 prescrive.

      ⛔ **Le station `02`..`08` non devono sembrare funzionanti.** Una station `PLANNED` esiste come pad e
      signage e non finanzia il proprio sistema: presentarla come le altre è il pannello che promette.
      ⚠️ **Questa voce diceva «chip», e le chip non esistono**: il pannello ha una **tendina**. Chi eseguiva
      la seduta ha cercato dove non c'era niente da guardare, e ha concluso «credo non funzioni» — il
      testo descriveva un disegno mai costruito. Si guarda nella tendina STATION, dove le pianificate
      portano `[PLANNED]` in fondo alla riga.
    notes: >-
      ➕ **Seduta aperta il 2026-09-02 con #1993** (Epic #1990, `D-304`). Non duplica `U40`, e il confine è
      netto: quella guarda **il fixture** — che il facing si legga alle tre distanze e in scala di grigi;
      questa guarda **il banco**, cioè se il pannello serve a chi lo apre.
      ⚠️ `shares_setup_with: [U40]` e `unblocked_by: [U40]`: stessa apertura — `L_GrayKitPlayground` con la
      Station 01 posata — e giudicare il pannello prima che il fixture si legga significherebbe misurare
      due cose insieme.
      ⚠️ **`verifies: []` non è una dimenticanza**: nessuna voce `PIE-GKP-*` esiste in
      `test-manuali-pie.md`, e scriverle non è nello scope di #1993, il cui DoD chiede una voce di seduta.
      È la stessa lettura dichiarata da `U40`, `U10`, `U12`, `U17`, `U23`, `U24` e altre.
      🔴 **Il `done_when` comincia con «il pannello è cablato», e non è pleonastico**: il commandlet genera
      lo **scheletro** dei widget — nomi stabili e le tre righe di `DIAGNOSTICS` prese dal modello — ma
      **non il grafo**. Finché gli eventi non chiamano `URTPlaygroundPanelLibrary`, il pannello si apre e
      non fa niente, e un verdetto di usabilità su un pannello inerte non è un verdetto.
      ➕ **Cablato in parte il 2026-09-02**, col DSL del toolset Blueprint del motore via MCP; la fonte
      leggibile è `Source/RefactorTacticsEditor/Private/Content/RTPlaygroundPanelGraph.dsl`, perché un
      `.uasset` non è diffabile. **Compila** con `warnings_as_errors=true`. Cablati: `EventConstruct`
      (stato mappa e le tre righe di `DIAGNOSTICS`), `Cmb_Facing/OnSelectionChanged` → `ApplyFixtureFacing`,
      `Btn_SelectFixture`, `Btn_ResetFixture`.
      ⛔ **NON cablati, e la seduta deve saperlo prima di iniziare**: le **opzioni** delle due combo
      (`Cmb_Facing` si apre **vuota**, quindi il giro «cambia il `Facing` sei volte» non è eseguibile
      così com'è), `Cmb_Station`, `Btn_Focus` e i tre preset di camera. La causa è una sola e non è
      pigrizia: `ComboBox|AddOption`/`ClearOptions`/`GetSelectedOption` esistono in due varianti con lo
      **stesso** `type_id` (`UComboBoxKey` e `UComboBoxString`) e il DSL prende la prima. Si risolve dal
      commandlet, riempiendo `DefaultOptions` in C++.
      ⚠️ **Il grafo compila ma non è mai stato eseguito**: nessun test headless apre un
      `EditorUtilityWidget`. La prima esecuzione è questa seduta.
      ✅ **ESEGUITA IN PARTE il 2026-09-02 — il pannello funziona.** *«Segue il facing selezionato»*: il
      grafo gira, e questa è la prima evidenza che esista. *«La posizione iniziale punta a Est»* — ed è
      **corretto**, misurato: `ERTHexDirection` comincia con `E` (`RTCellId.h:13`) e il fixture nasce
      `Facing = E` (`RTGrayboxUnitFacingFixture.h:62`), che in mondo è `+X`.
      🔴 **Ma il verdetto è arrivato condizionato — «non so se è corretto perché non so qual è il nord» —
      e la lacuna era del repository, non di chi guardava.** Nessun documento ancorava i nomi bussola agli
      assi: `E = +X` era una conseguenza di `AxialToWorld`, mai dichiarata. Chiuso con tre cose: la
      convenzione in `spec-hex-geometry-authoring.md` §2.1.1 (**`E` è `+X`, quindi `N` è `−Y`, cioè a
      sinistra nella vista dall'alto**), l'ancora letterale in
      `Hex.EastIsWorldPlusXAndTheSixYawsAreDeclared`, e un `EastReference` nella scena — freccia a
      rotazione assoluta con etichetta, presidiata da `Graybox.FixtureEastReferenceDoesNotFollowFacing`.
      ✅ **CHIUSA il 2026-09-02, con verdetto pieno.** Tutte e quattro le osservazioni sono state fatte a
      schermo: il marker segue il facing e la posa iniziale punta a Est (corretto — `E` è la direzione 0);
      lo stato `Error` con un'altra mappa aperta si **legge** e nomina entrambe le mappe; i tre preset
      inquadrano di sbieco come la camera di gioco; e la tendina marca `[PLANNED]` le sette station
      pianificate.
      🔑 **Ma il valore della seduta non è il verde: sono gli undici difetti che ha trovato**, nessuno dei
      quali sarebbe emerso dalla suite — quattro di presentazione (`DIAGNOSTICS` in doppia copia, sei
      pulsanti muti, font 24 per tutti, etichette senza identità), uno visibile **solo a runtime**, quattro
      di lavoro non fatto descritto come impossibile (`Cmb_Station`, `Focus` e i due preset restanti), e due
      numeri **senza owner**: un `Pitch = -90` inventato, fuori dal clamp della camera, e i tre bracci
      `{100, 450, 4000}` che erano una **copia** di `ARTCameraPawn`.
      ⚠️ Piu' un test scritto *per* sorvegliare un difetto che era **verde sul pannello rotto**
      (`PanelDiagnosticsAppearOnce`): la duplicazione era una proprietà di runtime, e contarla nell'asset
      non poteva vederla. Scoperto solo rimettendo il `.uasset` pre-fix.
      ∴ **1804 test verdi non dicevano che il pannello fosse usabile.** È esattamente ciò per cui esiste
      una seduta PIE.
      ⚠️ ID assegnato prima del merge: `U41`, con `U40` come massimo misurato su `main` **e su tutti i
      branch remoti** il 2026-09-02. Chi arriva secondo rinumera, non contende.

  - id: U42
    title: Il corpus Visual, diciotto scenari che nessuna seduta convocava
    block: 1
    critical: false
    execution_lane: pie
    runbook: docs/technical/runbooks/guida-seduta-u42-corpus-visual.md
    produces: verdetto sulle diciotto voci `PIE-VIS-*` giudicabili e aperte, piu' il confronto Guard/Brace
    artifacts: []
    unblocked_by: []
    shares_setup_with: [U43]
    verifies:
      - PIE-VIS-ICE
      - PIE-VIS-WETFIRE
      - PIE-VIS-KO
      - PIE-VIS-CHARGE
      - PIE-VIS-ROUGH
      - PIE-VIS-COMBO
      - PIE-VIS-COORD
      - PIE-VIS-FALLBACK
      - PIE-VIS-SMOKE
      - PIE-VIS-PHASES
      - PIE-VIS-LEVEL
      - PIE-VIS-COVER
      - PIE-VIS-DOOR
      - PIE-VIS-HIGH
      - PIE-VIS-HIGHCOVER
      - PIE-VIS-GUARD
      - PIE-VIS-BRACE
      - PIE-VIS-AREAGUARD
      - PIE-ACC-GUARDBRACE
      - PIE-ACC-ENVIRONMENT
    issues: [231, 233, 1919, 2009]
    done_when: le venti voci di `verifies` hanno esito reale nel registro
    unblocks: []
    steps: |
      **Non c'è niente da allestire, ed è il punto della seduta.** Ognuna di queste diciassette voci ha
      già il proprio scenario in `Scenarios/Visual/`, scritto, versionato e con le sue assertion: il
      corpus di classe B è pronto dal 2026-08-08 (`#231`). Ciò che mancava non era un file — era una
      seduta che le convocasse.

      🔴 **Misurato il 2026-09-03: tutte e diciotto erano ORFANE.** Nessuna compariva in un `verifies`
      di questo file, e il registro PIE dichiara la conseguenza in una riga — *«una voce che non sta in
      una seduta non viene eseguita mai»*.

      ⚠️ **Nessuna `PIE-VIS-*` è verde**, e la prima stesura di questa seduta diceva il contrario —
      *«cinque su ventidue sono verdi»* — sbagliando la misura che decideva quali voci convocare. Il
      comando canonico ristretto al prefisso dà `verde=0 · parziale=1 · aperta=21`. Le quattro che restano
      fuori non sono verdi: `PIE-VIS-PUSH`, `-INTERPOSE` e `-DEFLECT` sono **⛔ non giudicabili oggi** —
      `ERTResolvedEventType` non porta un evento per la spinta né per la reazione, e §8.1 di
      `scenari-validazione-visiva.md` lo dichiara — mentre `PIE-VIS-FIRE` è 🟡, con l'ingresso nel fuoco
      giudicabile e il tick di `Burning` cieco. Convocarle sarebbe chiedere a una persona di guardare
      qualcosa che non viene disegnato.

      Il giro, per ciascuna: `BP_GameMode` → Class Defaults → *RefactorTactics|Test* → `Scenario To Run`
      → Play → si guarda. Cambiare scenario **non** richiede di chiudere l'Editor (regola di batching
      qui sopra): diciassette voci, una apertura.

      ⚠️ **L'oracolo è l'occhio, ma le assertion non sono un residuo.** Uno scenario visivo che diventa
      rosso ti sta dicendo che stai guardando lo stato sbagliato — un VFX perfetto su un colpo che ha
      mancato. Se una di queste esce rossa, il verdetto della voce è *sospeso*, non negativo: prima si
      capisce perché devia la logica.

      🔑 **`PIE-VIS-GUARD` porta una descrizione che [D-292] ha superato.** La voce chiede se «`Guard`
      protegge **una volta**», e dal 2026-08-31 la Guardia è un pool di 15 danni assorbibili che i colpi
      frontali consumano finché dura. Il suo scenario resta verde perché con un colpo da 22 le due regole
      danno lo stesso numero — è la ragione per cui il corpus non se n'era accorto (`#1919`) — ma chi
      esegue la voce sta leggendo una regola che non esiste più. Il caso che le distingue è
      `Spec.Combat.GuardPoolSpansMultipleHits`, ed è di classe A: qui si guarda, non si giudica la regola.

  - id: U43
    title: Il velo e il puntatore — le voci che i due compositi allestiscono già
    block: 1
    critical: false
    execution_lane: pie
    produces: verdetto sulle voci della conoscenza parziale e sul puntatore in partita
    artifacts: []
    unblocked_by: []
    shares_setup_with: [U42]
    verifies:
      - PIE-KNOW1
      - PIE-KNOW2
      - PIE-KNOW3
      - PIE-KNOW4
      - PIE-KNOW5
      - PIE-VELO-VIEWER
      - PIE-V01-POINTER
    issues: [151]
    done_when: le sette voci hanno esito reale nel registro
    unblocks: []
    steps: |
      **Due scenari, sette voci.** `Visual.Perception.Acceptance` porta in una sola scena i tre stati del
      velo — osservato, ricordato, mai visto — e `Visual.Hud.FirstPlayable` porta la partita in uno stato
      ricco. Entrambi gli scenari sono **verdi headless**, quindi la scena si allestisce e lo stato è
      quello giusto: non c'è niente da preparare prima di premere Play.

      ⚠️ **Le due voci ombrello restano ⏳, e la prima stesura di questa seduta le dava per verdi.** Il
      registro dice l'opposto e ne scrive la ragione: *«resta ⏳ perché nessuno l'ha GUARDATO — il verde
      headless dice che la scena si allestisce, non che i tre stati si distinguano a schermo»*. È la
      stessa distinzione che `PIE-ACC-GUARDBRACE` porta scritta in U42, e leggerla al contrario proprio
      qui avrebbe fatto dichiarare fatta la parte che questa seduta esiste per fare. Lo stato delle voci
      lo dice `test-manuali-pie.md`, che ne è l'owner: questo file cita gli ID e non li giudica (R-6).

      🔴 **Ed erano orfane tutte e sette**, misurato il 2026-09-03: il composito era stato scritto
      apposta per loro il 2026-08-31, e nessuna seduta lo convocava. Uno scenario di acceptance che
      nessuno apre costa quanto uno che non esiste.

      Il giro: `Scenario To Run = Visual.Perception.Acceptance`, `Scenario Turn Pause Seconds` alto
      abbastanza da vedere i tre turni separati, Play. Le cinque `PIE-KNOW*` e `PIE-VELO-VIEWER` si
      giudicano lì dentro, nell'ordine in cui i `_turno` del file le nomina. Poi
      `Scenario To Run = Visual.Hud.FirstPlayable` per `PIE-V01-POINTER`, nello stesso processo.

      ⚠️ **`PIE-ICON-01`, `PIE-V01-KIT-HOTKEYS`, `PIE-V01-LOG` e `PIE-V01-FALLBACK` NON stanno qui**,
      benché `Visual.Hud.FirstPlayable` dichiari di allestirle: hanno già una seduta (U9, U18, U15, U14)
      e una voce in due sedute è una voce che nessuna delle due esegue.

  - id: U44
    title: Il playback dello scenario si legge — la risoluzione che scorre nel viewport
    block: 6
    critical: false
    execution_lane: pie
    produces: verdetto di leggibilita' del playback graybox della risoluzione
    artifacts: []
    unblocked_by: [U21]
    shares_setup_with: []
    verifies: []
    issues: [1625]
    done_when: >-
      guardando il campo scorrere si capisce **perche'** lo scenario finisce cosi'. Non «si vede
      qualcosa muoversi» — quello lo dicono gia' i test — ma se la sequenza risponde alla domanda per
      cui il playback esiste. ⚠️ E' la stessa asticella con cui `PIE-PREVIEW-AREA` e' stata chiusa il
      2026-08-09: la risposta che valeva era «**si', si capisce**», non «si vede».
    unblocks: []
    notes: >-
      ➕ **Aperta il 2026-09-03 chiudendo l'ultimo anello di `#1625`.** La catena headless e' completa —
      trasporto (`#2095`), stato ricostruito dalla traccia (`#2173`), identita' fra i due spazi di id
      (`#2176`), traduzione verso le viste (`#2185`) e il subsystem che le collega — e cio' che resta
      non lo puo' chiudere nessun automation test: `ARTScenarioPreviewActor` posa istanze in un
      viewport d'editor, e nessun test le guarda.
      🔴 **`#1625` diceva «seduta `U26`», e quel puntatore non reggeva.** `U26` esiste ma e' *«La
      griglia di lavoro e la sonda di movimento nell'editor»*: un'altra scena, un'altra domanda.
      Misurato il 2026-09-03. Questa seduta e' la sede vera, e la issue e' stata corretta.
      **Allestimento**: si apre uno scenario del corpus con almeno due squadre nel launcher del
      Tactical Designer, si esegue (`Run`), e si apre il playback sull'ultima corsa. Poi si scorre
      turno per turno e fase per fase. ⚠️ Serve una corsa **prima**: senza, il playback si rifiuta di
      aprirsi — deliberatamente, perche' un campo vuoto somiglierebbe a una partita in cui non e'
      successo niente.
      ⛔ **Cosa NON va ricontrollato qui, perche' e' gia' misurato**: che le unita' finiscano nella
      cella e nel facing che la traccia dichiara (`RefactorTactics.Replay.State.*`), che gli id siano
      tradotti con la corrispondenza vera e non per indice (`Scenario.Playback.*`, con mutazione), e
      che senza una corsa non si apra (`DevSandboxLauncher.PlaybackRefusesWithoutARun`). Chi esegue
      questa seduta guarda **la sequenza**, non i valori.
      🔑 **Le domande di giudizio**, che sono il contenuto vero della seduta: si distingue chi si e'
      mosso da chi e' rimasto fermo? Un'unita' abbattuta **sparisce** in un momento leggibile, o
      semplicemente non c'e' piu' al giro dopo? Cambiando prospettiva a meta' playback, il velo e i
      marcatori raccontano lo **stesso** istante? L'ultima e' la giuntura piu' fragile: conoscenza e
      marcatori si calcolano sulla stessa sorgente proprio perche' due istanti diversi insieme
      sarebbero il difetto che si vede solo a schermo.
      ⚠️ **`verifies: []` e' voluto, come in `U24` e `U26`**: le voci `PIE-*` non esistono ancora e
      non vanno create adesso. Le scrive chi esegue la seduta, quando sapra' che aspetto ha cio' che
      ha guardato — il registro PIE e' una lista di cose *verificabili*, non di cose desiderate.
      ⚠️ **`unblocked_by: [U21]`** per la ragione pratica di `U22` e `U26`: su una scena non illuminata
      il verdetto direbbe piu' sulle luci che sul playback.
      ⚠️ ID assegnato dopo aver misurato il massimo su `main` **e su tutti i branch remoti**: `U43`,
      che vive anche su `origin/fix/1793-2167-posa-e-offset`. Preso `U44`. Chi arriva secondo rinumera,
      non contende.
