  - id: U20
    title: Confine fra Guard e Brace
    block: 6
    critical: false
    execution_lane: pie
    produces: verdetto di leggibilita' — un dato per `BAL-1`, non un difetto da correggere
    artifacts: []
    unblocked_by: [E5.2]
    shares_setup_with: []
    verifies: [PIE-BAL1]
    issues: []
    done_when: la voce ha un esito reale nel registro, in un verso o nell'altro
    unblocks: []
    steps: |
      ⛔ **NON ESEGUIBILE finche' D-204..D-208 non sono implementate**, e i passi qui sotto dicono
      perche': i numeri attesi che questa seduta prescriveva erano l'aritmetica della coppia
      **vecchia**, e tre su quattro sono superati. Girarla oggi risponderebbe a una domanda che
      `BAL-1` non fa piu'. Vedi la nota in fondo per l'unico uso legittimo adesso.

      **Mappa**: `L_DevSandbox` (`Data/DA_HexMap_Sandbox`), come le sorelle di blocco 6 `U21`,
      `U22`, `U25` e `U26`. Questa seduta non la dichiarava, ed era una lacuna sua.

      **Non e' una caccia ai difetti: e' una domanda di leggibilita'.**

      ➕ **L'allestimento NON si costruisce a mano: esiste gia' come scenario**, e fino al 2026-08-27
      questa seduta non lo nominava — chi la eseguiva ricostruiva a mano una scena che il repository
      aveva gia'. `Spec.Brace.GuardAndBraceOnMixedHit` E' esattamente cio' che i passi descrivevano:
      tre difensori (uno in `Action.Guard`, uno in `Action.Brace`, uno senza) e tre Phase che usano
      `Hero.Phase.PressureJet` su ciascuno **nello stesso turno** — l'unica azione che porta danno
      **e** spinta insieme.

      `rt.Test.Scenario` e' una **CVar**, non un comando: impostata, il GameMode esegue lo scenario
      invece della partita normale.

      ```text
      rt.Test.Scenario Spec.Brace.GuardAndBraceOnMixedHit   -> Play -> guarda
      rt.Debug.DumpTurnLog                                   -> SOLO dopo aver guardato
      rt.Test.Scenario Spec.Brace.PushBeyondGuardThreshold    -> Play -> stessa scena, spinta 2
      rt.Test.Scenario ""                                    -> svuotare, vedi sotto
      ```

      > 🔴 **Svuotare la CVar non e' pignoleria**: dura quanto il **processo dell'editor** e scavalca
      > la tendina del GameMode **a ogni Play**. Lasciata piena, ogni partita successiva continua a
      > girare lo scenario, e non e' evidente dal gioco.

      **Perche' due scenari.** Il secondo cambia **una cosa sola** — la spinta passa da 1 a 2, per
      `Weapon.Impact` ([D-085]) — e l'esito si separa: con spinta 1 reggono entrambi, con spinta 2 la
      `Guard` cede e il `Brace` regge. E' il caso che oggi distingue davvero le due difese, ed e'
      quello che [D-205] **inverte**. Un terzo, `Visual.Combat.PushResistance`, mostra la `Guard`
      contro chi non ha difesa.

      ⚠️ **Quei tre scenari sono VERDI oggi e le loro `expect` sono le HP della coppia vecchia.** Il
      giorno in cui D-204/D-205 atterrano **diventano rossi**, ed e' corretto che lo diventino:
      `GuardAndBraceOnMixedHit` misura proprio il rapporto che le decisioni scambiano.

      1. Guarda il turno **senza leggere i numeri**. La domanda non e' piu' *«si distinguono?»*: da
         [D-208] le due difese hanno lo **stesso prezzo** — principale, `Status.Slow`, niente slot
         reazione — quindi nessun costo le annuncia. La domanda e' **«la differenza di GENERE si
         vede?»**: la `Guard` assorbe in modo **sostenuto** dentro un arco **frontale** di 120°, il
         `Brace` risponde **a un evento** da **ogni lato**, con il profilo d'eroe sopra.
      2. Solo dopo, controlla il log. ⚠️ **I valori attesi vengono da `BAL-3`**, che e' aperta: non
         sono piu' *«1 contro 6»*. Prima di girare la seduta, prendi i numeri provvisori da li'.
      3. Ripeti con **due** colpi sullo stesso bersaglio. ⚠️ Il vecchio *«l'ordine si inverte, 17
         contro 12, ed e' il solo caso in cui `Brace` conviene»* **non vale piu'**: da [D-205] la
         `Guard` e' sostenuta e non si consuma sul primo colpo, e da [D-204] `Hold Ground` risponde a
         un evento invece di coprire il turno.
      4. ➕ **Passo nuovo, e l'unico che `D-206` rende obbligatorio**: due attaccanti da **direzioni
         diverse** — uno dentro l'arco frontale del difensore, uno alle spalle. La `Guard` deve
         reggere sul primo e farsi scavalcare sul secondo (`RearHitBypassedGuard` nel log), il
         `Brace` deve reggere su entrambi. E' il caso che separa le due geometrie, e prima di
         `D-205` non poteva esistere.

      > ⚠️ **Non mettere due attaccanti sullo stesso bersaglio nello stesso passaggio** al punto 3:
      > il resolver esclude i bersagli spinti da 2+ attaccanti (forze contraddittorie). Misureresti
      > quella regola, non questa. Al punto 4 il problema non si pone se i due colpi non spingono
      > entrambi.
    notes: >-
      Nasce dal piano `BAL-1` (`plans/bal-1-guard-brace-roadmap-2026-08-10.md` §6). **Non entra nel
      subset `RELEASE-V01`**: `BAL-1` non blocca la consegna, e un gate che si allarga senza motivo
      e' il difetto che G9 ha gia' avuto due volte. La seduta ha una voce sola di proposito — e' una
      domanda che si risponde una volta, guardandola.
      ⚠️ ID assegnato al merge: preso `U20` con `U19` come ultimo su `main`. Chi arriva secondo
      rinumera, non contende.
      🔴 **Riscritta il 2026-08-27 da D-204..D-208**, che hanno scambiato i mestieri delle due
      difese: i numeri attesi erano fissi e sono diventati falsi, e nessuna riga lo diceva. La
      mappa e' stata **dichiarata** nella stessa passata — non c'era — e in PROSA come fanno le
      altre sedute, invece che in un campo nuovo: un asse in piu' nello schema per una riga sola
      sarebbe stato piu' caro del problema.
      ➕ **Gli scenari sono stati NOMINATI il 2026-08-27**: `Spec.Brace.GuardAndBraceOnMixedHit`,
      `Spec.Brace.PushBeyondGuardThreshold`, `Visual.Combat.PushResistance`. Esistevano da prima, e la
      seduta li descriveva in prosa senza dire che erano gia' scritti — la stessa lacuna della mappa.
      ➕ **L'unico uso legittimo prima dell'implementazione e' la BASELINE**: girarla sulla coppia
      vecchia — quella spedita, e quella che `D-121` aveva confermato — per avere il «prima»
      misurato. Va registrato come baseline, mai come risposta a `BAL-1`.

  - id: U21
    title: Luci del graybox e inquadratura della mappa
    block: 6
    critical: false
    execution_lane: pie
    produces: verdetto su leggibilita' della scena e inquadratura, piu' il livello illuminato committato
    artifacts: []
    unblocked_by: []
    # ➕ `U25` aggiunta il 2026-08-17: condivide l'allestimento e ne dipende per la stessa ragione di
    # `U22` — una scena di leggibilita' valutata prima delle luci direbbe piu' sulle luci che sull'oggetto
    # guardato. Il validator e' bidirezionale e non lascia dichiarare la relazione da un lato solo.
    # ➕ `U26` aggiunta lo stesso giorno da `D-154`, per la stessa ragione e con lo stesso vincolo. Due
    # sessioni parallele hanno appeso una seduta a questa senza vedersi: l'elenco e' l'unione, misurata
    # sull'albero unito. **Quattro sedute** condividono ora `L_DevSandbox` illuminato, ed e' un argomento
    # per aprirle nella stessa apertura invece che in quattro.
    shares_setup_with: [U22, U25, U26]
    verifies: [PIE-MAPED-LIGHT, PIE-MAPED-FRAME]
    issues: [623]
    done_when: le due voci hanno un esito reale e il livello illuminato e' committato
    unblocks: [U22, U25, U26]
    notes: >-
      Nasce dal referto `plans/map-sketch-editor-spec-panel-2026-08-12.md` (`P6`). E' una seduta e
      non una issue di codice per una ragione strutturale: `L_DevSandbox.umap` e' un `.umap`, e
      questo repository non modifica `.umap` da riga di comando.
      ⚠️ `artifacts` e' VUOTO di proposito, benche' la seduta committi un livello. L'oracolo degli
      artefatti e' `git ls-files`, che sa dire se un path esiste e non se e' stato MODIFICATO:
      `L_DevSandbox.umap` e' gia' tracciato da mesi, quindi dichiararlo qui farebbe derivare 🟡
      («parte fatta») su una seduta non ancora aperta. Lo stato deriva dalle due voci PIE, che sono
      la cosa che davvero non esiste ancora. Il livello committato resta nella DoD della issue.
      ⚠️ Il sorgente chiedeva anche di ricostruire la navigazione della camera (MMB pan, RMB orbit,
      wheel zoom, WASD, F focus). **Il viewport di Unreal le fornisce gia' tutte**, e un `UEdMode`
      non possiede la camera del viewport: `RTCameraPawn` e' la camera di GIOCO, un oggetto diverso.
      Resta solo l'inquadratura della mappa, che e' `PIE-MAPED-FRAME`.
      ⚠️ ID assegnato al merge: preso `U21` con `U20` come ultimo su `main`. Chi arriva secondo
      rinumera, non contende.
      ---
      **COSA FAI** — i passi stanno qui perche' nessuna guida copre ancora l'illuminazione: la
      checklist di `convenzioni-contenuti-ue.md` §12 riguarda dove va un asset, non come si accende
      una scena. Stessa ragione per cui `U1` e `U16` portano i propri.
      **0. Misura il prerequisito invece di assumerlo.** Entrambe le voci PIE chiedono celle su **≥2
      layer**, e `PIE-MAPED-FRAME` chiede anche celle **lontane dall'origine**. Se `L_DevSandbox` non
      le ha, dipingile prima: tool **Paint** con `BrushRadius` alto per il piano 0, `ActiveLayer=1`
      per il secondo, tool **Arch** per una transizione. `rt.Arena.Check` dice se la mappa ha celle;
      la vista `Focus` dice se i piani sono due. Cosi' facendo cambia anche
      `Data/DA_HexMap_Sandbox.uasset`, ed e' il motivo per cui la lease copre **entrambi** i package.
      **1. Le luci, e perche' sono piu' di una.** Il criterio di `PIE-MAPED-LIGHT` vieta esattamente
      *«una meta' leggibile e una no»*, che e' la firma di una **sola** luce direzionale: la faccia
      opposta al sole non riceve niente. Serve quindi anche una sorgente ambientale che riempia
      l'ombra, e qualcosa che quella sorgente possa raccogliere. Il sorgente proponeva
      `Directional Light` + `Sky Light` + `Sky Atmosphere`: la combinazione e' ragionevole, ma il
      criterio e' l'**orbita**, non la lista degli attori — chi la ottiene con meno pezzi ha
      comunque ragione.
      **2. L'esposizione si fissa NEL LIVELLO, non nella viewport.** Il prerequisito dice *«nessuna
      modifica all'esposizione della viewport»*, e non e' un dettaglio procedurale: se la scena si
      legge solo dopo aver alzato l'esposizione a mano, allora non si legge — e le altre tre sedute
      che ereditano questo allestimento vedrebbero altro. Un `Post Process Volume` **unbound** nel
      livello e' lo scope giusto.
      ⛔ **NON toccare `Config/DefaultEngine.ini`** per l'auto-exposure di progetto: cambiare un default
      di progetto per un banco di prove distruttive e' il caso che `#926` ha gia' respinto — «paga un
      binario e cambia il comportamento predefinito del gioco che si distribuisce». *(La riga citava
      anche `Config/` come `integration_only` nel batch: quel vincolo e' decaduto con `D-178`, la
      ragione di merito no.)*
      **3. Il verdetto e' un'orbita, non uno screenshot.** Gira attorno alla mappa e guarda le facce
      che il sole non prende: superficie, marcatori blocca-movimento/blocca-vista e contorni dei
      piani di contesto devono restare distinguibili **da ogni angolo**.
      **4. `PIE-MAPED-FRAME` nella stessa apertura.** Con il mode Hex Map attivo, premi **`Home`**:
      la vista deve portare dentro **tutte** le celle, comprese quelle sui layer diversi da
      `ActiveLayer` e quelle lontane dall'origine. ⚠️ Il comando arriva con `#623` parte B: serve un
      editor compilato **dopo** quel merge, o il tasto non fa niente e il verdetto sarebbe sul
      binario sbagliato.
