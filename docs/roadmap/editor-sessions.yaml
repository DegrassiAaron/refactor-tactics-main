  - id: U18
    title: Verifiche senza prerequisiti
    block: 1
    critical: false
    execution_lane: pie
    produces: verdetto su diciassette voci che non attendono nulla
    artifacts: []
    unblocked_by: []
    shares_setup_with: []
    verifies:
      - PIE-PREVIEW-AREA
      - PIE-V01-MATCHEND
      - PIE-TEST-CONSOLE
      - PIE-HEX-LAYER
      - PIE-HEX-TRANS
      - PIE-HEX-LAYER-FOCUS
      - PIE-HEX-LAYER-CLICK
      - PIE-HEX-LAYER-PANEL
      - PIE-V01-KIT-HOTKEYS
      - PIE-V01-SHIELD
      - PIE-V01-REACTCOND
      - PIE-HEX-VIZ-BLOCCHI
      - PIE-HEX-VIZ-COSTO
      - PIE-HEX-VIZ-BORDI
      - PIE-HEX-VIZ-PORTE
      - PIE-HEX-VIZ-UNDO
      - PIE-HEX-VIZ-TRANSIZIONI
    issues: [450, 567, 583, 551, 552, 553, 554]
    done_when: le diciassette voci hanno esito reale nel registro
    unblocks: []
    steps: |
      **E' la sola seduta che non attende nulla**: nessun checkpoint da chiudere, nessuna seduta
      prima, nessun artefatto da committare. *Senza prerequisiti* non vuol dire *senza allestimento*:
      le prime tre voci si fanno premendo Play sull'arena di ripiego, le ultime due in editor, su un
      asset **generato e usa-e-getta** — nessuna mappa da costruire a mano, e niente che finisca in
      git.

      > ⚠️ **Prima delle tre voci in Play, controlla che `Scenario To Run` sia vuoto**
      > (`BP_GameMode` → Class Defaults → *RefactorTactics|Test*) e che `rt.Test.Scenario` in console
      > sia vuota — quest'ultima **prevale** sulla property e dura quanto il processo dell'editor. Con
      > uno scenario impostato la partita normale non viene allestita affatto e tutte e tre le voci
      > diventano non eseguibili. E' successo il 2026-08-08, uscendo da `PIE-SCEN-KEEP`.

      **`PIE-V01-KIT-HOTKEYS`** (aggiunta il 2026-08-26) si fa nella stessa partita e va **prima** di
      `PIE-V01-REACTCOND`, di cui e' la precondizione: fino al 2026-08-26 i tasti abilita' erano `1`-`4`
      e il kit ne ha dieci voci, quindi la reazione di Gadget — indice 4 — non si poteva armare e
      `REACTCOND` risultava non eseguibile. Ora i tasti sono `1`-`9` piu' `0`.

      **`PIE-V01-SHIELD`** (aggiunta il 2026-09-03, #1403) si fa nella stessa partita e va **dopo**
      `PIE-V01-KIT-HOTKEYS`, di cui e' il caso particolare: quella stabilisce che i tasti rispondano,
      questa che risponda la **sesta posizione**. Chiede l'unica preparazione in piu' della seduta:
      selezionare **Phase**, non l'unita' di default — `Hero.Phase.TideGuard` e' la sesta voce del suo
      kit, cioe' il tasto **6**. E' esattamente il caso che `D-224` aveva fatto **ritirare** quando il
      kit contava undici voci per dieci tasti, e nessun test automatico lo distingue da un successo.
      ⚠️ **`Hero.Wraith.PhaseGuard` non si verifica qui**: e' il gemello di `TideGuard`, ma nella
      formazione di default Wraith sta in **team 1** e il giocatore non ne arma le azioni. Chiederlo in
      questa partita sarebbe una verifica impossibile.

      **`PIE-V01-REACTCOND`** (aggiunta il 2026-08-12, [D-109]) si fa in Play e chiede un ordine
      preciso: prima **arma una reazione** sull'unita' selezionata — nell'allestimento di default e' il
      tasto **5**, cioe' `Hero.Gadget.ReactiveCapacitor` all'indice 4 — poi `rt.Reaction.Condition 50`.
      Al contrario il comando rifiuta, ed e' il comportamento giusto — una condizione senza reazione
      resterebbe orfana. Si verifica il **canale**, non l'effetto: le risposte legali si riducono
      davvero, ma la finestra che quel collasso evita non esiste finche' non atterra CP 14.5, e
      quella parte e' coperta headless da `Reactions.DeclaredConditionCollapsesToImmediateCommit`.

      L'ordine non e' arbitrario:

      1. `PIE-PREVIEW-AREA` e `PIE-V01-MATCHEND` su una partita normale.
      2. `PIE-TEST-CONSOLE` per **ultima**, e non per gusto di ordine: `rt.Test.Run` **sostituisce
         la mappa** e aggiunge unita' alla partita in corso. Eseguirla prima lascerebbe le altre due
         su uno stato che non e' quello che dicono di verificare. Dopo, si riavvia con `R`.
      3. `PIE-HEX-LAYER` e `PIE-HEX-TRANS` in coda, sull'**editor** e non in Play: servono un
         `ARTHexMapActor` con celle su >=2 layer, che si ottiene con `GenerateIntoAsset` —
         `ActiveLayer=0`, poi `ActiveLayer=1`. Nessuna mappa da costruire a mano.
      4. Le tre `PIE-HEX-LAYER-*` **sullo stesso asset del punto 3**, senza rigenerare nulla: e' per
         questo che stanno qui e non in una seduta propria. In piu' serve il mode **Hex Map** attivo,
         perche' i contorni dei piani di contesto li disegnano i tool, non l'actor: con `LayerView=Focus`
         ma senza mode attivo e senza `bShowOverlay` acceso nel pannello del tool, `Focus` e'
         indistinguibile da `ActiveOnly` — e la voce sembrerebbe fallita mentre e' solo non allestita.

         > ⚠️ **`PIE-HEX-LAYER-CLICK` va fatta con la camera OBLIQUA**, non dall'alto. Il difetto che
         > verifica e' che il raggio del click agganci il disco di un piano superiore e venga poi
         > proiettato su quello attivo: lo scarto e' orizzontale e proporzionale a `LayerHeight`,
         > quindi guardando a picco vale zero e la voce passerebbe comunque, rotta o no.
      5. Le sei `PIE-HEX-VIZ-*` **in coda, e con un allestimento proprio**: sono l'unico gruppo di
         questa seduta che non riusa l'asset del punto 3.

         > 🔴 **Questo passo diceva «servono coperture e porte, quindi si parte da
         > `MakeCoverYardArena`», ed e' stato riscritto il 2026-08-17 dopo averlo misurato.** La fixture
         > **non ha porte**: 37 celle di pavimento, una copertura alta e una bassa, e il suo commento
         > dichiara *«nessuna superficie, di proposito»*. Copre `-BORDI` e nient'altro. Chi seguiva il
         > passo alla lettera si allestiva UNA voce su sei e scopriva le altre cinque davanti allo
         > schermo — il costo di una frase che nessun gate legge.

         Da dove viene ciascun allestimento, misurato:

         | Voce | Allestimento |
         |---|---|
         | `-BORDI` | `FixtureId = CoverYard` → `GenerateFixtureIntoAsset`. **Basta** |
         | `-BLOCCHI` | **Paint**: una cella `bBlocksMovement`, una `bBlocksLineOfSight`, una con entrambi. Nessuna fixture ha il caso *solo-movimento* |
         | `-COSTO` | **Paint**: `Surface=Rough` + `MoveCost=2` + `bBlocksLineOfSight` sulla **stessa** cella. Le `Rough` di `ArenaV01` non bloccano la vista |
         | `-PORTE` | ⛔ **nessun tool porte esiste** (`grep -rn "Door" Source/RefactorTacticsEditor/` → zero). A mano nel Details dell'asset, poi si forza il ridisegno |
         | `-UNDO` | qualsiasi cella dipinta, poi `Ctrl+Z`; poi salvare e riaprire il livello |
         | `-TRANSIZIONI` | `ArenaV01` da' la piattaforma **collegata**; il gruppo **orfano** si dipinge su layer 1 senza archi |

         > ⚠️ **Dopo aver scritto porte a mano nell'asset, il viewport non si aggiorna da solo.**
         > `URTHexMapAsset` non fa override di `PostEditChangeProperty` — il solo `OnMapChanged.Broadcast()`
         > sta in `PostEditUndo` — quindi l'actor non sa di dover ridisegnare. Si tocca una property
         > qualsiasi dell'actor (`ActiveLayer` 0→1→0), che passa da `PostEditChangeProperty →
         > RebuildInstances`. Senza, si guarda la geometria vecchia: l'ennesimo modo di segnare ❌ una
         > voce **non allestita**.

         > ⚠️ **`PIE-HEX-VIZ-BLOCCHI` e `-COSTO` si guardano DALL'ALTO** — e' la vista di lavoro, ed
         > e' quella in cui il difetto del 2026-08-12 si vedeva: la lastra della vista era piu' alta
         > E piu' larga del rilievo del costo, quindi ogni cella costosa che bloccava la vista taceva
         > sul proprio costo. Di taglio le due forme si distinguono comunque e la voce passerebbe.

         > ⚠️ **`PIE-HEX-VIZ-TRANSIZIONI` va fatta con un tool DIVERSO da Arch** (Paint o Fill). Il
         > difetto che verifica e' che le transizioni si vedessero **solo** dentro il tool Arch: con
         > Arch attivo la voce passerebbe sempre, prima e dopo la correzione.
    notes: >-
      Nasce dalla sessione G del registro (2026-08-08), che non aveva una seduta corrispondente:
