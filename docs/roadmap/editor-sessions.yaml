# Sedute in editor — la sorgente della EditorMap
#
# Owner dei DATI delle sedute U*.
#
# ⛔ **Questo file non ha piu' una vista, e non ha piu' un consumatore.** La vista leggibile era
# `editormap.shortlist.md`, generata da `feature_registry.py shortlist`: entrambi sono usciti dal
# repository il 2026-08-21 (D-181). **Nessuno script legge questo file**, e da D-182 nel repository non
# c'e' piu' nemmeno uno script che lo cammini come testo generico: `scripts/` e' stata rimossa.
#
# ⚠️ Chi aggiunge una seduta oggi scrive in un file che nessuno rende. Resta perche' il CONTENUTO vale
# — 27 sedute con passi, prerequisiti e artefatti, scritti a mano — non perche' qualcosa lo consumi.
# L'esito delle voci `PIE-*` vive in `docs/technical/test-manuali-pie.md`, che lo rende leggibile.
#
# Regola che questo file esiste per far rispettare (R-6 della spec):
#   qui si citano gli **ID** delle voci PIE, mai il loro esito atteso.
#   L'esito atteso vive in `docs/technical/test-manuali-pie.md`, che ne resta l'unico owner.
#   Se ti trovi a scrivere qui cosa dovrebbe succedere, stai scrivendo nel file sbagliato.
#
# Cosa e' derivato e non va scritto qui:
#   - lo stato della seduta       -> dalle voci `verifies` + `git ls-files` su `artifacts`
#   - lo stato delle voci PIE     -> da `test-manuali-pie.md`
#   - lo stato di checkpoint/epic -> da `roadmap-checkpoint.md` e `roadmap-v0.1.md`
#
# Campi:
#   id                 stabile, mai riusato per un'altra seduta
#   title              una riga
#   block              raggruppamento tematico, nell'ordine in cui compare nella vista
#   critical           true = blocca la v0.1
#   produces           cosa esce, in una riga (asset committato oppure verdetto)
#   artifacts          path repo da verificare con `git ls-files`; vuoto se produce un verdetto
#   unblocked_by       checkpoint/epic/sedute che devono avere il CODICE fatto (un 🟡 basta e anzi e' il
#                      caso normale). **Sempre prefissato**, perche' i due spazi di numerazione dei
#                      checkpoint collidono su 20 numeri su 22: `6.3` e' «input hex» in M6 e «Phase» in E6.
#                      Forme ammesse:  M6.3 (checkpoint di milestone, owner `roadmap-checkpoint.md`)
#                                      E1.3 (checkpoint di epic,      owner `roadmap-v0.1.md` §2.2)
#                                      E8   (epic intera,             owner `roadmap-v0.1.md` §2.1)
#                                      U13  (un'altra seduta,         owner questo file)
#                      La forma nuda `CP 6.3` e' vietata: non dice quale dei due spazi, e nessun comando
#                      puo' risolverla. Corretta il 2026-08-10 su sette record.
#   shares_setup_with  sedute con lo stesso allestimento: falle nella stessa apertura
#   verifies           ID delle voci PIE (senza il marcatore `RELEASE-V01`)
#   issues             numeri GitHub, dichiarati a mano: lo script non parla con la rete
#   done_when          condizione osservabile, non impressione
#   unblocks           sedute e checkpoint a valle. **Stesse forme di `unblocked_by`**: la coda le
#                      stampa, e un `CP 6.1` stampato e' ambiguo per chi legge esattamente come per un
#                      parser. Attenzione: lo stesso lavoro puo' avere tre nomi — «misurazione dei
#                      budget» e' E3.3 nella vista di release, M7.3 in quella di esecuzione ed E12.4
#                      come gate: U16 li dichiara tutti e tre, e non e' un errore.
#                      Verso un'ALTRA SEDUTA `unblocks` e' duale di `unblocked_by`: se `U10` sblocca
#                      `U11`, allora `U11` e' sbloccata da `U10` e lo dichiara. L'unica eccezione e' il
#                      setup condiviso **nello stesso blocco** — `U2..U6` (blocco 2) e `U7..U9`
#                      (blocco 3) si fanno nella stessa apertura, quindi la catena e' ordine di lavoro
#                      e non un blocco, e la coda deve mostrarle insieme.
#                      Fuori da quel caso l'asimmetria e' un difetto: la coda direbbe che una seduta
#                      si puo' cominciare mentre la sua premessa non c'e'. Il validator lo verifica.
#                      «Stesso blocco» e' la parte che conta: condividere l'allestimento NON esclude
#                      la dipendenza dura. `U13` estende l'asset che `U1` committa **e** ne condivide
#                      il setup; scusare ogni coppia col setto condiviso avrebbe reso invisibile
#                      proprio quella dipendenza. Blocchi diversi = **ordini di lavoro** diversi.
#                      ⚠️ Questa riga diceva «Blocchi diversi = aperture diverse» fino al 2026-08-31,
#                      e con 6 blocchi implicava **6 aperture** — in diretta contraddizione col piano
#                      operativo, che ne prevede 2. Nessuna delle due era falsa quando fu scritta: la
#                      regola nasce quando l'apertura coincideva col blocco. Il criterio corretto non
#                      e' il blocco ma la PRECONDIZIONE — vedi «Regola di batching» qui sotto.
#   execution_lane     `pie` | `asset` — che TIPO di lavoro e', non che evidenza produce.
#                      Facoltativo, ma il default e' insidioso: assente significa `pie`, che era il
#                      caso di tutte le sedute
#                      prima che il campo esistesse. Il criterio e' l'OUTPUT PRIMARIO:
#                        pie    il risultato e' un verdetto umano, un playtest, una verifica a
#                               schermo — la persona guarda e giudica
#                        asset  il risultato e' un asset importato/configurato/committato — la
#                               persona costruisce, e il verdetto viene dopo
#                      La distinzione non e' `verifies`: U7 produce quattro Blueprint (`asset`) e
#                      verifica anche PIE-AS2/PIE-FACING. Il tipo di lavoro e l'evidenza sono due
#                      cose diverse, e confonderle rimetterebbe tutto in `pie` — cioe' toglierebbe
#                      al campo la sola domanda a cui serve rispondere: **cosa mi serve per farla,
#                      il gioco che gira o gli asset che non ho ancora?**
# ── Regola di batching delle aperture Editor ────────────────────────────────────────────────────
#
# Scritta il 2026-08-31. Il piano operativo CURRENT vive nel documento Drive
# `RefactorTactics_v0.1_Editor_Sessions_Roadmap`, sezione `CURRENT v2 — Mega-session roadmap`;
# qui sta solo la REGOLA, perche' e' questo il file che dichiara come le sedute si raggruppano.
#
# Le fasi del piano, e quante aperture Editor consuma ciascuna:
#
#   PRE-0  headless preflight                      0 Editor
#   E1     authoring / asset / graybox             1 Editor   <- sedute `execution_lane: asset`
#   G1     clean gate: build + suite + validator    0 Editor
#   E2     mega acceptance, processo pulito        1 Editor   <- sedute `execution_lane: pie`
#   P1     packaged Development gate               0 Editor
#
# ⚠️ **Il tetto di 2 aperture e' un KPI atteso, non un divieto.** La versione precedente di questa
# decisione lo scriveva come vincolo duro, e la critica M-02 del panel del 2026-08-30 lo ha
# falsificato con un argomento che regge: l'obiettivo reale non e' contare le aperture, e' evitare
# che una sessione giri su una DLL incoerente con `HEAD`. Un rebuild nativo IMPONE di chiudere e
# riaprire; un vincolo che si sa gia' che verra' violato smette di guidare e comincia a essere
# aggirato. Quindi non si conta: si decide con le precondizioni.
#
# Una nuova apertura e' autorizzata SOLO se cambia almeno una di queste tre precondizioni:
#
#   1. serve modificare o salvare asset binari;
#   2. serve un riavvio pulito per verificare persistenza, reload, cook o montaggio;
#   3. il test richiede un processo o una configurazione incompatibile con quello gia' aperto.
#
# NON sono di per se' motivo di chiusura: cambio mappa, Stop/Start PIE, `rt.Test.Scenario <Id>`,
# cambio fixture, ritorno a `L_Frontend`. Sono tutte cose che si fanno nello STESSO processo.
#
# Ogni apertura oltre la seconda va registrata con la ragione tecnica che l'ha imposta. Una
# regressione reale e' una ragione valida; «era piu' comodo» non lo e'.
#
# ⛔ **Perche' E1 ed E2 non si comprimono in una sola apertura.** E1 modifica `.uasset`/`.umap`.
# Giudicare quegli stessi asset nel processo che li ha appena scritti prova asset ancora caldi in
# memoria: non verifica il reload, la persistenza, ne' l'inizializzazione da zero. La seconda
# apertura fa parte dell'oracolo, non e' overhead.
#
# ⚠️ `execution_lane` NON e' popolata su cinque sedute (U10..U13, U17), e il default `pie` sarebbe
# sbagliato per quattro di esse: producono data asset senza dichiararli in `artifacts`. U17 non e'
# lavoro Editor affatto — e' il gate packaged P1. Ognuna porta il proprio commento sul perche'.
# Finche' restano cosi', il raggruppamento E1/E2 va deciso a mano per quelle cinque.
#
#   steps              prosa umana; solo dove NESSUNA guida copre ancora la procedura
#   notes              avvertenze e debiti noti
#
# Le sedute dei blocchi 5 e 6 dichiarano meno campi: il codice sotto non esiste ancora e
# inventarne il DoD sarebbe una metrica falsa. Si completano quando la loro epic si apre.

