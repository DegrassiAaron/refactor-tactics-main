  - feature_id: RT-FEAT-BOT-FAIRNESS
    title: Il bot pianifica sulla conoscenza della sua squadra
    area: Tools
    kind: gameplay
    release: v0.1
    priority: P2
    status: TESTABLE
    gates:
      spec: done
      data: na
      runtime: done
      log_debug: todo
      automation: done
      scenario: partial
      ui_wiki: partial
      packaged: todo
      network_privacy: na
      replay_representable: na
    roadmap:
      epic: E13
      checkpoints: ["13.5"]
    dependencies:
      - RT-FEAT-BOT-BASE
      - RT-FEAT-PERCEPTION-TEAM-KNOWLEDGE
    owner_specs:
      - docs/gameplay/spec-bot-hex.md
      - docs/gameplay/spec-bot-tattico.md
    issues: [160]
    tests:
      - RefactorTactics.HexBotPlay.HiddenEnemyFairness
      - RefactorTactics.HexBotPlay.PlansOnPartialKnowledge
      - RefactorTactics.HexBotPlay.SeeksContactWithoutKnowledge
      - RefactorTactics.HexBotPlay.ActsOnLastKnownCell
      - RefactorTactics.HexBot.ConsidersExposedRearArc
      - RefactorTactics.HexBot.RearBonusMatchesBypassedReduction
      - RefactorTactics.HexBot.ExposureIsZeroWithoutProtection
    scenarios:
      - Spec.Bot.HiddenEnemyFairness
      - Spec.Bot.PlansOnPartialKnowledge
      - planned:
          - Spec.Bot.DecoyNoiseIndistinguishable
    wiki_refs:
      - wiki:avversario-bot
    last_verified:
      date: 2026-08-12
      commit: f963a689
    notes: >
      **Meta' bot di CP 13.5 atterrata il 2026-08-11.** `PlanBots` costruisce `Ctx.Enemies` da
      `FRTTeamKnowledge` con la STESSA regola del targeting umano (`ClassifyTarget`), non un secondo
      modello: visto -> cella e condizione attuali; ricordato -> cella dell'ultimo contatto e HP
      **massimi** (la squadra conosce l'identita', non la condizione); ignoto -> non esiste.
      Owner del comportamento AS-BUILT: `spec-bot-hex.md` §6, che dichiarava il contrario e ora
      dichiara il vero.
      **Gate `scenario` da `todo` a `partial` il 2026-08-12 (#160).** Esistono
      `Spec.Bot.HiddenEnemyFairness` e `Spec.Bot.PlansOnPartialKnowledge`; resta pianificato
      `Spec.Bot.DecoyNoiseIndistinguishable`, che dipende da CP 13.4 (#159) perche' senza rumore non
      c'e' esca. Scriverli ha richiesto tre estensioni dell'harness — un'unita' puo' essere dichiarata
      `bot`, la condizione iniziale (`health`/`shield`/`visionRange`) e' scrivibile, e uno scenario puo'
      dichiarare **varianti** con `expectSameAcrossVariants`. Quest'ultima e' l'unica forma in cui un
      canary d'indipendenza sia esprimibile: «il bot non ha usato un'informazione» non e' osservabile in
      una partita sola.
      ⚠️ **I due scenari NON sostituiscono i test C++, e la differenza e' misurata.** Rendendo onnisciente
      il solo `PlanBots`, `Spec.Bot.PlansOnPartialKnowledge` nella sua prima stesura restava **verde**: a
      fermare il colpo sull'ignoto e' il RESOLVER (CP 13.2, `TargetUnknown`), non il bot, quindi lo
      scenario misurava la catena e non il pianificatore. Corretto aggiungendo la premessa
      `Combat/Hit = 1`, che la mutazione ora prende. Il controllo diretto sul pianificatore resta il test
      C++, che guarda `PlannedAttackTarget` invece dell'esito.
      **Orientamento nello scoring, 2026-08-12 (#160).** L'ultima voce di CP 13.5 che mancava: il bot valuta
      «da dove e' visto e da dove puo' essere colpito». Il termine non porta un peso proprio — vale
      `WDamage x riduzione scavalcata`, cioe' il danno che la direzione aggiunge, e
      `RearBonusMatchesBypassedReduction` lo pinna contro il catalogo invece che contro una costante. La
      riduzione si CHIEDE a `EffectiveCoverReduction`, che contiene gia' la logica direzionale.
      ⚠️ **Guard resta fuori deliberatamente**: anche lei e' annullata da un colpo posteriore, ma in
      pianificazione «il bersaglio si guardera'» e' un INTENTO dell'altra squadra — contarlo renderebbe il bot
      piu' informato del giocatore, l'opposto di cio' che questa feature garantisce.
      ⚠️ **Il verso difensivo vale zero quasi sempre**, e il suo test lo asserisce
      (`ExposureIsZeroWithoutProtection`): `RearHitBypassedCover` ANNULLA una riduzione, e senza copertura non
      c'e' niente da annullare. Diventera' rosso — cioe' promuovibile — il giorno in cui il bot avra' una
      protezione propria da mettere in gioco.
      ⚠️ **La sovrastima non e' ancora misurabile**, ed e' un limite dichiarato: il bot conta il bonus sul
      facing d'inizio turno, ma chi attacca ruota verso il proprio bersaglio PRIMA che si valuti l'arco
      (`TargetingReoriented` precede il controllo direzionale), quindi nel duello il fianco sparisce. Il tasso
      di realizzo si leggerebbe dal TurnLog, ma `RearHitBypassedCover` e' emesso **solo per la Guard**: la
      copertura annullata non lascia traccia, perche' `EffectiveCoverReduction` e' pura. Serve un campo su
      `FRTHexAttackHit` — e una voce nuova nel TurnLog cambia gli hash dei golden replay, quindi e' lavoro
      proprio e non di contorno.
      ⚠️ **Il gate e' `automation`, e ha una forma precisa**: `HiddenEnemyFairness` mette la stessa
      `FRTTeamKnowledge` davanti a due stati autorevoli diversi e pretende lo **stesso** Intent.
      Verificato per mutazione **due volte**, e la seconda ha chiuso un buco trovato in code review:
      (1) rimettendo l'onniscienza cadono `HiddenEnemyFairness`, `PlansOnPartialKnowledge` e
      `SeeksContactWithoutKnowledge`; (2) cancellando il ramo `CellOnly` cade **solo**
      `ActsOnLastKnownCell`.
      ⚠️ **Il ramo `CellOnly` — il piu' delicato — all'inizio aveva copertura ZERO**: `Uncertain` esiste
      solo dopo DUE osservazioni (vista in una, persa nella successiva) e i primi tre test pianificavano
      una volta sola, quindi vedevano soltanto `Allowed` o `Rejected`. Si poteva cancellare l'intero
      `case CellOnly:` e la suite restava verde. `ActsOnLastKnownCell` fa la sequenza a due osservazioni
      e mette il ricordo DENTRO la portata e la posizione vera FUORI: se il bot attacca, e' la memoria.
      ⚠️ Anche `SeeksContactWithoutKnowledge` era debole: bot e nemico agli ANTIPODI attraverso il centro
      rendono «vai al centro» e «vai al nemico» la stessa direzione, e restava verde sotto onniscienza.
      Geometria corretta perche' le due direzioni divergano. Il secondo e' costruito perche' possa fallire:
      l'ignoto e' dentro la portata e quasi morto, cosi' un bot che lo vedesse lo sceglierebbe.
      ⚠️ **Due cose sono cambiate oltre al filtro, e senza di esse il filtro non reggeva**:
      `EnsureMatchRoster` e il rinfresco della conoscenza sono stati anticipati alla pianificazione —
      prima vivevano solo a valle, quindi al primo turno gli `StableUnitId` erano tutti `0` (i ricordi
      di unita' diverse si sarebbero fusi) e la conoscenza era vuota (il bot sarebbe stato cieco, non
      parziale). Piu' la **condotta di ricerca** senza contatti, senza la quale la partita non finisce
      (`HexMatch.PlaysToCompletion`).
      ⚠️ **Limite dichiarato**: l'OCCUPAZIONE resta globale — `ReachableCells` e `DashHostiles`
      modellano cio' che il resolver fara', non cio' che la squadra sa, e il giocatore umano ha lo
      stesso vincolo. Rendere il bot piu' cieco dell'umano sarebbe sbagliato quanto renderlo onnisciente.
      ⚠️ **Perde informazione legittima**: gli HP al momento del contatto non sono conservati, perche'
      `FRTLastKnownContact` non ha un campo HP — aggiungerlo e' un incremento di
      `FRTTeamKnowledge::CurrentVersion`, cioe' una decisione di formato. L'errore va nella direzione
      sicura: il bot sottostima le occasioni invece di inventarle.
      `scenario: todo` e `ui_wiki: partial`: gli scenari `Spec.Bot.*` non sono scritti, e la meta' HUD
      di #160 (marker d'ultimo contatto, area d'incertezza acustica) dipende da CP 13.4.


      ⚠️ **`replay_representable: na` qui vuol dire «non e' possibile», non «non serve»** — ed e' l'unico
      punto del registry dove i due significati divergono. Le voci che il bot produce muovendo e sparando
      esistono, ma appartengono a `RT-FEAT-CORE-TURN` e `RT-FEAT-ACTION-ENGINE`: il decisore non possiede
      le voci, le possiede chi esegue. E soprattutto **la traccia non distingue questa feature dal suo
      contrario**: un bot che pianifica sulla conoscenza della squadra e un bot onnisciente che fa la
      stessa mossa scrivono voci identiche. E' la stessa cosa che `RT-FEAT-BOT-PREDICTIVE` dichiara come
      il proprio caso da testare — «dedurre» e «sapere» sono indistinguibili dall'esterno — e vale gia'
      oggi, per una feature che invece e' `TESTABLE`.


      Quindi l'equita' del bot **non ha un gate che la protegga**: la tiene solo la verifica di mutazione
      su `HiddenEnemyFairness`, che rimettendo l'onniscienza fa cadere tre test. Se un giorno la traccia
      registrasse lo stato di conoscenza del bot la proprieta' diventerebbe verificabile a posteriori, ma
      e' una decisione di formato **e** di privacy: sta in `OPEN_DECISIONS.md` accanto a `REP-1`, non qui.

