      # offline, quindi nessun confine di rete viene attraversato. Ma il giorno in cui lo snapshot si
      # replica, mandarlo intero significa spedire a ciascun client la conoscenza dell'AVVERSARIO, cioe'
      # violare l'invariante #6 per una strada che nessun test copre: gli undici test `Vision` guardano
      # targeting, scadenza, unione e permutazione, nessuno il confine. Questo gate si chiude filtrando
