      - planned:
          - Spec.Overwatch.ConductiveDischargeUsesStandardConduction
          - Spec.Overwatch.PressurePushChangesResolvedPath
          - Spec.Overwatch.FrontlineFollowsFacing
    wiki_refs:
      - wiki:overwatch
      - wiki:reazioni-overwatch-e-previsioni
    wiki_note: >-
      Le reazioni **preparate** esistono e funzionano in partita; l'**Overwatch interattivo** apre la finestra e la registra nel TurnLog dal 2026-08-14, ma nessun giocatore puo' ancora rispondere: la UI e' CP 14.6.
    last_verified:
      date: 2026-08-16
      commit: 0ecde11b
    notes: >
      **CP 14.4 chiuso il 2026-08-10.** La riga precedente diceva «Non implementata:
      `grep -rn "Overwatch" Source/` fuori dai test non restituisce nulla», ed è la prima cosa che
      questo checkpoint ha reso falsa: `URTReactionOpportunityLibrary::BuildOverwatchTriggers`
      produce le opportunity lungo i micro-step del Move.

      L'aggancio tecnico che la riga vecchia citava come *insufficiente* — `FRTSuppressiveZone` —
      è diventato il vincolo: l'Overwatch **riusa quella geometria** invece di averne una propria.
      Chi si copre da un attacco lineare si copre dalla soppressione, e ora anche dall'Overwatch;
      con due geometrie quella terza proprietà sarebbe decaduta senza che nessun test la interrogasse.

      Le quattro condizioni di ADR-0004 §6 sono tutte necessarie e verificate una per volta. Il caso
      che il checkpoint nomina esplicitamente è `Incerto`, ed è il più facile da sbagliare: è
      allettante trattare «la squadra sa che lì c'è qualcuno» come «lo vede». `HOLD` è **sempre**
      fra le risposte legali — senza, un bersaglio solo darebbe cardinalità 1, cioè un commit
      automatico, e l'Overwatch sparerebbe da solo.

      ⚠️ **`runtime` resta `partial` e la ragione è la regola 2, non la prudenza**: `ARTTurnManager`
      non chiama ancora `BuildOverwatchTriggers`, quindi in partita non nasce nessuna opportunity.
      Il consumatore è **CP 14.5** (`#165`), che porta finestra, commit, troncamento del movimento e
      il cablaggio di `Hero.Wraith.InterceptShot`. Fino ad allora `log_debug` resta `todo` — nel TurnLog
      non arriva niente — e `Spec.Overwatch.HoldThenFire` continua a uscire `BLOCKED`, che è la
      verità: descrivere non è dimostrare.

      🔴 **Le due righe qui sopra sono STORIA dal 2026-08-16, e la seconda è stata falsa per mezza
      giornata prima che qualcuno la riprendesse.** `Spec.Overwatch.HoldThenFire` **non** esce più
      `BLOCKED`: esce `PASS` — due turni, due decisioni applicate, zero residuo — perché `#512` fase B
      (PR **#1033**) ha reso `DecisionBoundary` disponibile e ha riempito il T2 che il file aspettava
      dal giorno in cui è stato scritto. «Descrivere non è dimostrare» resta vero come principio, e la
      dimostrazione ora c'è: HOLD sul primo che entra nella linea, `FIRE` sul secondo, movimento
      troncato nella cella raggiunta, verificato da
      `RefactorTactics.Scenario.OverwatchHoldThenFireConsumesBothDecisions`.
      ⚠️ E il difetto che quel giro ha scoperto vale per chi scriverà i venti scenari del §40: **il cono
      dell'Overwatch nasce dal facing al `Prep`**, mentre una rotazione dichiarata si applica dentro
      `ResolveMovement` **dopo** il ciclo dei micro-step. Un'unità che si muove ruota strada facendo e
      il caso non si vede; una che resta ferma conserva il facing di piazzamento. Un cono si prepara il
      turno prima, o si dichiara al piazzamento.

      Conseguenza misurata su un altro checkpoint: `Perf.ResolverAt4v4` (CP 17.2) deve riportare
      «opportunity di reazione per turno» e **non può**, perché uno zero per assenza di produttore
      si legge esattamente come uno zero per assenza di reazioni. Lo dichiara invece di stimarlo.

      ⚠️ **Due difetti trovati in code review sulla prima stesura, entrambi nel caso «una unità, due
      reaction armate»** — che è esattamente ciò che ADR-0004 §4 chiama «più reazioni distinte nello stesso
      micro-step», e che nessuno dei quattro test del DoD toccava: usavano tutti due `OwnerId` diversi.

      1. I tie-break si ritrovavano con una `TMap` chiavata sull'`OwnerId`. Con due watcher della stessa
         unità la seconda `Add` sovrascriveva la prima, e **entrambi** i trigger si ordinavano coi tie-break
         dell'ultimo watcher inserito: cioè in base all'ordine dell'array `Watchers`, la dipendenza che
         quell'ordinamento esiste per togliere. Ora i cinque interi viaggiano accanto al trigger.
      2. `Seq` era fisso a `0`, motivato con «un watcher apre al massimo una opportunity per micro-step» —
         vero, e irrilevante: la chiave non identifica il watcher. Due istanze della stessa reaction sulla
         stessa unità davano due chiavi **identiche**, quindi lo stesso `OpportunityId`. È il difetto che
         CP 14.3 esiste per impedire, e la doc di `Seq` lo nomina parola per parola. Ora `Seq` si assegna
         **dopo** l'ordinamento totale, così è funzione dello stato e non dell'ordine d'ingresso.

      Verificato per mutazione rimettendo l'implementazione pre-review: cadono **esattamente**
      `OrderIsDeterministic` e `SameReactionTwiceHasDistinctIds`, gli altri quattro restano verdi.

      **Il `data` resta `partial` per una ragione precisa (2026-08-10)**: CP 14.4 impone che il profilo
      sia un dato per eroe — area, arco, trigger e risposte legali — e il test che lo pinna
      (`Overwatch.ProfileIsDataNotBranch`) ha bisogno di **due** profili diversi da confrontare.
      **Nessun catalogo ne contiene uno.** Le quattro geometrie proposte — Gadget settore medio,
      Phase medio-corto, Riktor corto-largo frontale, Wraith stretto-lungo — sono `BAS-2` in
      [`../OPEN_DECISIONS.md`](../OPEN_DECISIONS.md): il meccanismo è deciso, il contenuto no.

      **Il lifecycle ha un modello, dal 2026-08-10**: `Watch → EndWatchStage → Reposition`. L'owner resta
      **fermo** durante lo Stage A della Move Phase e poi esegue un Move limitato **pianificato in Planning**
      — mai scelto dopo aver visto dove sono finiti gli avversari. Chiude `BAS-5`; triage in
      [`plans/overwatch-runtime-lifecycle-triage-2026-08-10.md`](plans/overwatch-runtime-lifecycle-triage-2026-08-10.md).
      Quattro punti sono gia' canone-compatibili e possono entrare nel DoD di CP 14.4/14.5 senza altre
      decisioni: cadence `OncePerTargetPerReactionInstance`, `MaxPrompts` che conta opportunity distinte
      (precisa ADR-0004 §8), eligibility **post-transition**, e la distinzione fra **hard cancel** e **soft
      eligibility block** — che CP 14.6 oggi non fa, e che serve perche' `NoLOS` e `Stun` non possono
      produrre lo stesso reason code terminale.

      **Costo e nome decisi il 2026-08-10** (`D-070`): armare l'Overwatch spende l'azione principale e
      **riserva** lo slot movimento a `Withdraw` — 2 MP, dichiarato in Planning, risolto nello **Stage B**
      dopo tutti gli altri. Il divieto di `Dash` e' una **conseguenza** dello slot impegnato, non una regola
      a se'; e il nome non e' `Reposition`, che e' gia' un'azione viva in fase Dash. Nessuno scenario nuovo
      e' ancora dichiarato: il §40 del sorgente ne elenca venti, e diventano `planned` quando E14 ha una
      forma eseguibile per HOLD/FIRE — la stessa ragione per cui `Spec.Overwatch.HoldThenFire` esce `BLOCKED`.
      ✅ **La condizione si è avverata il 2026-08-16**: la forma eseguibile per HOLD/FIRE esiste
      (`turns[].decisions`, `"version": 2`), `Spec.Overwatch.HoldThenFire` esce `PASS`, e i venti scenari
      del §40 non hanno più questa scusa per restare non dichiarati. Chi li porta a `planned` lo fa da qui.

