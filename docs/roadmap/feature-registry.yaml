  - feature_id: RT-FEAT-UI-TACTICAL-CAMERA
    title: Camera tattica
    area: UI
    kind: ui
    release: v0.1
    priority: P2
    status: IMPLEMENTING
    gates:
      spec: partial
      data: na
      runtime: done
      log_debug: na
      # `todo` → `partial` → `done` in due passi lo stesso giorno.
      #   `partial` (#867): i quattro test esistevano già e nessuno li aveva dichiarati.
      #   `done`    (#865): aggiunti i quattro che mancavano — `FocusOn` conserva quota/zoom/orientamento
      #                     ⚠️ La clausola sulla **quota** era il difetto di #887, e resta scritta qui
      #                     perché è ciò che #865 dichiarò davvero: riscriverla cancellerebbe la prova
      #                     su cui poggia la nota qui sotto.
      #                     (campo **e** braccio), i due rami `false` di `FrameOwnTeam`,
      #                     `MatchStartArmLength` distinto da `DefaultArmLength`, il **centraggio** sul
      #                     centroide e la squadra letta dal **controller** invece che assunta 0.
      # ⚠️ `done` copre l'API della camera **attuale**: non i bounds e non lo zoom al cursore, che non
      # esistono (#864), né lo yaw continuo e il pitch (#863). Un gate verde non è una feature completa.
      # 🔴 **Una stesura precedente scriveva «ogni funzione pubblica ha un test» ed era sovradichiarato**,
      # trovato in code review: il centraggio sul centroide non era asserito da nessuno (cancellando la
      # chiamata a `CellsCentroidWorld` la suite restava verde) e il ramo `PlayerTeamId` non era esercitato
      # — in una partita con il giocatore in squadra 1 la camera avrebbe aperto sul nemico. Entrambi ora
      # coperti e verificati per mutazione.
      # ⏳ **Resta scoperto un consumatore, ed è dichiarato invece che sottinteso**: il ripiego di
      # `BeginPlay` (`FrameOwnTeam` → ritenta al tick → `RecenterView`) non ha test. È lavoro di #874.
      # 🟡 **#887 — in corso (PR #890 aperta), e la lezione vale più del fix**: `FocusOn` scartava la quota del bersaglio e
      # teneva quella con cui il pawn nasce — il PlayerStart — quindi premendo `F` la camera orbitava
      # sopra il vuoto. **Il test che #865 aveva prescritto difendeva quel difetto**: verificava che la
      # quota fosse *conservata*, cioè misurava la conservazione invece della correttezza. Riscritto, non
      # affiancato: la domanda giusta non è «resta invariata?» ma «invariata rispetto a cosa?».
      # ✅ **Chiuso #873**: `RecenterView` non clampava la distanza, e i test non lo catturavano perché
      # giravano tutti coi valori di default, dove il clamp non cambia nulla. Ora chiama
      # `ApplyViewSettings` invece di duplicarla, e `RecenterKeepsArmWithinZoomLimits` costruisce
      # l'intervallo fuori scala con `SetArmLengthRangeForTest`.
      automation: done
      scenario: todo
      ui_wiki: partial
      packaged: partial
      network_privacy: na
      replay_representable: na
    roadmap:
      epic: E11
      checkpoints: ["11.1"]
    dependencies: []
    owner_specs:
      - docs/technical/progettazione-hud.md
    # ⚠️ `77` è il checkpoint CP 11.1, e il suo DoD riguarda l'**HUD**: non contiene nulla di camera.
    # Resta perché `checkpoints: ["11.1"]` lo implica, ma è il legame nominale che il commento sui
    # `pie_refs` in testa a questo file descrive — stessa issue dichiarata da più feature. Le tre
    # aperte il 2026-08-14 sono invece specifiche della camera.
    issues: [77, 863, 864, 865]
    tests:
      # I test vivono in `Source/RefactorTactics/Tests/RTCameraPawnTests.cpp`; il pattern li copre tutti
      # e non invecchia quando se ne aggiunge uno.
      # ⚠️ **Qui non sta né il numero né l'elenco dei nomi, ed è deliberato**: una stesura precedente
      # scriveva «**Sette**» e li elencava uno per uno, argomentando nella stessa riga che i numeri a mano
      # vanno fuori sincrono. Un `7` in un commento invecchia esattamente come un `7` in un campo —
      # niente valida i commenti — e l'elenco è proprio l'enumerazione che il pattern esiste per evitare.
      # Il conteggio si misura: `grep -c 'IMPLEMENT_SIMPLE_AUTOMATION_TEST' <quel file>`.
      # Verificato per mutazione che il **campo** morda: sostituirlo con un nome inesistente fa fallire
      # `validate` con «test ref senza corrispondenza nella suite».
      - RefactorTactics.Camera.*
    scenarios: []
    wiki_refs:
      - wiki:come-si-gioca
    last_verified:
      # 🔴 **Avanzato con il commit che cambia il gate, e non è un dettaglio**: la stesura di #867 aveva
      # lasciato `747f4e82` mentre portava `automation` a `partial`, ripetendo alla lettera il difetto che
      # le `notes` qui sotto post-morteggiano. Un `last_verified` che punta a un albero anteriore ai test
      # che giustificano il gate è una firma su un documento che non si è letto.
      date: 2026-08-14
      commit: a330ba79
    notes: >
      `ARTCameraPawn` esiste e la build packaged la usa; la taratura su scala esagonale resta una
      verifica PIE aperta (CP 8.3 di M8). Non promuovere per «si vede che funziona».
      🔵 **Questa nota diceva «nessun test automatico la copre», ed era VERA quando è stata
      scritta**: il `last_verified` era `2094b867`, del 2026-08-08 alle **17:57**, e
      `RTCameraPawnTests.cpp` è nato con `07620c42` alle **18:55** — 58 minuti dopo. Non è un
      difetto di misura: è una nota corretta che è invecchiata nell'ora successiva, e che nessuno
      ha rivisto perché `last_verified` non è stato avanzato. ⚠️ **La prima stesura di questa
      correzione diceva «era falsa dal 2026-08-08» e attribuiva la colpa al gate**: sbagliato nella
      causa, e trovato in code review confrontando i timestamp invece delle date.
      ➕ **Resta però vero, e separatamente, che nessun gate poteva accorgersene** una volta
      invecchiata: `validate` verifica il verso *dichiarato → esistente*, cioè che i pattern
      matchino test reali, e una lista vuota lo soddisfa sempre. Il verso opposto, *esistente →
      dichiarato*, non è controllato da nulla — quindi una nota stantia qui non ha nessuna rete,
      ed è la ragione per cui è sopravvissuta sei giorni.
      ⚠️ Il campo `spec` resta `partial`, ma **non** più perché la motivazione di `YawStep = 45°`
      vive solo in un commento C++: `D-142` l'ha portata nel Decision Log con questo stesso commit.
      Resta `partial` perché il *comportamento* della camera — pan relativo, focus, bounds, stati —
      non ha un documento owner: `progettazione-hud.md` la nomina al §30 solo per negare la
      minimap. Vedi `docs/roadmap/plans/camera-roadmap-v1-triage-2026-08-14.md` §3.3.

