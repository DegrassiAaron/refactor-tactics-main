      derivata e la freccia non torna indietro. `data: todo` finche' la rubrica non deriva davvero i
      rating dai cataloghi: D-106 ha stabilito che **non si scrivono, si calcolano**, e D-023 tiene
      l'autorita' dei numeri sui `RT_*Catalog_v0.1.md` — quindi nessun workbook e' fonte e il
      conflitto che teneva aperto `RAD-1` si e' **dissolto** invece di essere risolto.
      ⚠️ La regola che costa: un asse `TBD` **non si renderizza come `0`** e fa fallire la
      generazione, perche' uno zero da dato mancante e' la stessa forma di una debolezza voluta. Con
      i rating calcolati `TBD` cambia significato — non «cella vuota» ma «la rubrica non copre questo
      asse» — e resta un fallimento. ⚠️ D-107 conferma i **sei assi** e li fa modellare: cinque si
      derivano dagli input che il catalogo dichiara per eroe (Salute, Movimento, Range visivo,
      Resistenza Push, abilita' con danno/range/effetto/cooldown), mentre `information` nasce con un
      solo ingrediente — la **Vista** — perche' stealth e detection vivono solo nel workbook escluso.
      Si arricchisce derivando il rumore dal **kit** (D-042), non ripescando il foglio.

