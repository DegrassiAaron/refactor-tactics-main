      Decision Log e in commenti C++, il catalogo azioni non la porta in colonna, e `FRTNoiseEvent::Intensity`
      non ha **nessun assegnatore fuori dai test**. Va portata in colonna **insieme** a CP 13.4: se il
      produttore arriva prima, hardcoderà i valori e il numero avrà due sedi — il difetto che
      [D-023](../decisions/RT_PDR_00_Decision_Log.md) e [D-115](../decisions/RT_PDR_00_Decision_Log.md) hanno
      eliminato altrove.

