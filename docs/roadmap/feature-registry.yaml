    notes: >
      **CP 7.1 chiuso il 2026-08-11 (`#60`)**: le sei varianti d'arma esistono e il loro trade-off è
      applicabile, non solo raccontato — `ApplyWeaponVariant` somma i delta all'attacco base dell'eroe e
      il validator rifiuta una variante che non paghi in danno, portata o ricarica. Verifica di mutazione
      eseguita: azzerando i delta cadono esattamente i tre test che ne dipendono.
      Due limiti **dichiarati** invece che nascosti. `Weapon.Split` compra un bersaglio in più che il
      motore non sa esprimere (nessuna cardinalità dei bersagli in `FRTActionDef`), quindi in partita è
      solo il suo svantaggio: `Equipment.SplitHasNoConsumerYet` lo pinna e diventerà rosso il giorno in
      cui qualcuno la cabla. `Weapon.Environmental` dichiara il vantaggio in prosa perché nessun campo del
      catalogo esprime «migliora gli hazard».
      **CP 7.3 metà catalogo chiuso il 2026-08-11 (`#62`)**: `CounterShot`, `ReactiveShield` e
      `AllyIntercept` sono reazioni vere — costruite su un'azione core che è già una reazione, da cui
      ereditano fase, priorità e trigger, con numeri propri via `GrantedEffects`. Mutazione eseguita:
      azzerando il trigger ereditato cadono esattamente i due test che lo verificano.
      L'altra metà è `#505` (CP 7.5). I moduli esclusi erano **quattro**, per due ragioni diverse:
      `HazardEscape`, `Cleanse` e `Anchor` non avevano il **trigger** (nascono da un evento, non da un
      colpo); `EmergencyDash` aveva il trigger ma non l'**effetto** — `Reposition 1` sposta chi reagisce e
      nessun `ERTActionEffect` lo esprimeva. Il secondo vincolo è emerso implementando, non dall'analisi.
      **Il 2026-08-12 ne resta uno.** `EmergencyDash` è entrato con `SelfReposition` (D-093) e `Anchor`
      con `AboutToBeDisplaced`, che ha richiesto il pezzo architetturale del checkpoint: i trigger non si
      valutano più tutti nello stesso momento, ma nel punto in cui il loro evento è deciso
      (`URTReactionLibrary::PassPointFor`, `switch` senza `default` — un trigger nuovo non compila finché
      qualcuno non dichiara dove viene valutato). Il blocco vero non era il contatore di D-092 ma il fatto
      che `PlannedReactionAbility` venisse **consumato dal primo pass**: ora sopravvive alla fase e si azzera
      a fine turno. `Cleanse` è entrato lo stesso giorno con la stessa forma di `Anchor` — impedisce
      l'applicazione invece di rimuovere a posteriori — e con un criterio di scelta che la review della
      specifica ha corretto: fra due controlli si annulla **il più grave**, non il primo raccolto, perché
      l'ordine di raccolta segue chi colpisce e sprecherebbe l'attivazione su uno `Slow` da attacco base
      lasciando passare un `Root`. **Il 2026-08-12 i sette moduli sono completi.** `HazardEscape` è entrato per ultimo, e a lui non
      mancava un dato né un momento ma l'**evento**: finché una superficie che nasceva sotto un'unità ferma
      non le faceva niente (`#570`, D-111), nel Cleanup non c'era alcun danno imminente da cui fuggire. Si
      fugge verso la cella che si ha davanti — il facing lo dichiara il giocatore, quindi la fuga è
      prevedibile invece che arbitraria — e il facing non cambia, perché non c'è nessuno verso cui girarsi
      (precedente di `Facing.EnvironmentalDisplacementKeepsFacing`).
      Il loadout (`#63`) ha inoltre un buco nell'owner: la tabella §4 del
      catalogo **non assegna varianti d'arma** a nessun eroe (dice esplicitamente che le sue sono varianti
      di *abilità*), quindi il default 1+1+1 richiesto dal DoD non esiste ancora nei dati.

