      il TurnLog non ha né una categoria né un `Outcome` per gli stati — 35 `AppendLogEntry` nel file,
      zero per uno status. Non è una riga mancante: è un modello che non c'è.
      ∴ un replay vede un'unità che comincia a bruciare **senza sapere perché**, e la vede smettere
      senza sapere se è uscita dal fuoco o se è scaduta la durata.
      **Chiude il gate** `#1077`, che decide come uno stato entra nel TurnLog — categoria propria o
      `Environment` con un esito nuovo — e copre i tre momenti. Non era scope di `#625` né di `#1067`.
      💡 La lezione, di nuovo e con un caso in più: un gate si chiude sul **soggetto intero**. Qui il
      soggetto era il ciclo di vita, e la misura ne aveva visto un terzo.

