      codice e il catalogo dicono `Smoke`. Nome allineato al codice, che è la fonte verificabile.
      Dal 2026-08-09 (issue 353) il fumo si **crea in partita** e non solo si dipinge su una mappa:
      `Riva.MistVeil` è il suo produttore, con lo stesso meccanismo di `Ignite` e `CreateWater`.
      Resta noto e dichiarato in `docs/characters/v0.1/riva.md`: chi è **già** nella cella quando il
      fumo si alza non riceve `Status.Obscured`, che è un `OnEnterEffect` — il cap di targeting vale
      comunque, perché è letto dalla superficie della cella.

