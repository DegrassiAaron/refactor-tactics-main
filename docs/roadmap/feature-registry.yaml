      AGGIORNATO 2026-08-12: il `viewBox` senza `width`/`height` dava proporzione ma non misura, quindi dentro un `<img>` la taglia la decideva il contenitore: misurato sulla Wiki pubblicata, **896x896** su una scheda eroe e **47x47** dentro la tabella di `Profilo-tattico`, dove le etichette da 12px scendono a ~1,4px. Due celle della stessa tabella divergevano (143 contro 117) perche' il layout si dimensiona sul contenuto, cioe' sulla **lunghezza dell'alt**: la descrizione decideva la taglia del grafico. La radice porta ora `width="400" height="400"`. Gate invariati.
      AGGIORNATO 2026-08-12: chiuso l'ultimo anello della catena `cataloghi -> SVG -> alt`. Gli `alt` delle immagini sulla Wiki sono prosa scritta a mano nel clone (D-076) e nessun deploy li tocca: un rebalance aggiornava il grafico e lasciava indietro la descrizione, quindi chi vede il radar leggeva il valore nuovo e chi usa uno screen reader sentiva quello vecchio. `tools/radar/wiki-alt.ts --wiki-root <clone> --check|--write` ricava l'atteso **dall'SVG** e fallisce sulla divergenza; verificato end-to-end mutando `Range visivo` di Gadget nel catalogo: `generate --check` rosso, rigenerato, `wiki-alt --check` rosso sulle tre pagine che citano `flux-profile`. Otto dei sedici riferimenti non avevano **nessun** valore nell'alt («Profile Radar di Gadget»): ora li hanno tutti. Gate invariati.
