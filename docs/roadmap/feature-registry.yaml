      - RefactorTactics.Facing.StationaryUnitRotatesFreely
      - RefactorTactics.Facing.ForcedMovementFacesSource
      - RefactorTactics.Facing.EnvironmentalDisplacementKeepsFacing
      - RefactorTactics.Facing.VoluntaryMoveWinsOverForced
      - RefactorTactics.Facing.DashThenBlastUsesLatestValue
      - RefactorTactics.Facing.TargetChangeWithinRoundReorients
      - RefactorTactics.Facing.RoundInheritsFinalFacing
      - RefactorTactics.Facing.TurnLogNamesConsumerAndReason
      - RefactorTactics.Facing.PermutationInvariant
      - RefactorTactics.Facing.IntentIsTeamFiltered
      # La chiave `facing` dell'intent di scenario, e l'ANCORA che impedisce ai due scenari nuovi di
      # scivolare in `BLOCKED` in silenzio. La seconda e' nata da una misura: togliendo la capability,
      # i due scenari passavano a `BLOCKED` e l'intera suite restava **verde**.
      - RefactorTactics.Scenario.LoaderReadsDeclaredFacing
      - RefactorTactics.Scenario.DeclaredRotationScenariosPass
      - RefactorTactics.Combat.BackAttackIgnoresCover
      - RefactorTactics.Combat.FlankAttackKeepsCover
      - RefactorTactics.Combat.ShieldWorksFromAnyDirection
      - RefactorTactics.Combat.HitCarriesBypassedCover
    scenarios:
