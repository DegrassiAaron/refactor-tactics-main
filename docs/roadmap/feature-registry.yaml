    last_verified:
      date: 2026-08-08
      commit: 2094b86
    notes: >
      **Non implementata**: `grep -rn "Overwatch" Source/` fuori dai test non restituisce nulla.
      L'aggancio tecnico esiste (`FRTSuppressiveZone` in `RTOffensiveActionLibrary`, azione
      `Action.SuppressiveLine`) ma è zona di soppressione, non Overwatch. Due pagine Wiki la
      descrivono già: il blocco di stato generato lo dichiara. `Spec.Overwatch.HoldThenFire` è la
      **specifica eseguibile** della finestra — con gli intent del turno 2 volutamente vuoti, perché
      la sintassi di HOLD/FIRE non è ancora decisa — ed esce `BLOCKED`.

      **Il `data` resta `partial` per una ragione precisa (2026-08-10)**: CP 14.4 impone che il profilo
      sia un dato per eroe — area, arco, trigger e risposte legali — e il test che lo pinna
      (`Overwatch.ProfileIsDataNotBranch`) ha bisogno di **due** profili diversi da confrontare.
      **Nessun catalogo ne contiene uno.** Le quattro geometrie proposte — Flux settore medio,
      Riva medio-corto, Bastion corto-largo frontale, Vektor stretto-lungo — sono `BAS-2` in
      [`../OPEN_DECISIONS.md`](../OPEN_DECISIONS.md): il meccanismo è deciso, il contenuto no.

      **Il lifecycle ha un modello, dal 2026-08-10**: `Watch → EndWatchStage → Reposition`. L'owner resta
      **fermo** durante lo Stage A della Move Phase e poi esegue un Move limitato **pianificato in Planning**
      — mai scelto dopo aver visto dove sono finiti gli avversari. Chiude `BAS-5`; triage in
      [`plans/overwatch-runtime-lifecycle-triage-2026-08-10.md`](plans/overwatch-runtime-lifecycle-triage-2026-08-10.md).
      Quattro punti sono gia' canone-compatibili e possono entrare nel DoD di CP 14.4/14.5 senza altre
      decisioni: cadence `OncePerTargetPerReactionInstance`, `MaxPrompts` che conta opportunity distinte
      (precisa ADR-0004 §8), eligibility **post-transition**, e la distinzione fra **hard cancel** e **soft
      eligibility block** — che CP 14.6 oggi non fa, e che serve perche' `NoLOS` e `Stun` non possono
      produrre lo stesso reason code terminale.

      **Costo e nome decisi il 2026-08-10** (`D-070`): armare l'Overwatch spende l'azione principale e
      **riserva** lo slot movimento a `Withdraw` — 2 MP, dichiarato in Planning, risolto nello **Stage B**
      dopo tutti gli altri. Il divieto di `Dash` e' una **conseguenza** dello slot impegnato, non una regola
      a se'; e il nome non e' `Reposition`, che e' gia' un'azione viva in fase Dash. Nessuno scenario nuovo
      e' ancora dichiarato: il §40 del sorgente ne elenca venti, e diventano `planned` quando E14 ha una
      forma eseguibile per HOLD/FIRE — la stessa ragione per cui `Spec.Overwatch.HoldThenFire` esce `BLOCKED`.

