    notes: >
      **Non e' bloccata su `AE-1`, e questa e' la sua ragione d'essere**: il buco esiste con qualunque
      modello di economia. ✅ **La fetta pura e' atterrata il 2026-08-12**:
      `URTPlanValidationLibrary::ValidatePlan(snapshot, piano)` risponde LEGALE / ILLEGALE + motivo PRIMA
      del commit, dove `ValidateInstance`/`ApplyFallback` agisce IN RISOLUZIONE. Nove test
      `RefactorTactics.Plan.*`, tre mutazioni verificate.
      ⚠️ `runtime` resta **todo** e non e' una svista: la funzione esiste ma **nessuno la chiama** ancora —
      il bot e la HUD non ci passano, ed e' il resto della DoD di `#605`. Un validatore senza consumatore
      non e' una regola.
      🔴 **Due premesse di questa nota erano false e sono corrette qui.** (1) La famiglia da estendere non
      e' quella degli `*Outcome`: e' **`ERTActionInvalidReason`** (`RTActionFallbackLibrary.h`), che gia'
      significa «questa azione pianificata non e' eseguibile» e gia' porta scritta l'invariante dei valori
      in coda. Gli `*Outcome` dicono com'e' andata una FASE — un altro asse. E `ERTMovementStopReason`,
      citato qui e nella issue, **non esiste in `Source/`**: compariva solo nei documenti che si citavano a
      vicenda. I tre valori nuovi (`SlotOccupied`, `InsufficientMovementPoints`, `OnCooldown`) sono in coda
      a `ERTActionInvalidReason`. (2) `CanonicalIntentStore` **non e' codice**: zero occorrenze in `Source/`.
      E' un concetto di design del PDR, citato in `docs/archive/` e `docs/src/` — ma anche, ⚠️ **come se
      fosse un simbolo**, nella DoD di CP 25.3 di `roadmap-post-v0.1.md`, che ne chiede la prova «dimostrato
      da un test». Il seam reale e' `RTIntentPrivacyLibrary` / `FRTPlannedIntent`.
      🔴 **Un limite dei quattro non e' ancora verificabile**: il controllo sui Movement Point legge
      `FRTActionDef::CostMP`, che **nessuno popola** — il catalogo dichiara il budget di `Move` e `Sprint` in
      `RangeCells` con `ERTMovementStyle::Budget`. Finche' il catalogo non dichiara un costo,
      `InsufficientMovementPoints` non puo' scattare in partita: campo senza produttore, e primo passo di chi
      collegherà `ValidatePlan` al gioco.
      `network_privacy: partial` resta, per la ragione giusta: la validazione legge il piano completo, che
      e' dato di squadra, e nessuna verifica in rete e' possibile prima di M10.
      Il cooldown residuo entra come **parametro** e non come campo dello snapshot perche' oggi vive su
      `ARTUnit::AbilityCooldowns` (privato, sull'Actor): stesso pattern di
      `URTCombatLibrary::IsAbilityUsable`.
      Il campo `out_of_release_scope` che portava questa motivazione e' stato rimosso il 2026-08-13:
      diceva che `roadmap.epic` doveva restare `null` perche' il validator non conosceva le epic
