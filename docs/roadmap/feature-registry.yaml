      - docs/decisions/adr-0004-finestre-di-reazione.md
    # 319 = il checkpoint; 318 = la capability dell'harness senza cui gli scenari di questa
    # feature non erano scrivibili. CONSEGNATA: `LogEventCount`/`LogEventOrder` (#318) e
    # `LogEventAmount` (#361, commit a7e4677b del 2026-08-10). Questo commento diceva «zero su
    # otto, non sette» e restava vero solo fino alla riconciliazione: gli scenari sono DIECI, e
    # oggi nessuno e' bloccato dall'harness — restano da scrivere, che e' un'altra cosa (CP 14.8).
    issues: [319, 318]
    tests: []
    scenarios:
      # Riconciliati con la spec il 2026-08-09 (#361): sono i dieci scenari che l'harness puo' esprimere,
      # cioe' i `golden` di spec-decision-time-bank.md §13 meno i due che ESTENDONO un test C++ esistente
      # (`OverwatchTimeoutIsHold`, `HoldKeepsReactionArmed`). `PrivacyNoBankLeak` e' uscito: e' `funzionale`
      # e vive in M10, non in v0.1.
      # ➕ **Da dieci a TREDICI il 2026-08-17** (D-156, D-157): il conteggio e' la somma delle righe marcate
      # `harness` nella tabella §13 della spec, non un numero incrementato a mano — misurato riparsando la
      # tabella. Le tre nuove coprono il carico di controllo (§3.4) e l'invariante 1 della Preferred
      # Response (§4.4). Le altre quattro voci nate nello stesso giro NON entrano qui: tre sono `estende`
      # (un test C++ esistente le ospita, duplicarle come file darebbe due verita' sullo stesso
      # comportamento) e `QuickConfirmReachableWithinGrace` e' `funzionale · UI` — la preselezione e' uno
      # stato di interfaccia, e il TurnLog registra la risposta committata, non cio' che era evidenziato.
      - planned:
          - Spec.TimeBank.GraceDoesNotDrain
          - Spec.TimeBank.DrainsAfterGrace
          - Spec.TimeBank.NeverBelowZero
          - Spec.TimeBank.TimeoutCostsFullWindow
          - Spec.TimeBank.TimeoutSpendsNoCharge
          - Spec.TimeBank.ClashCostsFullWindow
          - Spec.TimeBank.BotDrainsLikePlayer
          - Spec.TimeBank.ExhaustionKeepsResponsesLegal
          - Spec.TimeBank.ReplayReadsRecordedBank
          - Spec.TimeBank.PacketOrderInvariant
          - Spec.TimeBank.ControlLoadScalesInitialBank
          - Spec.TimeBank.ControlLoadNeverExtendsWindow
          - Spec.TimeBank.TimeoutIgnoresPreferredResponse
    wiki_refs:
      - wiki:reazioni-overwatch-e-previsioni
    wiki_note: >-
      Le **regole** sono decise (2026-08-09); i **valori** restano baseline di playtest.
      La Wiki non deve pubblicarli come definitivi finché §3.2 non li promuove.
    last_verified:
      date: 2026-08-13
      commit: 0cff74e
    notes: >
      Sostituisce D20 («nessun cap aggregato, si misura al playtest») **prima** della misura che
      l'avrebbe informata: rischio assunto e dichiarato in §2.1 della spec. I due rientri di
      ADR-0004 §Revisione — cap per turno e `MaxPromptsPerReaction = 1` — restano validi e
      compatibili col bank. CP 14.8 **non precede** CP 14.5/14.6: la prima misura arriva comunque
      prima della taratura. Nessun codice: la feature nasce come specifica.
      **2026-08-17 — consolidamento multi-Hero / Preferred Response** ([D-156], [D-157]; referto
      `plans/multihero-timebank-preferred-response-spec-panel-2026-08-17.md`). Tre aggiunte alla spec e
      **zero** sistemi nuovi: *(1)* il bank scala col carico di controllo con `LoadFactor` **dentro** la
      derivazione di `D-056` — il fattore moltiplicativo proposto dal kit e' stato respinto perche'
      rimetteva fuori formula il numero magico che quella derivazione aveva tolto; *(2)*
      `FastReactionDuration` **non** cresce col numero di Hero, ed e' ora un invariante scritto in §1.2;
      *(3)* `PreferredResponse` e' una dichiarazione di planning che vive accanto a
      `FRTArmedOverwatch::Condition` ([D-109]) e ne e' l'opposto — quella **riduce** le
      `AllowedResponses`, questa non le tocca.
      🔴 **Una voce di DoD di #319 e' oggi falsificabile, misurata in questo giro**: `spec-turnlog.md` §4.2
      prescrive `ERTLogCategory::Decision`, il codice di CP 14.5 ha in coda `ReactionDecision`, gia'
      serializzata in TurnLog v8. Sono due categorie sulla stessa finestra e la scelta va fatta **prima**
      del runtime — riga **75** di `DOC_CONFLICT_MATRIX.md`, stato `CONFLICT`.
      ⚠️ **La verifica PIE del Quick Confirm NON e' stata scritta**: `docs/technical/test-manuali-pie.md`
      appartiene a un'altra track in `parallel-batch.yaml` e per `D-139` si aspetta il suo owner. Il testo
      pronto sta nel DoD di #319 e in §11 della spec: e' un debito **nominato**, non una dimenticanza.

