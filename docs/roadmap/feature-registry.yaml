      checkpoints: []
      out_of_release_scope: >-
        Strumento d'editor: non entra nella build di gioco e non ha un gate di release.
        E' l'ANTICIPAZIONE dichiarata della meta' di authoring di E23.1 (v0.2), decisa il
        2026-08-12; l'epic #324 NON si apre, e la logica di transizione resta sua.
    dependencies:
      - RT-FEAT-MAP-HEXGRAPH
      - RT-FEAT-TOOL-MAP-EDITOR
    owner_specs:
      - docs/roadmap/plans/map-sketch-editor-spec-panel-2026-08-12.md
    issues: [619, 620, 621]
    tests: []
    scenarios:
      # L'unico scenario che questa feature produce: le quattro fixture di geometria NON sono
      # scenari (vedi note). Dichiarato `planned` perche' il warning di `validate` e' il meccanismo
      # che tiene visibile un piano finche' non diventa un file (`scenario-map.md` §6.2).
      - planned:
          - Spec.Map.ConstrainedCellCostsMore
    wiki_refs: []
    notes: >
      Il modello: un segmento quantizzato investe delle celle, l'occupazione si misura su **dodici
      settori** (uno ogni 30°) piu' il centro, e la classificazione `Free`/`Constrained`/`Blocked`
      ne esce per soglia. I dodici settori NON sono direzioni di movimento: quelle restano sei,
      pointy-top.


      `spec: partial` e non `done` perche' una domanda di modello resta aperta — `MSE-1` in
      `OPEN_DECISIONS.md`: la cottura non e' invertibile senza conservare il sorgente, e nessuno ha
      ancora deciso cosa succede se qualcuno modifica a mano un campo cotto. `tests: []` e
      `scenarios: []` sono vuoti e **veri**.


      Revisione spec panel del 2026-08-12 su #619, due decisioni dell'autore che vincolano il
      modello. **D1**: il confine #619/#621 e' **per campo** — il costo e' di #619, i bordi
      (`FRTHexCover`, `bBlocksMovement`) sono di #621. Serviva perche' `ReachableCells` e `FindPath`
      leggono solo `FRTHexCellData`, quindi `Constrained` non era osservabile senza che qualcuno
      scrivesse un campo. **D2**: il sovrapprezzo di `Constrained` **non** vive in `MoveCost`, che ha
      gia' un produttore che lo ricalcola dalla sola `Surface` ogni turno
      (`ARTTurnManager::ApplyDynamicSurface` e `TickDynamicSurfaces`); e' un intero suo, sommato dai
      lettori del costo. Ne segue che `FormatVersion` sale da 6 a 7 e il campo entra in
      `RTMatchStateHash`. La `D-0xx` la prende la PR che implementa.


      ⚠️ Le quattro fixture di geometria **non** vanno in `Scenarios/`: `FRTScenarioCell` porta
      `Cell`, `bBlocksMovement`, `bBlocksLineOfSight`, `MoveCost` e nessun campo per segmenti o
      footprint. Sono dati di test del modulo runtime; in `Scenarios/Spec/Map/` — che contiene oggi
      **un solo file**, `BridgeBreaksThePath.json` — va **un** solo scenario nuovo, quello che mostra
      l'effetto di `Constrained` su `ReachableCells`: e' `Spec.Map.ConstrainedCellCostsMore`,
      dichiarato `planned` qui sopra perche' resti visibile come warning finche' non e' un file.


      Vincolo di collocazione, non preferenza: maschera, classificazione e cottura vivono nel
      modulo **runtime** e l'editor le chiama. In `Source/RefactorTacticsEditor/` non esiste alcun
      test — rimisurato su `origin/main` il 2026-08-12: 19 file, zero corrispondenze `*test*`. Cio'
      che nasce dentro l'editor nasce non verificabile. *(Questa nota citava la PR #598 come «aperta,
      non mergiata»: e' mergiata dal 2026-08-12T07:07:42Z. L'argomento non dipendeva da quella PR ed
      e' stato rimisurato.)*


      Perche' e' una feature separata da `RT-FEAT-TOOL-MAP-EDITOR` invece di una sua nota: quella e'
      una **modalita' d'editor** con i suoi quattro tool, questa e' un **modello di dati** con una
      cottura verso `FRTHexCover` e `bBlocksMovement`. Tenerle insieme farebbe dipendere lo stato di
      uno strumento maturo (`TESTABLE`) da un lavoro non cominciato.

