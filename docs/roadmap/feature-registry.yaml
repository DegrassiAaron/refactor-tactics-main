  - feature_id: RT-FEAT-TOOL-SKILL-WORKBENCH
    title: Skill Workbench — varianti di abilita' separate dal dato di produzione
    area: Tools
    kind: tooling
    release: future
    priority: P3
    status: DESIGNED
    gates:
      spec: partial
      data: todo
      runtime: todo
      log_debug: todo
      automation: todo
      scenario: todo
      ui_wiki: todo
      packaged: na
      network_privacy: na
      replay_representable: na
    roadmap:
      epic: null
      milestone: M9
      checkpoints: []
      out_of_release_scope: >-
        Strumento d'editor: non entra nella build di gioco e non ha un gate di release.
        Tracciato da M9.4 e dalla EditorMap. La meta' di MISURA — batch, metriche, confronto su
        suite — resta invece di **E43** (v0.8) e di `RT-FEAT-TOOL-BALANCE-GROUND`: questa feature
        produce la variante, quella la misura.
    dependencies:
      - RT-FEAT-TOOL-SCENARIO-COMPOSER
      - RT-FEAT-TOOL-BALANCE-GROUND
      - RT-FEAT-DATA-ASSET-PIPELINE
    owner_specs:
      - docs/technical/spec-tactical-designer.md
      - docs/roadmap/plans/tactical-designer-consolidamento-2026-08-17.md
    issues: []
    tests: []
    scenarios: []
    wiki_refs: []
    notes: >
      Il concetto che manca e' **una configurazione di abilita' che non e' il dato di produzione** —
      la si prova, la si confronta con la baseline, e diventa produzione solo con un atto esplicito.
      🔴 **Il nome `Candidate` e' gia' occupato, e la misura che lo dice va conservata.**
      `grep -ril "candidate" Source/RefactorTactics --include=*.h` restituisce cinque file —
      `RTActionDef.h`, `RTCatalogLibrary.h`, `RTHexBotLibrary.h`, `RTPointerInteraction.h`,
      `RTMovementActionLibrary.h`. 🔴 **Questa nota diceva «in tutti e cinque», ed era sovradichiarato**:
      in **quattro** significa **mossa candidata del bot** (`BuildCandidates`, `ChooseBestPlan`, le candidate
      d'attacco che nascono da `ReachableCells`); nel quinto, `RTPointerInteraction.h`, `FRTPointerCandidates`
      e' *«cosa il raycast ha trovato sotto il cursore, prima che qualcuno decida cosa significa»* — un
      **terzo** spazio semantico. La conclusione regge lo stesso e anzi si rafforza: `Candidate` in questo
      repository e' gia' ambiguo fra due significati, e un terzo lo renderebbe illeggibile. Trovato in code
      review, ed e' la forma di errore che questo paragrafo esiste per prevenire.
      E' un'alternativa valutata **dentro un turno**, non una configurazione confrontata **fra due
      esecuzioni**: due spazi semantici sotto la stessa parola. Chi implementera' questa feature usi
      **`Variant`**, che e' gia' il vocabolario dello scenario (`FRTScenarioVariant`).
      ⚠️ **Il punto d'innesto esiste, e porta il proprio trade-off scritto.** `FRTScenarioVariant`
      varia oggi **solo le celle**, e la struct dichiara perche': *«una variante che potesse cambiare
      eroi, squadre o condizione iniziale non sarebbe piu' lo stesso scenario con un ingresso
      diverso, e il confronto fra le sue tracce non direbbe piu' quale ingresso ha prodotto la
      differenza»*. Il baseline-vs-variante e' esattamente «servisse variare altro»: non nasce un
      secondo meccanismo, si estende questo — e l'estensione deve **dichiarare** cosa smette di
      essere attribuibile.
      ⚠️ **Nessun punteggio opaco diventa un gate** (`spec-tactical-designer.md` §8). E l'ordine
      con `D-102` non e' negoziabile: il competence gate del bot (`#543`) viene **prima** di
      qualunque confronto a lotti, o si misura un'abilita' che il bot non sa usare.

