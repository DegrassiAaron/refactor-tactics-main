      # Il quarto NON si scrive, e non e' un rinvio: `Spec.Brace.PushBeyondGuardThreshold` chiedeva una
      # spinta di 2 per far cedere `Guard` e mostrare la clausola di `Brace`. D-074 (uscita (B) di #400)
      # ha deciso di NON introdurla e di riscrivere invece la clausola: senza quel numero lo scenario non
      # ha soggetto. Rinasce solo se una v0.2 introduce la spinta forte.
