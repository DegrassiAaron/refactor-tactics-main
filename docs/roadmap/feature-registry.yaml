      basta» a azione di Prep che **arma un profilo**. `Hold Ground` coincide con il comportamento attuale
      (`RTCombatLibrary.h:112`, `RTTurnManager.cpp:2819` e `:3033`), quindi i due scenari restano verdi e
      nessun valore di bilanciamento si muove.

      **Un test scritto per pinnare lo stato attuale deve cadere**: `Reactions.Brace.IsNotAReaction`
      (`RTDefensiveReactionTests.cpp:162`) asserisce `ReactionTrigger == None`. Va **sostituito**, non
      cancellato in silenzio, da `Brace.BaseProfileHasSingleResponse` (col profilo base nessun boundary si
      apre: e' la garanzia che nulla di verde rallenta) e `Brace.RicherProfileOpensWindow`. Finche' la
      sostituzione non e' fatta, `automation` resta `partial` anche se la suite e' verde: e' verde sulla
      classificazione **vecchia**.

      **`data` resta `partial` anche dopo il triage del 2026-08-10**, e il motivo si e' precisato: i quattro
      profili concreti — Flux `Grounding`, Riva `Flow`, Bastion `Anchor`, Vektor `Deflection` — sono
      proposti da un sorgente ma **non decisi** (`BAS-1` in [`../OPEN_DECISIONS.md`](../OPEN_DECISIONS.md)).
      Due dei quattro nomi sono gia' occupati nel roster con semantica **diversa**: `Vektor.Deflection` e'
      riduzione danno (−20 sul colpo, `RTHeroCatalogLibrary.cpp:557`) proprio dove il profilo `Brace`
      dovrebbe essere anti-displacement, e `Riva.FlowReaction` reagisce a un **colpo subito**, non a un
      Forced Movement. Sono `BAS-3` e `BAS-4`: collisioni di nome, non dettagli di naming — vanno sciolte
      prima di CP 14.7, non durante.

