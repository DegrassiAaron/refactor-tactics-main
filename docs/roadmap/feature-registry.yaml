      date: 2026-08-16
      commit: 79633a3
    notes: >
      KPI «replay divergence 0» verificato anche su hex. `ui_wiki` parziale: il determinismo è citato
      nelle regole fondamentali ma non ha una pagina che lo spieghi al giocatore.
      ⚠️ **2026-08-16 — il determinismo NON era strutturale come si credeva, ed è stato misurato.** Il
      corpus di CP 47.5 ha trovato `#990`: `MakeCurrentSnapshot` costruiva l'identità delle unità come
      indice in un array non ordinato, e `PlanBots` iterava quegli indici — quindi **l'ordine di spawn
      decideva la partita**, dal turno in cui due bot cominciano a interagire. Il turno 1 restava
      identico byte per byte, che è la ragione per cui nessuno dei test preesistenti lo vedeva.
      ⛔ **E lo `StateHash` non avrebbe potuto vederlo**: è permutazione-invariante per costruzione. È il
      caso che giustifica la scelta del DoD di #958 — confrontare il **TurnLog canonico turno per turno**
      invece dell'hash finale — e la prima volta che quella scelta paga.
      ⚠️ **`DifferentSeedVariation` resta escluso** e la ragione non è «manca la premessa»: scriverlo
      farebbe cadere `Simulation.SeedIsDeclaredAndUnconsumed`, che verifica l'opposto. Il gancio è
      `RNG-1` in `OPEN_DECISIONS.md` (`#960`).

