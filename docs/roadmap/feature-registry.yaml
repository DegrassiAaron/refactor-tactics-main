      ⚠️ **Il pezzo che la issue dichiarava assente e non lo e': la posizione.** Dopo `AdvancePhase` il
      cursore punta gia' alla fase SUCCESSIVA e puo' aver cambiato traccia, quindi «turno e fase
      correnti» non si leggono da li' — una UI che ci provasse mostrerebbe il turno sbagliato a ogni fine
      turno. Vive in un view model (`Replay/RTReplayViewModel.h`), come `FRTMatchHeaderView` per l'HUD e
      `FRTScreenStack` per la navigazione: e' cio' che rende `automation` raggiungibile senza widget.

      🔴 **Incoerenza di release dichiarata, e il validator NON la intercetta.** Questa feature e' `v0.1`
      per allineamento a E46 (decisione del 2026-08-16, panel §5b) mentre `RT-FEAT-REPLAY-ARCHIVE`, da cui
      dipende, e' `v0.2`. Il controllo sulle `dependencies` verifica che il `FeatureId` esista, non che la
      release sia coerente — misurato su `scripts/feature_registry.py:547`. Non e' bloccante: il core e'
      gia' `INTEGRATED`, quindi la v0.1 non aspetta nulla. La chiusura pulita e' promuovere anche
      l'archivio, che e' scope di release e merita una `D-nnn`.

      **Stato al 2026-08-16**, dopo il secondo giro: il view model (`#472`, **11** test) e il **ponte
      Blueprint** (`#999`, `Replay/RTReplayViewerSubsystem.{h,cpp}`, **6** test) esistono, e l'area
      `RefactorTactics.Replay` chiude **47/47**.
      ⚠️ I numeri si rimisurano a ogni giro e non si incrementano a mente: erano `8` e `38` nella prima
      stesura di questa riga, `11` e `41` dopo la prima code review, `11+3` e `44` all'apertura della PR
      del ponte, e `11+6` e `47` dopo la seconda — che ha trovato meta' dei forwarder senza copertura. Sono
      giusti un'ora per volta.
      `runtime` e `automation` restano `partial`: da qui in su mancano le **due schermate** e il loro
      `.uasset`, che vorranno una Binary Asset Lease, piu' il bootstrap del frontend — che pero' e' di
      E46 (`#938`), non di questa feature. Un `done` direbbe che `#472` e' finita, e non lo e'.

      ⚠️ **Doppio conteggio dichiarato**: `RefactorTactics.Replay.ViewModel.*` e' assorbito dal pattern
      generico `RefactorTactics.Replay.*` di `RT-FEAT-REPLAY-ARCHIVE`, quindi gli 8 test contano per due
      feature. **Si accetta invece di restringere il pattern dell'altra**: restringerlo cambierebbe la
      misura di una feature `INTEGRATED` che non e' in lavorazione qui, e il rischio di sbagliarla —
      lasciando scoperti Player, Seek, Producer o Verifier — supera il costo di due righe che si
      sovrappongono. Va ridiscusso quando `RT-FEAT-REPLAY-ARCHIVE` verra' toccata per altro.

