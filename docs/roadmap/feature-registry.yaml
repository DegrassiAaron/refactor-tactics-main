      - Spec.Facing.FrontHitOnCoverIsSilent
      - Spec.Facing.DerivesFromMove
      - Spec.Facing.DashReorients
      - Spec.Facing.TargetingReorients
      - Spec.Facing.BackAttackIgnoresGuard
      - Spec.Facing.FrontAttackKeepsGuard
      - Spec.Facing.BraceHoldsFromBehind
      - Spec.Facing.TurningPathUsesLastCompletedStep
      # 🔁 2026-08-13: i due della ROTAZIONE DICHIARATA, che fino a stamattina non erano scrivibili —
      # non per tempo, ma perche' la chiave `facing` nell'intent avrebbe reso l'harness il primo
      # produttore di `PlannedFacing`. Con `#737` il produttore esiste e la premessa e' caduta.
      # Si reggono a vicenda: il rifiuto da solo passerebbe anche con un resolver che rifiuta tutto.
      - Spec.Facing.IllegalDeclaredRotationIsRejected
      - Spec.Facing.StationaryDeclaredRotationApplies
    wiki_refs:
      - wiki:facing-e-direzionalita
    # 🔴 Questa nota diceva «Decisione accettata (ADR-0005) ma **non implementata**: quello che leggi qui
    # descrive come funzionera', non come funziona oggi», e il 2026-08-13 era falsa da tempo — contraddetta
    # dai gate della sua stessa voce (`scenario: done`, `automation: done`, `runtime: partial`) e da nove
    # scenari verdi. Finiva nel blocco di stato pubblicato sulla Wiki, quindi il giocatore leggeva «non
    # implementata» di una meccanica che il gioco esegue. Corretta al merge di questo consolidamento.
    wiki_note: >-
      Il facing e' **stato di gioco autorevole** e il turno lo esegue: deriva dal movimento, un'azione con
      bersaglio riorienta prima di risolvere, e la difesa direzionale lo legge. Restano scoperti l'**input**
      della rotazione dichiarata (#291) e l'**indicatore in HUD** dell'arco frontale: la regola c'e', il
      modo di sceglierla e di vederla no.
    last_verified:
      date: 2026-08-13
      commit: 83fb5ee9
    notes: >
      ADR-0005 e D-020 accettati, nessun codice. `Playback.DirectionYawFacesTarget` è
      presentazione, non stato di gioco: non vale come gate `runtime`. Prerequisito di E13.
      Attenzione: la pagina Wiki esiste già e descrive una meccanica che il gioco non ha —
      il blocco di stato generato deve dirlo.
      ⚠️ **Le due note qui sopra sono scadute, e restano scritte per non farle riscoprire.** Dicevano
      «ADR-0005 e D-020 accettati, nessun codice» e che il gate `scenario` era **impossibile**
      perché «`FRTScenarioIntent` non ha un campo di orientamento e `ERTAssertionKind` non ha
      un'assertion che legga il facing». Misurato il 2026-08-12: `UnitFacing` è un'assertion,
      otto scenari dichiarano `facing`, e sei di essi sono elencati qui sopra — il gate è `done`
      da CP 16.1/16.2. La contraddizione stava dentro lo stesso blocco: una nota che dichiara
      impossibile ciò che la lista sopra di lei elenca.
      **Aggiunto il 2026-08-12 (#649)**: un colpo che annulla la copertura per la direzione ora
      lascia una traccia (`Facing/RearHitBypassedCover`, prima emessa solo per la Guard), e
      `FRTHexAttackHit` porta i punti scavalcati. Serve al bot, che dal 2026-08-12 conta quel
      danno come bonus in pianificazione (CP 13.5) e finora lo contava senza che nessuno potesse
      verificarlo. ⚠️ `Amount` diverge fra le due voci — direzione per la Guard, punti per la
      copertura — ed è nominato nel codice invece che scoperto dopo.
      Il modello ha inoltre decisioni aperte, `FAC-1`…`FAC-10` in `docs/OPEN_DECISIONS.md`:
      `FAC-4` (il facing durante i micro-step di un Move) blocca CP 16.1, perché i trigger di
      reazione cadono dentro il movimento e l'ADR copre inizio e fine ma non il mezzo.
      ⚠️ 2026-08-12: `FAC-12` — *il pivot si paga in punti movimento, o resta un tetto?* — e' stata
      **riproposta da un secondo kit indipendente** (`CLAUDE_ActionEconomy_Movement_Facing_Consolidation`
      §15), che la presenta come direzione corrente senza sapere di ADR-0008. La risposta non cambia e la
      data della revisione nemmeno (chiusura di CP 16.2): cambia il peso, perche' due sorgenti scollegate
      chiedono la stessa cosa. L'argomento nuovo e' che **un tetto non si spende**, quindi non produce da
      solo la scelta «viaggio piu' lontano o arrivo orientato bene?». Il costo del pivot resta fuori dai
      gate di questa feature finche' e' aperto.
      ⚠️ **2026-08-13 — `FAC-11` chiusa da `D-126`, e nessun gate cambia.** La primitiva **semantica** del
      facing diventa la relazione a sei direzioni relative; `HexCone` resta la **geometria d'area** dei tre
      consumatori di ADR-0005 §4, che non si spostano. Il motivo e' misurato, non prudenziale: il cono a
      120° e' **strettamente contenuto** nell'insieme dei tre lati frontali — **45** celle di divergenza su
      raggio `1..10`, **tutte** nel verso «tre-lati dentro / cono fuori», **zero** nel verso opposto, la
      prima a distanza **2** — quindi sostituirlo sarebbe un **buff difensivo**, non una rinomina.
      ⚠️ **La cifra diceva `50` fino al 2026-08-16**: era la misura della regola a **linea**, poi
      scartata. Corretta da `D-147` insieme alle altre sei sedi. `docs/archive/` porta ancora `50`
      per costruzione — e' storico, e non va «riallineato».
      🔴 **Il gate `scenario` resta `done` ma la copertura non e' completa**, e va detto: la relazione a sei
      lati **non esiste in `Source/`** (grep di `RelativeDirection`/`ERTRelativeDir`/`RelativeFacing` →
      zero), quindi `Spec.Facing.SixRelativeSides` **non e' stato creato**: senza l'assertion che la legge
      sarebbe una scatola vuota, e il loader rifiuta per scelta i nomi sconosciuti. Nasce nel DoD di
      **#726** insieme alla funzione che dimostra. **Aggiunto invece** `Spec.Facing.TurningPathUsesLastCompletedStep`
      (nono scenario, elencato sopra): fino a oggi l'unico scenario con un `move` era `DerivesFromMove`, ed
      era **rettilineo** — un percorso dritto non distingue «ultimo passo compiuto» da «direzione del
      viaggio», che e' proprio la regola di ADR-0008 §2.

