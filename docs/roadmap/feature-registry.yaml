      CP 23.6, dato cotto). Sono due numeri simili con owner diversi: confonderli creerebbe il secondo
      owner del clearance, che e' il difetto che quest'area paga piu' caro.

      ⚠️ **`epic: E21` e non un'epic nuova** (`D-153`): E21 e' «Presentazione e leggibilita'» della
      v0.1 ed e' l'unica epic il cui DoD non e' chiudibile in automation — la stessa condizione di
      questo contratto. `checkpoints: []` perche' il lavoro esecutivo NON e' un checkpoint di E21: si
      innesta su owner gia' esistenti (E23 per muri/porte, E47 per la board, E15 per il Rele',
      E45 per il freeze del contratto), ed e' esattamente cio' che `D-153` decide.

      🔴 **Sette dei diciannove elementi del catalogo sono `DEFER`, e tre dipendono da feature
      `IDEA` su release `future`** (`RT-FEAT-MAP-STRUCTURAL`, `RT-FEAT-MAP-VERTICALITY`). Il kit
      «completo» non e' raggiungibile in v0.1, e non e' un ritardo: sette voci su diciannove descrivono
