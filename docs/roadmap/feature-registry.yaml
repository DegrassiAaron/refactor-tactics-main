  - feature_id: RT-FEAT-MAP-FACING
    title: Facing come stato di gioco autorevole
    area: Map
    kind: gameplay
    release: v0.1
    priority: P1
    # INTEGRATED -> IMPLEMENTING il 2026-08-10, per crescita della spec (ADR-0008), non per regressione del
    # codice. Nessun test e' diventato rosso: e' il metro ad essersi allungato. Vedi il commento su `runtime`.
    status: IMPLEMENTING
    gates:
      spec: done
      data: done
      # Consumatori reali: il Move e il Dash lo scrivono, un'azione con bersaglio riorienta prima di risolvere,
      # il playback ci atterra sopra, e la difesa direzionale di CP 16.2 lo legge per decidere se la copertura
      # protegge. L'unico momento di D-020 senza codice e' `FacingUsedByOverwatch`, che appartiene a E14.
      #
      # `done` -> `partial` il 2026-08-10: non e' il runtime a essere regredito, e' la SPEC ad essere cresciuta.
      # ADR-0008 aggiunge tre requisiti che nessuna riga di codice soddisfa: il budget di pivot per eroe
      # (`MoveEndPivotMaxSteps`/`DashEndPivotMaxSteps` — `LegalFacings` oggi legge lo stile, non l'eroe), il
      # facing durante i micro-step, e le policy dichiarative di facing. Lasciarlo `done` direbbe che la feature
      # e' completa rispetto a una spec che non e' piu' quella.
      runtime: partial
      log_debug: done
      automation: done
      scenario: done
      # La Wiki lo spiega e la figura in campo e' girata dal lato giusto, ma il gioco non MOSTRA l'arco:
      # niente indicatore del cono frontale in HUD, quindi «leggibile in gioco» non e' ancora vero.
      ui_wiki: partial
      packaged: todo
      # Era `na`, ed era sbagliato: il facing viaggia negli intent, quindi dovra' essere corretto in rete.
      # `partial` perche' il filtro per squadra esiste ed e' testato (`Facing.IntentIsTeamFiltered`), ma
      # nessuna verifica in rete e' possibile finche' la rete non c'e' (M10).
      network_privacy: partial
      replay_representable: done
    roadmap:
      epic: E16
      checkpoints: ["16.1", "16.2"]
    dependencies:
      - RT-FEAT-MAP-HEXGRAPH
      - RT-FEAT-MAP-COVER
    owner_specs:
      - docs/decisions/adr-0005-orientamento.md
      # ADR-0008 (2026-08-10) supera §1 e §3 di ADR-0005: budget di pivot per eroe, policy dichiarative di
      # facing, e facing nei micro-step = ultimo passo compiuto. Nessuno dei tre e' implementato.
      - docs/decisions/adr-0008-rotazione-e-policy-di-facing.md
      - docs/decisions/RT_PDR_00_Decision_Log.md
      - docs/technical/spec-turnlog.md
    issues: [175, 176, 177, 291, 341, 339, 726, 737]
    # La rotazione DICHIARATA (girarsi restando fermi) e' regola implementata ma senza produttore: nessun
    # input la scrive. Il gate `runtime` resta `done` perche' l'orientamento DERIVATO — quello che un'unita'
    # ha in quasi tutti i turni — e' cablato ovunque; il pezzo mancante e' input, ed e' tracciato in #291.
    #
    # 🔁 2026-08-13: quel pezzo mancante NON e' isolato, ed e' il motivo per cui #737 compare qui accanto a
    # #291. `PlannedFacing`/`bDeclaresPlannedFacing` sono uno di TRE campi di piano nella stessa condizione —
    # gli altri due sono `PlannedAttackCell`/`bAttackTargetsCell` e `PlannedCoverEdge`/`bHasPlannedCoverEdge`:
    # letti dal `TurnManager`, scritti solo dallo Scenario Harness, mai da `Player/` o `UI/`. Trattarli come
    # un solo lavoro non e' un accorpamento di comodo: hanno un produttore solo — il contratto del puntatore
    # (CP 11.8, #705) — e servono lo stesso contesto esplicito. #737 li possiede tutti e tre; #291 resta
    # aperta per il suo, e la sua ultima casella si spunta li'.
    #
    # ✅ **2026-08-13 sera: l'input esiste e la catena e' completa.**
    # `ARTPlayerController::HandleFacingSector` scrive il campo dal contesto `ERTPointerContext::Facing`,
    # chiedendo la legalita' a `URTFacingLibrary` e RIFIUTANDO una dichiarazione illegale invece di
    # correggerla. Caduta la premessa che teneva fuori la chiave di scenario, sono entrate anche quella
    # (`facing` in `FRTScenarioIntent`) e la capability `DeclaredRotation`: la rotazione dichiarata e' ora
    # dimostrata sul percorso reale `Intent -> Planning -> Snapshot -> Resolver -> TurnLog`, non solo in
    # libreria pura.
    #
    # ⏳ Di `#291` restano **due** righe, entrambe con un blocco che non e' questo: l'insieme legale
    # mostrato a schermo (`#613`, senza il quale il giocatore scopre il rifiuto provando) e il bot, che
    # non dichiara rotazioni. Nessuna delle due impedisce di usare la feature: impediscono di usarla bene.
    completed_by:
      - RT-FEAT-UI-PLANNING
    tests:
      - RefactorTactics.Facing.LinearMoveDerivesDirection
      - RefactorTactics.Facing.BudgetMoveAllowsLastStepPlusMinusOne
