# RefactorTactics — Feature Registry canonico
#
# SORGENTE. Questo file si edita a mano; `feature-registry.json` è GENERATO da qui
# (`python scripts/feature_registry.py generate`) e non si edita mai.
#
# Regole, schema e significato dei gate: `feature-registry.md` (owner documentale).
# In sintesi:
#   - lo stato di una feature vive QUI e in nessun altro posto: roadmap, Wiki e workbook
#     referenziano il `feature_id` e leggono lo stato, non lo copiano;
#   - `status` è DERIVATO dai gate con una regola deterministica e il validator lo verifica:
#     se i gate non reggono lo stato dichiarato, `validate` fallisce;
#   - niente percentuali: il progresso è «N/M gate», che è verificabile.
#
# Valori ammessi
#   gates.*      : done | partial | todo | na
#   status       : IDEA | DESIGNED | SPECIFIED | IMPLEMENTING | TESTABLE | INTEGRATED
#                  | RELEASE_READY | DONE | DEFERRED | BLOCKED
#   release      : v0.1 | v0.2 | future
#   priority     : P0 | P1 | P2 | P3
#   kind         : gameplay | ui | tooling | data | infra | content
#   tests        : pattern di nome test, con `*` finale ammesso; devono matchare test reali
#   scenarios    : ScenarioId dichiarati nei file di `Scenarios/`; `planned:` per quelli non ancora in repo
#   wiki_refs    : `docs/wiki/...md` (pagina sorgente) oppure `wiki:<PageName>` (solo nel repo Wiki)
#   roadmap      : `epic` + `checkpoints` per la vista di release (roadmap-v0.1.md);
#                  `milestone` per il lavoro che vive solo nella vista di esecuzione
#                  (roadmap-checkpoint.md). I due spazi di numerazione **collidono** — CP 10.1
#                  è «Activate e Interact» in E10 e «listen server» in M10 — quindi un
#                  checkpoint di milestone non si scrive mai in `checkpoints`.
#
# `last_verified` dice quando quella riga è stata confrontata col codice, e su quale commit.
# Una riga senza `last_verified` non può dichiarare stato >= TESTABLE (errore del validator).

meta:
  registry_version: 1
  schema_version: 1
  last_full_audit:
    date: 2026-08-08
    commit: 2094b86
    suite: 490 test unici in 69 file
  note: >
    Primo audit completo. La seed list dell'handoff del 2026-08-08 è stata confrontata voce per voce
    con Source/, Tests/, Scenarios/, docs/ e la Wiki: le voci che il repository non conferma sono
    marcate per quello che sono (SPECIFIED, DESIGNED, IDEA), non promosse a DONE.

