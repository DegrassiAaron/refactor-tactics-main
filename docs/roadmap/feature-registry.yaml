      racconta ancora la scala di precisione** — cosa impari da un rumore e cosa no, che è la prima cosa di
      questa feature che valga la pena dire al giocatore.
      ⚠️ **L'intensità di un evento non ha una fonte dati** (#690, 12-08): la scala `0-10` di
