      **Misura, non produzione** (D-011): dove si rompe il sistema con otto unità. Non decide il
      formato competitivo finale — 3v3 resta la baseline di studio, 4v4 lo stress test.

      **CP 17.1 e 17.2 chiusi il 2026-08-10.** Il roster core a quattro per squadra gioca una
      partita intera su un'arena r=8 con tre direttrici, e due esecuzioni identiche danno gli
      stessi hash — confrontati **turno per turno**, perché un hash finale uguale non esclude che
      due partite siano passate per stati diversi, e «diverge dal turno N» è l'unica diagnosi utile.

      Il difetto che l'epic cercava — un `if (Num == 2)` nel resolver — **non è stato trovato**.
      `NoTeamSizeAssumptionInResolver` interroga 1v1, 2v2, 3v3 e 4v4: con due sole dimensioni,
      «funziona per ogni N» e «funziona per i due N che ho provato» si leggono uguali.

      Misure registrate (playback off, 12 turni, arena r=8): resolver **2,319 ms/turno** a 4v4
      contro **1,655** del 2v2 su r=6 — entrambi due ordini di grandezza sotto il target PDR di
      100 ms — e TurnLog **11,7 voci/turno** (~840 byte). ⚠️ Due delle cinque metriche richieste dal
      DoD, «opportunity di reazione per turno» e «prompt manuali per turno», sono **NON MISURABILI**
      e il test lo scrive invece di riportare uno zero: il produttore in partita è CP 14.5, e uno
      zero per assenza di produttore si legge come uno zero per assenza di reazioni.

      ⚠️ Limite dichiarato dell'arena: la direttrice «centro/obiettivo» è oggi solo **geometrica** —
      un corridoio, non un punto di controllo. Un obiettivo contendibile è CP 10.2 (`#75`), che non
      è atterrato. Resta CP 17.3, che è una voce PIE (`PIE-V01-STRESS4V4`) e un giudizio a schermo.

