      - RefactorTactics.Reactions.Brace.*
    scenarios:
      - Visual.Combat.BraceReducesEveryHit
      - Spec.Facing.BraceHoldsFromBehind
      - Spec.Brace.ProfileChangesResponse
      # Dichiarati dal triage del 2026-08-10 (`plans/baseaction-signatures-spec-panel-2026-08-10.md`).
      # `Spec.Brace.ProfileChangesResponse` sopra e' il caso GENERICO — un profilo cambia le risposte;
      # questi sono i profili CONCRETI. `BAS-1` li ha decisi il 2026-08-13 (D-132), quindi restano
      # `planned` per il solo motivo che nessuno li ha ancora scritti.
      #
      # ⚠️ **Rinominati con D-132, e uno e' CADUTO**: i tre nomi del triage nascevano dai profili
      # proposti — `Anchor`, `Flow`, `Deflect` — e due di quei nomi non esistono piu'.
      #   `Spec.Brace.AnchorResistsDisplacement` **non si riscrive**: Riktor non ha un profilo, perche'
      #   `Status.Braced` resiste gia' allo spostamento a qualunque distanza. Lo scenario avrebbe
      #   dimostrato il comportamento BASE spacciandolo per un profilo, ed e' verde per il motivo
      #   sbagliato — la trappola che `ProfileChangesResponse` documenta gia' in `_nota_perche_esiste`.
      # `CHAR-BASE-009` (Guard != Brace) non entra: il suo posto e' il test unit
      # `Reactions.Brace.BaseProfileHasSingleResponse`, gia' previsto dal DoD di CP 14.7.
      - planned:
          - Spec.Brace.GroundingChargesOnDeclaredTerrain
          - Spec.Brace.SidestepRedirectsToLegalHexOnly
          - Spec.Brace.GlanceOffersOnlyLegalSides
    wiki_refs:
      - wiki:reazioni-overwatch-e-previsioni
    wiki_note: >-
      `Hold Ground` — la risposta base — funziona gia' in partita; i profili d'eroe che ne dichiarano altre no.
    last_verified:
      date: 2026-08-09
      commit: ea26c0f
    notes: >
      D-047 cambia la **classificazione** di `Action.Brace`, non i suoi numeri: da «azione che si dichiara e
      basta» a azione di Prep che **arma un profilo**. `Hold Ground` coincide con il comportamento attuale
      (`RTCombatLibrary.h:112`, `RTTurnManager.cpp:2819` e `:3033`), quindi i due scenari restano verdi e
      nessun valore di bilanciamento si muove.

      **Un'asserzione scritta per pinnare lo stato attuale deve cadere** — e non e' un test a se', come
      questa voce ha detto fino al 2026-08-13: `ReactionTrigger == None` su `Action.Brace` sta **dentro**
      `Reactions.DefensivesMatchCatalog` (`RTDefensiveReactionTests.cpp:171`), insieme al pinning di costo,
      priorita', cooldown, slot e macro-fase delle cinque difensive. Il nome `Reactions.Brace.IsNotAReaction`
      non esiste in `Source/` (`grep -rn` e `git log -S` entrambi vuoti), quindi **si sostituisce la riga, non
      si cancella il test** — da `Brace.BaseProfileHasSingleResponse` (col profilo base nessun boundary si
      apre: e' la garanzia che nulla di verde rallenta) e `Brace.RicherProfileOpensWindow`. Finche' la
      sostituzione non e' fatta, `automation` resta `partial` anche se la suite e' verde: e' verde sulla
      classificazione **vecchia**.

      ✅ **Il contenuto e' deciso dal 2026-08-13** ([D-127](../decisions/RT_PDR_00_Decision_Log.md), chiude
      `BAS-1`, `BAS-3` e `BAS-4`). I profili sono **tre**, non quattro, e vivono nel namespace di catalogo
      `Profile.<Nome>` — l'eroe li referenzia da un campo dato, nessun prefisso d'eroe nel token:

        - Gadget `Profile.Grounding` — risposta `GROUND`
        - Phase  `Profile.Sidestep`  — risposta `SIDESTEP` (hex adiacente legale)
        - Wraith `Profile.Glance`    — risposte `GLANCE LEFT` / `GLANCE RIGHT`

      🔴 **Riktor non ne prende uno, e la ragione e' misurata**: `ANCHOR` prometteva «annulla lo spostamento»,
      che `Hold Ground` (`Status.Braced`) fa **gia' e con la stessa ampiezza** — il ramo `Braced` del resolver
      non controlla `KnockDist`, a differenza di `Guarded`. Cardinalita' 1, nessun boundary: sarebbe stata la
      terza scrittura della stessa regola dopo `Reaction.Anchor` e `Gadget.Anchor`. Il roster conserva cosi'
      **un eroe senza finestra sul `Brace`**, che e' la baseline della misura di pacing di CP 14.6.

      Le due collisioni di nome sono sciolte cedendo il nome a **chi arriva dopo**: `Hero.Wraith.Deflection`
      (`RTHeroCatalogLibrary.cpp:604`, −20 sul colpo diretto) e `Hero.Phase.FlowReaction` (`:377`, `Reposition 1`
      dopo un colpo subito) **non si toccano** — sono token serializzati, e D-120 vieta i rename automatici.
      Per Phase restano **due entita'**: il caso che le separa, «Phase colpita ma non spostata», sopravvive.

      ⚠️ **Restano aperti i numeri**, che non erano di `BAS-1`: resistenza del `Brace`, Charge del
      `Grounding`, ampiezza della deviazione. Sono bilanciamento e si restringono al playtest.

