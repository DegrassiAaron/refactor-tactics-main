      l'effetto di `Constrained` su `ReachableCells`: e' `Spec.Map.ConstrainedCellCostsMore`,
      dichiarato `planned` qui sopra perche' resti visibile come warning finche' non e' un file.


      Vincolo di collocazione, non preferenza: maschera, classificazione e cottura vivono nel
      modulo **runtime** e l'editor le chiama. 🔴 **La misura che sosteneva questa riga e' scaduta**: diceva
      «in `Source/RefactorTacticsEditor/` non esiste alcun test — 19 file, zero corrispondenze `*test*`,
