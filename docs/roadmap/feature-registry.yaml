      Swim/Amphibious/Hover, che non esistono. Tocca il resolver e non solo la mappa: una corrente che
      sposta e' displacement, con catene e collisioni. La propagazione elettrica su rete d'acqua che il
      sorgente chiede ESISTE GIA' (CP 8.3, BFS, `StopsAtNonConductive`). Nessuna domanda aperta.

