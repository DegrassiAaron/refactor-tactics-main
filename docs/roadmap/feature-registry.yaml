      # protegge. L'unico momento di D-020 senza codice e' `FacingUsedByOverwatch`, che appartiene a E14.
      #
      # `done` -> `partial` il 2026-08-10: non e' il runtime a essere regredito, e' la SPEC ad essere cresciuta.
      # ADR-0008 aggiunge tre requisiti che nessuna riga di codice soddisfa: il budget di pivot per eroe
      # (`MoveEndPivotMaxSteps`/`DashEndPivotMaxSteps` — `LegalFacings` oggi legge lo stile, non l'eroe), il
      # facing durante i micro-step, e le policy dichiarative di facing. Lasciarlo `done` direbbe che la feature
      # e' completa rispetto a una spec che non e' piu' quella.
      runtime: partial
      log_debug: done
      automation: done
      scenario: done
      # La Wiki lo spiega e la figura in campo e' girata dal lato giusto, ma il gioco non MOSTRA l'arco:
      # niente indicatore del cono frontale in HUD, quindi «leggibile in gioco» non e' ancora vero.
      ui_wiki: partial
      packaged: todo
      # Era `na`, ed era sbagliato: il facing viaggia negli intent, quindi dovra' essere corretto in rete.
      # `partial` perche' il filtro per squadra esiste ed e' testato (`Facing.IntentIsTeamFiltered`), ma
      # nessuna verifica in rete e' possibile finche' la rete non c'e' (M10).
      network_privacy: partial
      replay_representable: done
    roadmap:
      epic: E16
      checkpoints: ["16.1", "16.2"]
    dependencies:
      - RT-FEAT-MAP-HEXGRAPH
      - RT-FEAT-MAP-COVER
    owner_specs:
      - docs/decisions/adr-0005-orientamento.md
      # ADR-0008 (2026-08-10) supera §1 e §3 di ADR-0005: budget di pivot per eroe, policy dichiarative di
      # facing, e facing nei micro-step = ultimo passo compiuto. Nessuno dei tre e' implementato.
