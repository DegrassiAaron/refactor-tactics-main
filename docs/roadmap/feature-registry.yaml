# RefactorTactics — Feature Registry canonico
#
# SORGENTE. Questo file si edita a mano; `feature-registry.json` è GENERATO da qui
# (`python scripts/feature_registry.py generate`) e non si edita mai.
#
# Regole, schema e significato dei gate: `feature-registry.md` (owner documentale).
# In sintesi:
#   - lo stato di una feature vive QUI e in nessun altro posto: roadmap, Wiki e workbook
#     referenziano il `feature_id` e leggono lo stato, non lo copiano;
#   - `status` è DERIVATO dai gate con una regola deterministica e il validator lo verifica:
#     se i gate non reggono lo stato dichiarato, `validate` fallisce;
#   - niente percentuali: il progresso è «N/M gate», che è verificabile.
#
# Valori ammessi
#   gates.*      : done | partial | todo | na
#   status       : IDEA | DESIGNED | SPECIFIED | IMPLEMENTING | TESTABLE | INTEGRATED
#                  | RELEASE_READY | DONE | DEFERRED | BLOCKED
#   release      : v0.1 | v0.2 | future
#   priority     : P0 | P1 | P2 | P3
#   kind         : gameplay | ui | tooling | data | infra | content
#   tests        : pattern di nome test, con `*` finale ammesso; devono matchare test reali
#   scenarios    : ScenarioId dichiarati nei file di `Scenarios/`; `planned:` per quelli non ancora in repo
#   wiki_refs    : `wiki:<PageName>` (pagina del clone, D-076) oppure `docs/characters/...md`
#   pie_refs     : le voci `PIE-*` di `docs/technical/test-manuali-pie.md` che dimostrano il gate
#                  `packaged`. È il legame che fino al 2026-08-10 **non era un dato**: viveva nel
#                  corpo delle issue GitHub («Verifica PIE `PIE-V01-HUD`»), fuori dal repository e
#                  fuori da ogni controllo — così il giorno in cui una voce diventa ✅ nessuno sa
#                  quali gate possono avanzare. I legami presenti sono stati estratti dalla
#                  sezione «Test / verifica» delle issue che ciascuna feature già dichiara in
#                  `issues:`, non assegnati a intuito. Il campo è **opzionale**: assente significa
#                  «non ancora mappato», non «nessuna verifica manuale».
#                  ⚠️ **L'estrazione dalle issue non basta da sola**, ed è costata tre legami falsi
#                  in code review: quando più feature dichiarano la STESSA issue, il metodo attacca
#                  la stessa voce a tutte, anche a quelle che non c'entrano. `PIE-V01-HUD` (issue
#                  #77) verifica barre, timer, slot e cooldown: dimostra `RT-FEAT-UI-PLANNING`, non
#                  la camera tattica né il playback della risoluzione. Un legame va tenuto solo se
#                  il **testo della voce** verifica quella feature — la citazione condivisa è
#                  l'indizio, non la prova.
#                  Il validator ne deriva due cose: `packaged: done` con una voce non ✅ è un
#                  **errore** (il gate afferma una verifica che il registro non conferma), e tutte
#                  le voci ✅ con il gate ancora `partial`/`todo` è un **avviso**: può avanzare.
#                  Una stessa voce può dimostrare più feature — `PIE-V01-HUD` ne serve quattro,
#                  perché quattro feature dichiarano la stessa issue #77.
#   roadmap      : `epic` + `checkpoints` per la vista di release (roadmap-v0.1.md);
#                  `milestone` per il lavoro che vive solo nella vista di esecuzione
#                  (roadmap-checkpoint.md). I due spazi di numerazione **collidono** — CP 10.1
#                  è «Activate e Interact» in E10 e «listen server» in M10 — quindi un
#                  checkpoint di milestone non si scrive mai in `checkpoints`.
#
# `last_verified` dice quando quella riga è stata confrontata col codice, e su quale commit.
# Una riga senza `last_verified` non può dichiarare stato >= TESTABLE (errore del validator).

meta:
  registry_version: 1
  schema_version: 1
  # Da qui si derivano TUTTI i link verso GitHub: issue, milestone, PR, file del repository.
  # Sta scritto una volta sola perche' un URL completo copiato in una vista e' la stessa bugia
  # con la data sbagliata di uno stato copiato. Il validator confronta questi valori col remote
  # `origin` quando c'e', e avvisa se divergono — su un fork e' un avviso, non un errore.
  project:
    github:
      owner: DegrassiAaron
      repository: refactor-tactics-main
      branch: main
  last_full_audit:
    date: 2026-08-08
    commit: 2094b86
    suite: 490 test unici in 69 file
  note: >
    Primo audit completo. La seed list dell'handoff del 2026-08-08 è stata confrontata voce per voce
    con Source/, Tests/, Scenarios/, docs/ e la Wiki: le voci che il repository non conferma sono
    marcate per quello che sono (SPECIFIED, DESIGNED, IDEA), non promosse a DONE.

