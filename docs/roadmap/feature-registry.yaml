      - RefactorTactics.Actions.OffensiveActionsMatchCatalog
    scenarios:
      - Combat.BasicAttack
      - Movement.Basic
    wiki_refs:
      - docs/wiki/game/azioni-e-movimento.md
    wiki_note: >-
      Quattro azioni generiche su sette sono complete: `Wait`, `Move`, `BasicAttack`, `Guard`.
      `Brace` funziona ma come reazione; `Interact` è a catalogo **senza effetto**; `Overwatch` non
      esiste ancora.
    last_verified:
      date: 2026-08-08
      commit: 2094b86
    notes: >
      Delle sette azioni generiche di D-025, **quattro sono complete e testate**
      (`Wait`, `Move`, `BasicAttack`, `Guard`). Le altre tre non sono nello stesso stato, e la
      revisione di granularità del 2026-08-08 ha corretto una nota che diceva «sei su sette
      esistono a catalogo e nel runtime» — vera per il catalogo, falsa per il runtime:

        · `Brace`   esiste, ma i suoi test vivono sotto `Reactions.Brace.*`: è a catalogo come
                    azione e si comporta come reazione. Ambiguità di modello, non di stato.
        · `Interact` è **a catalogo senza effetto dichiarato e senza un solo test**
                    (`RTCatalogLibrary.cpp:281`: «nessun effetto dichiarato»). È un dato che
                    nessuno consuma — il difetto che questo progetto ha già pagato quattro volte.
                    Lo porta E10.1 insieme ad `Activate`; aperta la issue `#273` perche'
                    la scelta (togliere dal catalogo, fissare l'inerzia con un test, o
                    attendere E10.1) e' di design, non una correzione di iniziativa.
        · `Overwatch` **non esiste**: `grep -rn "Overwatch" Source/` fuori dai test non
                    restituisce nulla. Lo porta E14.4.

      I gate restano `partial` perché la feature davvero non è completa; `completed_by` dice
      **chi** la completa, così la stessa mancanza non viene contata due volte.

