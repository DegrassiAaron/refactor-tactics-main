    issues: [559, 560, 561, 563]
    tests: []
    scenarios: []
    wiki_refs: []
    notes: >
      `spec: done` dal 2026-08-12: D-108 chiude le due incognite che tenevano la spec `partial` —
      il generatore e' **Node/TypeScript** (contro la raccomandazione registrata nel consolidamento,
      Python accanto a `scripts/`) e gli SVG si **committano** con un `--check` che li verifica,
      dentro l'MVP e non nel lavoro futuro. ⚠️ Il determinismo di *questo* generatore ha un'insidia
      propria oltre alle solite (timestamp, UUID, ordine non stabile): le coordinate dei vertici
      vengono da `sin`/`cos`, quindi da float, la cui resa decimale cambia con piattaforma, libreria
      matematica e locale — vanno **arrotondate esplicitamente** prima di serializzare. Un test che
      genera due volte nello stesso processo **non dimostra** la proprieta', e il golden test va
      ancorato a un hash committato. ⚠️ Il determinismo viene **prima** del gate: senza
      arrotondamento il `--check` e' rosso su una macchina e verde su un'altra. ⚠️ Combinato con
      D-106 il gate diventa un **test di regressione sui dati competitivi**: cambiare `Salute` in un
      catalogo lo fa diventare rosso finche' gli SVG non sono rigenerati nello stesso commit — un
      rebalance porta con se' i suoi grafici. Il prezzo e' che chi tocca un catalogo deve poter
      eseguire il generatore, quindi Node diventa un prerequisito del **bilanciamento**.
      `scenario`/`packaged`/`network_privacy` sono `na` come per gli altri strumenti.
