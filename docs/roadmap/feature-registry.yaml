      contributo e' costante. Nemmeno la soglia d'udito lo arricchisce, benche' sia una seconda statistica
      per eroe: **Phase e Riktor condividono `Vista 5` e `Udito 3`**, quindi nessuna funzione dei due li
      separa, e D-041 progetta l'udito come **compensazione** della vista — ogni aggregazione comprime, e
      con la media l'asse esce costante, cosa che `profile.test.ts` vieta. Resta il **nascondersi**
      ([#690](https://github.com/DegrassiAaron/refactor-tactics-main/issues/690)), che oggi non ha input
      discriminanti: `Stealth` e' `2` su tutto il roster per dichiarazione del catalogo. I tre valori su
      quattro eroi sono **previsti e documentati** in `#558`, non un difetto della rubrica.

