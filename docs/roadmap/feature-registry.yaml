      code review l'ha rifiutato: i 10 danni di `OnEnterEffects` passavano ancora solo da `AddLogEvent`,
      e chi entrava nel fuoco con pochi HP **moriva senza lasciare niente**. Misurabile sul test di
      `#625` stesso: il bersaglio scendeva 90 → 80 → 72 — diciotto danni, otto tracciati. Il gate e'
      tornato `partial` per un giro, ed e' l'unico caso in cui questo registro e' andato all'indietro.
      💡 La lezione, che vale oltre il fuoco: un gate si chiude sul **soggetto intero**, e «il danno da
      fuoco» erano due siti con due numeri diversi. La prima misura ne aveva visto uno.

