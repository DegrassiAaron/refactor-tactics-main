      Cio' che manca e' l'IDENTITA': `DoorId` e' un `int32` locale all'asset, quindi non sopravvive al cook e
      nessuno scenario puo' citarlo per nome. Il codice lo dichiara gia' in `RTPointerInteraction.h` —
      «`DoorId` e arco esistono gia' e bastano. L'identita' stabile e' E23 (#324)». E' il **prerequisito** di
      `RT-FEAT-MAP-INTERACTION-GRAPH`: senza un nome, un binding non ha come citare il proprio bersaglio.
      `scenario: na` e' deliberato — nessuna delle otto `ERTAssertionKind` legge l'identita' di una struttura,
      e uno scenario la verificherebbe solo di rimbalzo. Si verifica in automation.

