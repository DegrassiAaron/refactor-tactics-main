      `FRTHexCover` e `bBlocksMovement` tornano a produttore condiviso col pennello.


      **`#619` e' chiusa (2026-08-12), ed e' la prima delle tre a esserlo.** Quel che era `tests: []`
      e `scenarios: []` non lo e' piu': `Source/RefactorTactics/Map/RTHexOccupancyLibrary.{h,cpp}`
      esiste nel modulo **runtime** (com'era il vincolo di collocazione, non una preferenza), i
      **19** test `RefactorTactics.HexOccupancy.*` girano — questa riga diceva «sedici», ed era vera
      quando fu scritta: rimisurata il 2026-08-13 contando le macro nel file, non incrementata a mano.
      La crescita e' verificabile commit per commit: `b0c94a62` 16 -> `1c4422f7` 17 (il fix sul
      sovrapprezzo negativo) -> `964deb70` 19 (il caso collineare che le prime quattro fixture
      evitavano di proposito)
      — fra loro `GoldenExampleFromTheSource`,
      che pinna l'esempio di §14 del sorgente, `ThresholdBoundaries`, `SurchargeEntersTheMatchStateHash`
      e `SurchargeSurvivesADynamicSurfaceCycle`, cioe' esattamente le tre voci di DoD che `D2` aveva
      aggiunto — e `Scenarios/Spec/Map/ConstrainedCellCostsMore.json` non e' piu' `planned`: e' il
      file che mostra `Constrained` cambiare un risultato osservabile. Il campo con un consumatore era
      la condizione perche' `P1` non producesse un dato morto, ed e' soddisfatta.


      `runtime: partial` e non `done` **per i due anelli che restano**, non per incompletezza di
      `#619`: `#620` (la grammatica delle direttrici e il validator che la rende una regola invece che
      una convenzione) e `#621` (la cottura verso i bordi) sono aperte. Finche' `#620` non chiude, un
      segmento fuori grammatica e' rifiutato da una convenzione, non da un test.


      Revisione spec panel del 2026-08-12 su #619, due decisioni dell'autore che vincolano il
      modello. **D1**: il confine #619/#621 e' **per campo** — il costo e' di #619, i bordi
      (`FRTHexCover`, `bBlocksMovement`) sono di #621. Serviva perche' `ReachableCells` e `FindPath`
      leggono solo `FRTHexCellData`, quindi `Constrained` non era osservabile senza che qualcuno
      scrivesse un campo. **D2**: il sovrapprezzo di `Constrained` **non** vive in `MoveCost`, che ha
      gia' un produttore che lo ricalcola dalla sola `Surface` ogni turno
      (`ARTTurnManager::ApplyDynamicSurface` e `TickDynamicSurfaces`); e' un intero suo, sommato dai
      lettori del costo. Ne segue che `FormatVersion` sale da 6 a 7 e il campo entra in
      `RTMatchStateHash`. La `D-0xx` la prende la PR che implementa.


      ⚠️ Le quattro fixture di geometria **non** vanno in `Scenarios/`: `FRTScenarioCell` porta
      `Cell`, `bBlocksMovement`, `bBlocksLineOfSight`, `MoveCost` e nessun campo per segmenti o
      footprint. Sono dati di test del modulo runtime; in `Scenarios/Spec/Map/` — che contiene oggi
