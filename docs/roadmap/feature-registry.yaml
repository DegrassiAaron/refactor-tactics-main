      - RT-FEAT-ACTION-PLAN-VALIDATION
      - RT-FEAT-ACTION-ENGINE
    owner_specs:
      - docs/gameplay/spec-tassonomia-movimento.md
    issues: [704, 700, 701, 702, 703, 645]
    tests: []
    scenarios:
      # SPECIFICA ESEGUIBILE scritta prima dell'implementazione (2026-08-10, PR #306): due celle Fire
      # fra origine e destinazione, Gadget a 90 HP, e l'assertion che dopo il trasferimento sia ANCORA 90.
      # Resta `BLOCKED` di proposito — `requires: ["Teleport"]`, capability che l'harness non dichiara —
      # quindi oggi NON PROVA NULLA: i 90 HP passano perche' Gadget non si muove mai, e il file lo scrive
      # da se'. Si accende in CP 39.12 (#703), non prima: l'harness non deve diventare il primo
      # produttore di una feature che il gioco non sa ancora fare.
      - Spec.Movement.TeleportSkipsIntermediateCells
    last_verified:
      date: 2026-08-12
      commit: dda87f1
    notes: >
      🔴 **Nasce il 2026-08-12 da D-118**, che chiude `MOV-1`: il trasferimento e' una **famiglia
      semantica propria** e non un'eccezione del Dash. La partizione e' `Traversal` (Move, Dash, Forced
      — percorre lo spazio, e ogni cella percorsa e' un fatto) contro `Transfer` (Leap, Blink, Swap,
      Recall — esistono un'origine e una destinazione, e nient'altro).
      ⚠️ **`spec: done` e tutto il resto `todo` non e' una svista**: e' esattamente lo stato. La regola
      e' scritta e decisa, e **nessuna riga di runtime e' stata aggiunta** — che era il DoD di CP 39.1.
      ⚠️ **`runtime: todo` e non `partial`, e la code review ha chiesto perche'** (2026-08-12). La regola 2
      di `feature-registry.md` — *«un dato senza consumatore e' `partial`»* — e' un **tetto su `done`**, non
      un pavimento su `todo`: dice che un dato senza consumatore non puo' dichiararsi completo, non che
      qualunque codice esistente obblighi a `partial`. E qui il runtime di QUESTA feature e' zero: non
      esiste un resolver puro del trasferimento, non esiste un Blink pianificabile, e `ARTTurnManager`
      riscrive ancora il risultato come un path a due nodi. `LinearLeap` non e' il runtime di questa
      feature: e' un valore di `ERTMovementStyle`, che appartiene a `RT-FEAT-ACTION-MOVE-PROFILES` insieme
      al test che lo prova. 🔴 La conseguenza meccanica non e' cosmetica: `derive_status()` controlla
      `runtime in (done, partial)` **prima** di `spec: done`, quindi un `partial` qui porterebbe lo stato
      da `SPECIFIED` a `IMPLEMENTING` — cioe' direbbe alle shortlist e alla Wiki che il trasferimento e' in
      lavorazione quando non lo e'.
      🔴 **La semantica pero' ESISTE GIA', e questo e' il punto che rende l'epic non vuota**:
      `ERTMovementStyle::LinearLeap` produce `Result.Entered = { destinazione }`, e il test
      `RefactorTactics.Actions.Leap.IgnoresIntermediateCells` e' verde. Quel test **non e' dichiarato
      qui** ed e' deliberato: appartiene a `RT-FEAT-ACTION-MOVE-PROFILES`, che possiede
      `ERTMovementStyle` come dato. Dichiararlo in due posti darebbe due risposte alla domanda «chi lo
      dimostra». `tests: []` finche' CP 39.2 (#700) non ne scrive di propri — e non si riempie con i
      nomi che l'handoff proponeva, perche' il validator verifica che ogni pattern matchi un test reale.
      ⚠️ **Il difetto architetturale da correggere, misurato**: `ARTTurnManager` prende il risultato di
      `LinearLeap` — gia' `Origin → Destination` — e lo riscrive come `Path = [Origin, Destination]` per
      `ResolveHexPaths`, che e' un resolver a micro-step (destinazione contesa, priorita', collisione
      frontale, occupazione cella per cella, `Prog`, `MicroStepIndex`). Con due nodi il micro-step
      degenera e il risultato non e' sbagliato **oggi**: diventa un errore appena esistono due
      trasferimenti nello stesso turno, o un trigger che guarda i bordi attraversati.
      ⚠️ **Il rischio dell'epic e' costruire un secondo motore**, e D-118 lo scrive come divieto: nessun
      subsystem di trasferimento, nessun `ValidateTeleportPlan` (l'autorita' e' #605), nessuna seconda
      macchina di reazione (#165), nessun secondo sistema di percezione (#159) o di facing (ADR-0005).
      ⚠️ **`Portal` non e' di questa feature**: e' topologia del grafo — `URTHexMapAsset::Transitions`,
      `ERTHexArcState`, `GraphNeighbors()` — e ricade su `RT-FEAT-MAP-*`. CP 39.10 lo tratta come un
      valore in coda a `ERTHexTransitionKind`, dopo un audit della serializzazione.
      ⚠️ **Nove scenari del corpus finale NON sono dichiarati `planned` qui**, e non per dimenticanza:
      si dichiarano quando il loro checkpoint si apre. Un corpus dichiarato in anticipo gonfia il
      conteggio di `scenariomap.shortlist.md` senza che nulla lo verifichi — lo stesso difetto che il
      documento della scenario map ha gia' pagato tre volte in un giorno rimisurando i `planned`.
      Il campo `out_of_release_scope` che portava questa motivazione e' stato rimosso il 2026-08-13:
      diceva che `roadmap.epic` doveva restare `null` perche' il validator non conosceva le epic
      post-v0.1 e la tabella §2.2 avrebbe mostrato la feature fra quelle della v0.1. Entrambi i
      vincoli sono caduti — `known_roadmap_refs()` legge l'altro owner e la tabella filtra per release
      — quindi l'epic e' scritta nel campo che le compete. Nessun gate della v0.1 dipende da questa
      epic — D-119 lo decide esplicitamente.

