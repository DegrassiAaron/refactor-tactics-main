      ⚠️ **Cosa NON cambia**: `ERTMovementStyle::LinearLeap` resta un valore di questo enum e un test di
      questa feature (`RefactorTactics.Actions.Leap`). La famiglia e' semantica; la separazione nel dato e'
      una migrazione di formato serializzato, ed e' un checkpoint di E39 (#701). E **#645 resta valida in
      entrambi i casi**: il salto e' irraggiungibile dal roster qualunque famiglia lo ospiti.
      🔴 **2026-08-12, D-117**: il movimento si misura con **due** budget, non uno. I **passi** dicono quanto
      lontano si arriva (`StepBudget`, dichiarato dal profilo), i **punti movimento** quanta asperita' si
      assorbe — costo di una cella `max(0, MoveCost - 1 + MoveCostModifier)`, terreno normale a **0**. Nessun
      dato di mappa cambia: la linea di base si sottrae nella funzione, come
      `URTHexLibrary::ReliefHeightForCost` fa gia' per il rilievo. Il modificatore diventa **firmato**: un
      negativo significa «il terreno rotto non mi rallenta», e oggi non e' esprimibile perche' cinque punti lo
      clampano a zero. Prerequisito **#653** (il profilo come entita'), modello **#666**.
