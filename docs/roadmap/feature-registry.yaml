      copertura) e `Section` (termine Unreal per le sezioni di mesh). La collisione col
      `Gadget.BreachCharge` di E7 — 35 danni a struttura, l'oggetto che lo APRE — e' risolta: il verbo
      breach resta libero come azione. Resta da specificare il MODELLO: slot strutturali con integrita' e
      stati, dipendenze fra strutture, crolli immediati e telegrafati, macerie come nuovo terreno, e il
      vincolo di connettivita' della mappa (niente soft-lock involontari). E' il blocco piu' autonomo dei
      tre: non dipende da acqua ne' da verticalita'. Nessuna domanda aperta.

