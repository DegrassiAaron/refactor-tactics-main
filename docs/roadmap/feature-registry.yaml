    notes: >
      `URTMatchFormatData` **esiste già** con validator e fallback osservabile: E19 non lo
      costruisce, chiude due buchi misurati — `MapClass` sul dato mappa e `UnitsPerTeam` nel
      formato (D-030). Entrambi chiusi il 2026-08-09 (#215, #216): la mappa dichiara la propria
      classe, il formato dichiara la composizione, e il `GameMode` li onora invece di assumerli.
      `URTHexMapAsset::CurrentFormatVersion` passa a 6; la simulazione **non** ramifica sulla
      classe, e un test lo misura confrontando l'hash di due partite identiche. I timer restano
      fuori dal formato per decisione (ADR-0005 §4c).
      **2026-08-10 (#375)**: `Format.Skirmish2v2` è **spedito da C++**
      (`URTMatchFormatLibrary::FindShippedFormat`), come le istanze di `URTActionData` e
      `URTHeroData` — la CLASSE resta un data asset, e un asset assegnato al `GameMode` vince.
      L'ordine è: asset ⇒ formato spedito ⇒ ripiego. `RoundLimit` **5** (deciso con l'utente);
      `ScoreToWin` **0** perché **nessuno assegna punti** — `AddTeamScore` non ha chiamanti
      runtime, e una soglia > 0 dichiarerebbe una vittoria irraggiungibile. Diventa un numero il
      giorno in cui un obiettivo la alimenta.

