      - RefactorTactics.Reactions.DeclaredConditionCollapsesToImmediateCommit
      - RefactorTactics.Reactions.DeclaredConditionEntersThePlanOnlyIfValid
    scenarios: []
    wiki_refs:
      - wiki:reazioni-overwatch-e-previsioni
    last_verified:
      date: 2026-08-15
      commit: 53ec531f
    notes: >
      ADR-0004 accettato; il modello unificato contiene E5 come caso `AllowedResponses ≤ 1`.
      CP 14.3 ha consegnato chiave, derivazione dell'id, soglia del boundary e privacy del DTO.
      ⚠️ I sette test vanno elencati QUI e non lasciati al prefisso `Reactions.*`: quel prefisso
      appartiene a RT-FEAT-REACTION-PREPARED, e `feature_registry.py` fa prefix matching — senza
      questo elenco la suite E5 passerebbe da 27 a 34 e nessuno saprebbe piu' dire se e' regredita
      o se e' semplicemente atterrato CP 14.3. E' la voce di DoD «suite E5 invariata» che perde il
      proprio strumento di misura, e il conteggio da solo non basta: il pattern `Reactions.*` cattura
      anche i test che questi checkpoint AGGIUNGONO, quindi si confronta l'ELENCO con la baseline.
      **2026-08-12 ([D-109], PR #639)**: e' atterrata la CONDIZIONE DICHIARATA, la voce di DoD di
      CP 14.3 rimasta indietro quando il checkpoint fu chiuso. `FRTDeclaredCondition` piu' validator a
      elenco chiuso — una voce, `TargetHealthAtOrBelowPercent`, soglia intera — e la valutazione al
      trigger che **riduce** `AllowedResponses` dentro `BuildOverwatchTriggers`: se resta il solo
      `HOLD` il commit e' immediato, ed e' cosi' che il regime *Conditional* emerge dai dati. Il
      produttore non e' l'harness: `rt.Reaction.Condition [N]` scrive il piano passando dalla stessa
      validazione che usera' l'interfaccia di E11.
      `runtime: partial` e non `done`: la regola esiste ed e' pura, ma NESSUN chiamante di
      produzione la invoca. ⚠️ **Gli anelli mancanti sono DUE, e il primo commento su #583 ne nominava
      uno solo** (misurato il 2026-08-12): *(1)* CP 14.5 cabla la finestra nel resolver — CP 14.4 e'
      chiusa e `BuildOverwatchTriggers` esiste, ma i suoi soli chiamanti restano harness e test; *(2)*
      **`Action.Overwatch` non esiste nel catalogo core** e nessun eroe lo ha nel kit — le reazioni del
      roster sono `Counter`, `Intercept` e `Deflect`, tutte automatiche. Il catalogo lo dichiara
      esplicitamente (`RTCatalogLibrary.h`: «`Overwatch` non esiste nemmeno nel catalogo core: e' E14,
      e arrivera' con la sua infrastruttura»), e chi lo possiedera' e' la decisione `BAS-2` in
      `OPEN_DECISIONS.md`. Finche' entrambi mancano, la condizione dichiarata e' corretta e **inerte**:
      nessuna opportunity a due risposte nasce in partita, quindi non c'e' niente su cui possa mordere.
      Per la stessa ragione il TurnLog non registra ancora la condizione: non c'e' un'opportunity di
      partita in cui registrarla, ed e' la voce che tiene aperta la issue #583. `log_debug: todo` per la stessa ragione: niente
      serializza ancora l'id, quindi «serializzazione stabile dentro l'hash del replay» e'
      consegnata nella forma e non ancora nei fatti.
      Non parte prima di E13: il trigger richiede livello «Rilevato», non solo LOS.
      ✅ **2026-08-14/15 — CP 14.5 (`#165`, PR #878) ha chiuso i due anelli mancanti**, e il paragrafo
      qui sopra va letto come storia: *(1)* `ARTTurnManager::ResolveReactionBoundary` chiama
      `BuildOverwatchTriggers` fra un micro-step e il successivo, quindi le opportunity nascono **in
      partita** e non piu' solo nell'harness; *(2)* `Action.Overwatch` e' entrata nel catalogo core come
      quarta generica, **in coda** perche' le generiche sono accodate al kit e la posizione e' un indice
      stabile. `OpportunityId` ora **si serializza** (TurnLog v8) ed entra nell'hash, quindi
      «serializzazione stabile dentro l'hash del replay» e' consegnata **anche nei fatti**.
      ⚠️ Cio' che NON e' cambiato, e che il gate `log_debug: partial` registra: la **condizione
      dichiarata** resta inerte nel caso tipico. Non per i due anelli di prima, ma per un terzo che
      nessuno aveva previsto — il suo unico produttore passa da `SetPlannedReactionCondition`, che
      pretende uno slot **reazione** armato, mentre l'Overwatch costa l'azione **principale**. Il campo
      si legge e `BuildOverwatchTriggers` lo consuma; semplicemente, oggi un piano di solo-Overwatch non
      riesce a dichiararne una. **#583** resta aperta su questo, e non piu' sui chiamanti.

