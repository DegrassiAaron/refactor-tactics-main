      appoggiarsi: o diventa una copertura che non copre, o `bBlocksMovement` su una cella calpestabile.
      Include la *swept clearance* — la transizione verifica il corridoio attraversato, non i soli estremi —
      che per `D-071` usa **lo stesso raggio** del footprint. Costo dichiarato: il varco «ci passo ma non ci
      sto» non e' modellabile, perche' calpestabile e attraversabile condividono la soglia.

