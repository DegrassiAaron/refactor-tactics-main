      Il sorgente la dava come asse ortogonale, e la premessa di quella lettura era falsa: `ShallowWater`
      CAMBIA — `Action.CreateWater` la crea a runtime da CP 8.4 tramite `ApplyDynamicSurface`, che ricorda
      la superficie originale e conta i turni. Il flooding esiste gia' come cambio di superficie. Restano
      da specificare: corrente (`WaterFlowDirection`/`Strength`) che produce ForcedMovement, e i profili
      Swim/Amphibious/Hover, che non esistono. Tocca il resolver e non solo la mappa: una corrente che
      sposta e' displacement, con catene e collisioni. La propagazione elettrica su rete d'acqua che il
      sorgente chiede ESISTE GIA' (CP 8.3, BFS, `StopsAtNonConductive`). Nessuna domanda aperta.

