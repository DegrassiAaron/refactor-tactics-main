    notes: >
      Il C++ (spawn con fallback, facing di presentazione, anello di team) è in `main`, il lavoro
      in editor no. Fino al 2026-08-08 era la milestone **M8** senza epic corrispondente nella vista
      di release: **E21** chiude quel buco, e dal 2026-08-09 e' tracciata su GitHub (#286 + #287/#288/#289) —
      era l'unica epic della v0.1 senza issue. Il gate `packaged` resta `todo` perché la build packaged
      mostra ancora i cilindri. **D-037** (2026-08-08) toglie l'ultimo ostacolo di decisione: ogni
      eroe ha uno slot asset Paragon dichiarato — Gadget `Gadget`, Phase `Phase`, Riktor `Riktor`,
      Wraith `Wraith` — quindi assegnare mesh e animazioni non richiede più una scelta. Nessun gate
      si muove: la decisione è documentale, in editor non e' stato assegnato niente.

      ✅ **#593 (2026-08-16): il root di `ARTUnit` è neutro.** Il cilindro segnaposto era il root con
      scala `(1.2, 1.2, 1.8)`, quindi ogni mesh aggiunta in Blueprint veniva stirata di `1.5x`. Con
      `SceneRoot` neutro l'ingrandimento del 15% alla selezione smette anche lui di raggiungere i figli,
      **senza che la riga che lo produce cambi**: era la gerarchia, non il codice della selezione.

      🔴 **Ma NON raddrizza i quattro `BP_Unit_*` esistenti**, e la prima stesura di questa nota diceva
      il contrario. I loro nodi SCS dichiarano il genitore **per nome**
      (`ParentComponentOrVariableName` + `bIsParentComponentNative`, presenti nella name table di tutti
      e quattro): finché un componente nativo chiamato `Mesh` esiste — e esiste — la skeletal resta
      figlia di lui, che porta ancora `BaseMeshScale`. Riparentarla è un'apertura di editor, seduta
      **U7**, con Binary Asset Lease. Il C++ toglie la causa per ciò che nasce d'ora in poi.

      🔴 **E il «workaround World/Absolute Scale» che questa nota dava per applicato NON è negli asset.**
      Misurato sui quattro `.uasset`, cercando ogni stringa in ASCII **e** UTF-16LE:
      `bAbsoluteScale` **assente in tutti e quattro** · `RelativeScale3D` **presente in tutti e quattro**
      · `ParentComponentOrVariableName` e `bIsParentComponentNative` **presenti in tutti e quattro**.
      Quindi l'icona *World/Absolute* non è mai stata commutata, e la compensazione — se c'è — è una
      **`RelativeScale3D` tarata a mano**. Che non è ridondante: toglierla senza riparentare **deforma**
      i personaggi invece di raddrizzarli.
      ⚠️ È evidenza, non prova: `RelativeScale3D` è un nome di proprietà comune e la sua presenza nella
      name table non dice su quale componente sia scritto né con che valore. Lo dice solo l'editor, ed è
      la prima cosa da guardare in **U7**. Trovato in code review della PR #977.

      ⚠️ **Nessun gate si muove, ed è dichiarato invece che sottinteso.** `runtime` resta `partial`
      perché il lavoro che manca è **in editor** (mesh, animazioni, materiali assegnati), e questo
      commit non ne assegna nessuno: toglie un ostacolo, non consegna la presentazione. `automation`
      resta `partial` per la stessa ragione — i due test nuovi coprono la causa strutturale, non
      l'aspetto, che nessun test headless può giudicare. `packaged` resta `todo`: la build mostra
      ancora i cilindri.

      ⏳ **Lavoro di U7, in questo ordine**: (1) aprire i quattro `BP_Unit_*` e **misurare** com'è
      compensata oggi la deformazione — la risposta decide il resto; (2) riparentare la skeletal sotto
      `SceneRoot`; (3) solo allora togliere l'eventuale compensazione, che a quel punto è davvero
      ridondante. ⛔ Non fare (3) prima di (1): se la compensazione è una `RelativeScale3D` tarata a
      mano, toglierla senza riparentare deforma i personaggi invece di raddrizzarli.

      ⚠️ **Gli owner_spec di questa feature descrivono ancora la gerarchia vecchia** —
      `spec-team-identity.md` (`Mesh` come root, `SetupAttachment(Mesh)`, la formula con
      `BaseMeshScale.Z`) e la ricetta della seduta U7 in `editor-sessions.yaml`. Aggiornati con #593;
      erano rimasti indietro nella prima stesura, e un owner_spec che descrive codice che non esiste più
      fa reimplementare la compensazione appena tolta.

