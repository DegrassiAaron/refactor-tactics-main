      il validator rifiuta una variante che non paghi in danno, portata o ricarica. Verifica di mutazione
      eseguita: azzerando i delta cadono esattamente i tre test che ne dipendono.
      Due limiti **dichiarati** invece che nascosti. `Weapon.Split` compra un bersaglio in più che il
      motore non sa esprimere (nessuna cardinalità dei bersagli in `FRTActionDef`), quindi in partita è
      solo il suo svantaggio: `Equipment.SplitHasNoConsumerYet` lo pinna e diventerà rosso il giorno in
      cui qualcuno la cabla. `Weapon.Environmental` dichiara il vantaggio in prosa perché nessun campo del
