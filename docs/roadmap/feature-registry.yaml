      # La Wiki lo spiega e la figura in campo e' girata dal lato giusto, ma il gioco non MOSTRA l'arco:
      # niente indicatore del cono frontale in HUD, quindi «leggibile in gioco» non e' ancora vero.
      ui_wiki: partial
