      # protegge. L'unico momento di D-020 senza codice e' `FacingUsedByOverwatch`, che appartiene a E14.
      #
      # `done` -> `partial` il 2026-08-10: non e' il runtime a essere regredito, e' la SPEC ad essere cresciuta.
      # ADR-0008 aggiunge tre requisiti che nessuna riga di codice soddisfa: il budget di pivot per eroe
      # (`MoveEndPivotMaxSteps`/`DashEndPivotMaxSteps` — `LegalFacings` oggi legge lo stile, non l'eroe), il
      # facing durante i micro-step, e le policy dichiarative di facing. Lasciarlo `done` direbbe che la feature
      # e' completa rispetto a una spec che non e' piu' quella.
      runtime: partial
