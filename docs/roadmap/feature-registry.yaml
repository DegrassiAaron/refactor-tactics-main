                    giorno, ed è caduto: la nota che lo citava sarebbe rimasta vera in forma e falsa
                    in sostanza. L'anello che mancava era **solo la dichiarazione** — effetto,
                    trasporto e raccolta esistevano già (`RTHexDoorLibrary::SetDoorState`,
                    `RTTurnManager` → `bChangesDoor`, `RTHexCombatLibrary` su `FirstDoorEdge`).
