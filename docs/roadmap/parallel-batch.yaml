      ➕ **`docs/technical/test-manuali-pie.md` esce da `integration_only` ed entra qui**, per
      questo giro. Era là per una contesa che in questo batch **non esiste**, misurata sui write-set
      dei branch vivi (`git diff --name-only origin/main...<branch>`): `feat/165` 0 file, `feat/78`
      il solo `parallel-batch.yaml`, `wt-cap` / `#767` 7 file, `feat/641` 4, `feat/cp75` 3, i tre
      `docs/lane*` 18 in totale, `wip/icon-visual-language` 342 — e **nessuno di essi lo tocca**.
      Senza quel file una track ACTIVE non avrebbe dove scrivere il proprio prodotto, che è il
      verdetto: `produces` di U1 è un asset *e* sette esiti, e l'asset è già committato.
    writable:
      - docs/technical/test-manuali-pie.md
    # Catena già misurata da questo file (vedi `generated_only`): la sorgente delle voci alimenta
    # due viste, e possederla obbliga a rigenerarle. `project-graph.json` ha altre nove sorgenti —
    # `spatial` ne possiede una — quindi qui vale la regola dell'albero unito: ciascun ramo
    # rigenera per tenere verde il proprio `--check`, nessuna delle due copie è autoritativa.
    derives_from:
      - source: docs/technical/test-manuali-pie.md
        regenerates:
          - docs/roadmap/editormap.shortlist.md
          - docs/roadmap/project-graph.json
    binary_leases: []
    # ⚠️ Perché `#623` / U21 **non** è il candidato, benché sia `READY` nella coda generata: la sua
    # lease su `Content/RT/Maps/Dev/L_DevSandbox/` — due package qui, uno solo in `L_Prototype`,
    # misurati e non dedotti — è emettibile, ma U21 non blocca la v0.1 (`critical: false`, `P3`)
    # e U1 sì. E `#712` / U22 attende U21. Resta vero, e va riletto prima di attivare U8:
    # `Content/RT/Characters/Gadget/Animation/` è **tuttora untracked** nella working directory
    # principale — finché non è committata o scartata, la destinazione non è prenotabile e una
    # lease `create` starebbe su una base che in git non esiste.

