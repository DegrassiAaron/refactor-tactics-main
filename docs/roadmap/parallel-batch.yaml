      **esecutore è uno solo**: le verifiche PIE le fa una persona, in sedute, davanti all'editor.
      ∴ non è il caso di `test-automatico-unreal.md`, che è conteso fra *lettori* e infatti sta fra i
      riconciliati (vedi `integration_only`): qui il contendere non c'è, perché chi scrive è sempre lo
      stesso. Un registro con un compilatore unico e trentacinque domini è **posseduto**, non riconciliato.
      📊 **Il backlog di questa track è dell'ordine del centinaio di voci aperte**, ed è questo l'unico
      dato che regge nel tempo: il numero esatto si misura, non si cita.

          grep -c "^| \*\*PIE-" docs/technical/test-manuali-pie.md              # totali
          grep "^| \*\*PIE-" docs/technical/test-manuali-pie.md | grep -c "⏳"  # aperte

      ⚠️ **Questa riga ha portato un numero puntuale ed è stata riscritta quattro volte in un giorno**:
      `145`/`101`, poi `146`/`102` quando lo stesso commit ha aggiunto `PIE-HEX-MODE-P`, poi `146`/`99`
      con le tre voci `F`/`G`/`H` della seduta U1, poi `149`/`98` con le voci di `#921`/`#931`/`#911` e
      quattro voci camera consuntivate da un'altra sessione. Nessuna delle quattro era distrazione: è la
      proprietà di un contatore su un file che più sessioni fanno avanzare. ∴ il numero esatto è uscito
      da qui — resta il comando, che non invecchia.
      ⚠️ **Le altre track producono, questa giudica.** Chi finisce una feature che ha una voce `PIE-*`
      non scrive il proprio esito qui: lo **propone** in handoff. Vale già per `content_editor`, che
      tiene `#451` a 2 voci su 7 e proporrà le cinque residue.
      ⛔ **Non è `verification`**, che possiede gli undici file di test C++: quella misura ciò che una
      macchina può decidere, questa ciò che nessuna macchina decide. Non si sovrappongono, e i due
      `writable` sono disgiunti per costruzione.
      ⚠️ **Nessun `worktree` dichiarato**, e non è una dimenticanza: la track è `IDLE` e il worktree
      di una seduta PIE ha un requisito che gli altri non hanno — l'editor **buildato**, non solo il
      sorgente. Va scelto quando la track parte, fra quelli che hanno `Binaries/` e `Intermediate/`
      già costruiti, perché aprirne uno nuovo costa una compilazione intera.
      ➕ **Attivata il 2026-08-16 su `#923`, e la prenotazione diventa un vincolo.** Gli undici file erano
      già elencati qui; adesso c'è una sessione che ci scrive.
      🔴 **`docs/roadmap/v0.1-definition-of-done.md` entra nel `writable`, e non è un allargamento di comodo:
