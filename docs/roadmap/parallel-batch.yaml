# --- Aggiornati una volta in integrazione ------------------------------------------------------
#
# ⚠️ Un modulo e il suo test si modificano nello stesso commit: se il modulo è qui, il test
# **deve** esserlo. Vale per `feature_registry.py` / `test_feature_registry_releases.py`.

integration_only:
  # ➕ **Entra il 2026-08-16, da `content_editor`.** Ogni track che versiona un asset deve aggiungere la
  # propria riga di allowlist qui dentro — `Content/**/*.uasset` è escluso e i singoli file si riammettono
  # con un `!` per riga. Tenerlo in un `writable` significa che tutte le altre track devono chiedere il
  # permesso per una riga, e il primo caso reale è arrivato subito: CP 46.2 doveva riammettere tre
  # `WBP_RT_*` e la scrittura sarebbe stata uno **stop**.
  # ⚠️ La regola dell'allowlist resta quella che `#449` ha pagato: **la riga va aggiunta PRIMA che l'asset
  # esista**, altrimenti `git add` non fa nulla e non lo dice. L'oracolo è `git check-ignore -q <file>`
  # → exit **1** significa versionabile; con `-v` esce 0 in entrambi i casi e non distingue.
  - .gitignore
  - AGENTS.md
  - CLAUDE.md
  - docs/decisions/RT_PDR_00_Decision_Log.md
  # ➕ **Entrano il 2026-08-16, e la ragione e' un difetto trovato dalla code review su una PR d'integrazione
  # che li aveva gia' scritti**: i due ADR e il referto qui sotto non erano in **nessun** insieme — ne'
  # `writable`, ne' `integration_only`, ne' `generated_only` — cioe' erano nella condizione che `D-139` chiama
  # STOP. Un giro d'integrazione non e' un'esenzione: la regola dice che un path non assegnato non si tocca,
  # punto. Entrano qui perche' e' la categoria giusta — sono documenti che piu' branch possono voler
  # emendare, come il Decision Log sopra — e perche' lasciarli fuori significa che il prossimo che li tocca
