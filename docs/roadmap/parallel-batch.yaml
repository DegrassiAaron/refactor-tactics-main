# Parallel batch — chi può scrivere cosa, in questo giro
#
# Owner della sola cosa che il repository non aveva: **il write-set di un lotto di sessioni
# parallele**. `D-135` dice che una sessione esecutiva = un worktree + un branch, e si ferma lì;
# due worktree possono ancora editare lo stesso file, e finora l'unica difesa era che se ne
# accorgesse il merge. Decisione: `D-139`.
#
# Questo file descrive il **batch**, non le feature. Vive quanto il batch e viene riscritto al
# successivo: non è un registro storico, e non si accumula.
#
# ## Cosa NON va scritto qui
#
#   lo stato di una feature / di un task     vive nel Feature Registry e su GitHub. Un write-set
#                                            non è un avanzamento: niente `done`, `progress`,
#                                            conteggi di test, esito dei gate.
#   il titolo di una issue                   vive su GitHub e cambia senza avvisare. Le `note`
#                                            dicono **perché** la track esiste, mai come si chiama
#                                            il task: il numero è l'identità.
#   la classificazione delle feature         `execution-graph.yaml` ha già `execution_lanes` e
#                                            `domain_groups`, entrambi validati. Un terzo
#                                            vocabolario sugli stessi oggetti è ciò che il triage
#                                            del 2026-08-14 ha respinto (§4).
#
# ⚠️ I campi di **ciclo di vita del batch** sono ammessi, e sono l'unica eccezione: descrivono il
# lotto, non una feature. Serve a distinguere una track deliberatamente `IDLE` da una track scritta
# a metà — `issue: null` da solo non lo dice — e per questo il validator di #840 **deve** leggerli,
# in deroga al suo «niente stato». Sono due, elencati per non lasciare la porta aperta al terzo:
#
#   status            ACTIVE | IDLE, per track e per batch
#   reconciled_count  quante volte questo batch è stato rimisurato
#
# 🔴 Fino al 2026-08-14 questa riga diceva *«`status:` è l'unica eccezione»*, e nello stesso giro
# ne è arrivata una seconda: la regola e il dato si sono contraddetti dentro lo stesso commit.
# La code review l'ha trovato. Un elenco chiuso è più onesto di un singolare che invecchia — e la
# prossima aggiunta va argomentata contro **questo** elenco, non contro l'abitudine.
#
# ## Schema di una track  (`schema_version: 2`)
#
#   status         obbligatorio     ACTIVE | IDLE
#   issue          obbligatorio     numero GitHub, oppure null se IDLE
#   branch         se ACTIVE        il branch della sessione, **oppure `null`**. La track umana usa
#                                   `session:` (una seduta di `editor-sessions.yaml`) al posto di
#                                   `branch:`, perché la sua unità di lavoro è un'apertura di editor.
#                                   ⚠️ `null` è una **sentinella documentata, non un campo mancante**:
#                                   dice «track legittima — la issue è aperta — ma il branch dichiarato
#                                   non esiste più, o non è ancora stato aperto». Nasce il 2026-08-14
#                                   da due casi reali nello stesso giro: `simulation`, il cui branch è
#                                   stato cancellato con zero commit, e `client_tools`, il cui branch è
#                                   stato mergiato mentre la issue restava `OPEN`.
#                                   🔴 Questa riga diceva «se ACTIVE», e il validator di #840 —
#                                   implementato contro lo schema scritto — avrebbe rifiutato due terzi
#                                   delle track ACTIVE del batch. Fra un valore vero-e-incompleto e uno
#                                   falso si sceglie il primo, ma **la scelta va scritta qui**, non
#                                   lasciata al lettore.
#   session_branch facoltativo      solo per una track con `session:`. Il ramo su cui quella seduta
#                                   sta effettivamente committando, quando ne apre uno.
#                                   ⚠️ Aggiunto il 2026-08-14 perché la distinzione «seduta umana
#                                   → nessun branch» si è rivelata falsa al primo caso reale: U1 ha
#                                   `feat/451-u1-voci-hex-mode` in un worktree, e senza questo campo
#                                   il suo write-set non era confrontabile con quello di nessun
#                                   altro. Un branch che non si può nominare non entra
#                                   nell'invariante.
#   worktree       facoltativo      il path del worktree, quando la sessione ne ha uno. Serve a
#                                   `git worktree list` — il terzo comando della fotografia — per
#                                   avere un riscontro invece di una corrispondenza a memoria.
#   note           obbligatorio     perché questa track è ACTIVE o IDLE, con la misura
#   writable       se ACTIVE        path o prefissi di directory. Il confronto è per **prefisso
#                                   normalizzato**: `Turn/` e `Turn/RTTurnManager.cpp` collidono.
#   excludes       facoltativo      path che il `writable` includerebbe per prefisso e che questa
#                                   track NON possiede. Sottratti prima del confronto, quindi
#                                   `WritableSet(T) = writable − excludes`.
#                                   ⚠️ Serve perché il prefisso è l'unica granularità che il
#                                   confronto ha, e una directory è spesso più grossa del dominio
#                                   di un checkpoint: due track possono avere bisogno di due file
#                                   diversi della stessa cartella senza contendersi niente.
#                                   Senza questo campo la scelta sarebbe fra elencare 46 file —
#                                   che invecchiano al primo file nuovo — e dichiarare falsa
#                                   un'invariante vera. **Ogni voce va motivata sul DoD delle due
#                                   track**, non sulla comodità: se il confine si scopre a metà
#                                   lavoro, vale la regola di sempre — riallocazione, non fix.
#                                   Introdotto il 2026-08-14 con la track `client_tools` su #78;
#                                   il validator di #840 deve leggerlo, altrimenti calcola
#                                   un'intersezione più grande del vero e segnala conflitti che
#                                   non esistono.
#   binary_leases  se ACTIVE        elenco, eventualmente vuoto. ⚠️ Vivono **solo** qui, dentro la
#                                   track: l'invariante è definita per track, e una lease fuori da
#                                   una track non appartiene a nessun insieme e non entra nel
#                                   confronto.
#   mandate        facoltativo      path del documento che definisce *cosa* la track deve fare, quando
#                                   il lavoro non nasce da una issue ma da un mandato scritto.
#                                   Introdotto il 2026-08-15 con i tre mandati QA
#                                   (`docs/technical/qa-prompt-terminal-{a,b,c}-*.md`): assegnarli
#                                   scrivendoli dentro `note` li avrebbe resi invisibili al confronto,
#                                   perché `note` è prosa e non un campo interrogabile.
#                                   ⚠️ **Un `mandate` non rende `ACTIVE` la track.** `status` passa ad
#                                   ACTIVE quando una sessione parte con una issue; fino ad allora la
#                                   track è IDLE **con mandato assegnato**, che è uno stato diverso da
#                                   IDLE e basta. Uno `status: ACTIVE` con `issue: null` sarebbe la
#                                   contraddizione decidibile che questo file già si è visto contestare.
#                                   ➕ **Conseguenza sullo schema, dichiarata invece che lasciata al
#                                   lettore**: `writable` sopra dice «se ACTIVE», e una track IDLE con
#                                   `mandate` **può** averlo. Lì significa *prenotato*, non *in uso*: il
#                                   path non è di nessun altro e non va assegnato altrove, ma nessuno ci
#                                   sta scrivendo. Il validator di #840 deve trattarlo come parte
#                                   dell'insieme per il calcolo delle intersezioni — una prenotazione che
#                                   non collide non serve a niente — e **non** come prova che la track sia
#                                   attiva.
#                                   ➕ **E vale anche senza `mandate`, dichiarato il 2026-08-16 invece che
#                                   lasciato al lettore.** Una track IDLE la cui `note` nomina una issue aperta
#                                   può avere `writable`, con lo stesso significato: *prenotato*. Serve quando
#                                   l'assegnazione si decide in integrazione ma la sessione parte dopo — se il
#                                   path restasse non assegnato fino all'apertura del branch, chiunque potrebbe
#                                   prenderlo nel frattempo, che è la finestra che D-139 esiste per chiudere.
#                                   ⚠️ `issue:` resta `null` quando `status: IDLE`: il numero sta nella `note`,
#                                   come per `spatial`. Un `issue:` valorizzato su una track ferma somiglia
#                                   troppo a una track attiva, ed è la confusione che questo file paga a caro
#                                   prezzo ogni volta.
#                                   ➕ **E il file del mandato entra nel `writable` della track che lo
#                                   porta**, deciso il 2026-08-15. Prima non era così, e i tre
#                                   `qa-prompt-terminal-*.md` non stavano né in un `writable` né in
#                                   `integration_only`: erano documenti che *governano* un write-set e non
#                                   appartengono a nessuno, cioè la condizione che questo file esiste per
#                                   rendere visibile, applicata ai documenti che lo citano. Chi esegue il
#                                   mandato lo corregge quando lo misura sbagliato — ed è successo: lo spec
#                                   panel del mandato B ha trovato sei affermazioni false su dodici.
#   mandate_worktree facoltativo    worktree in cui gira il **turno del mandato**, quando è diverso da
#                                   `worktree` — che descrive dove lavora la sessione corrente della track.
#                                   Introdotto il 2026-08-15 per `content_editor`: la seduta U1 vive in
#                                   `D:/rt-content` e il turno C aprirà in `D:/rt-client`.
#                                   ⚠️ **Non sono due sessioni contemporanee.** Il `mandate_gate` della
#                                   track resta la condizione: il turno del mandato si apre quando la
#                                   sessione corrente ha chiuso. Il campo dice *dove* aprirà, non che sia
#                                   già aperto — e serve perché il worktree della seduta può essere
#                                   occupato dal proprio build anche dopo che il lavoro è atterrato.
#   mandate_gate   con `mandate`    le condizioni, misurabili, che devono reggere perché quel mandato
#                                   possa cominciare. Serve quando il mandato non è eseguibile in
#                                   parallelo: è il caso del Terminal C, il cui dominio è quasi tutto
#                                   `integration_only` e che quindi gira *dopo* le altre, non insieme.
#                                   ⚠️ Ogni condizione va scritta col **comando** che la verifica: un
#                                   gate che si legge a memoria è una nota, non un gate.
#
# ## La regola che questo file esiste per rendere verificabile
#
# Prima di modificare un file: il path deve appartenere al `writable` della tua track. Altrimenti
# **stop** — si registra una richiesta di riallocazione, non si fa «solo questa piccola fix».
# Vale per C++, docs, scripts, Config, `.uasset`, `.umap`, test e output generati.
#
#   WritableSet(T1) ∩ WritableSet(T2) = ∅
#   BinaryLeaseSet(T1) ∩ BinaryLeaseSet(T2) = ∅
#
# ## `integration_only`
#
# I file che più branch potrebbero voler toccare non si assegnano: si aggiornano **una volta in
# integrazione**. Non è ownership permanente — è una proprietà di questo batch.
#
# ## `generated_only`: la vista segue la sorgente
#
# ⚠️ Non significa «vietato a tutti», e la prima stesura lo diceva — producendo una coppia di
# regole **insoddisfacibile**: chi tocca una sorgente non poteva né rigenerare (path non assegnato)
# né lasciar stare (`--check` rosso). La regola giusta:
#
#   una vista generata non si assegna mai direttamente: **segue la propria sorgente**.
#   Chi possiede la sorgente nel proprio `writable` è autorizzato — e obbligato — a rigenerare
#   esattamente le viste che quella sorgente alimenta, e nient'altro.
#
# ⚠️ **Due track possono legittimamente alimentare la stessa vista, e non è un conflitto.** La
# seconda stesura di questa regola diceva *«allora una delle due esce dal batch»*, e sarebbe stata
# troppo stretta fino all'inutilità: `project-graph.json` ha **dieci** sorgenti, quindi due track
# che lo alimentano entrambe sono il caso normale, non l'eccezione. Il criterio che decide chi esce
# dal batch resta **uno solo — la sovrapposizione dei `writable`**.
#
# 🔴 La terza stesura giustificava la stessa regola con `Source/RefactorTactics/Tests/`, «sorgente
# delle viste per qualunque track scriva un test». **È falso, ed è stato misurato**: toccare un
# test lascia `generate --check` e `shortlist --check` verdi. `TESTS_DIR` è letto solo da
# `validate`, per far combaciare i pattern `tests:`. L'arco era stato dedotto da una costante letta
# nel codice invece che dall'esperimento — lo stesso difetto, al terzo giro, dentro la correzione
# del secondo.
#
# Quando due track alimentano la stessa vista, quella vista si comporta come `integration_only`:
# ciascun branch la rigenera per tenere verde il proprio `--check`, ma **nessuna delle due copie è
# autoritativa** e l'unica che conta è quella rigenerata **sull'albero unito**. È il passo 8 della
# chiusura del batch, e non è negoziabile: due rami che rigenerano sulla propria base producono due
# versioni dello stesso file da una sorgente che nessuno dei due vede intera.
#
# `derives_from` qui sotto rende la catena verificabile invece che ricordata, ed è **misurata**:
# per ogni sorgente candidata la si sposta via, si rigenera, e si guarda quali viste cambiano.
# Leggere le costanti di `scripts/feature_registry.py` non basta — ne dichiara di lette anche da
# `validate`, che non producono nessuna vista.
#
# ➕ E per `project-graph.json` non serve neppure misurare: **l'artefatto pubblica le proprie
# sorgenti**, nella chiave `sources`. Quello è l'elenco autoritativo; la copia qui sotto esiste per
# il validator e si riallinea con:
#
#     python -c "import json;print(json.load(open('docs/roadmap/project-graph.json'))['sources'])"
#
# ## Le lease binarie
#
# Due `.uasset`/`.umap` non si fondono: un conflitto binario è una delle due versioni da rifare a
# mano dentro Unreal. La lease non previene un conflitto, previene un lavoro perso.
# `key` semantica e legata a GitHub, mai `LEASE-001`. Una lease vale sul `base_sha`: se `main`
# tocca lo stesso asset, la lease è **stale** e va riemessa.

# ⚠️ Bump da 1 a 2 il 2026-08-14: questo giro ha aggiunto `session_branch`, `worktree` e
# `reconciled_count`, e ha ammesso `branch: null`. Un consumatore pinnato a v1 — cioè il validator
# di #840, che questo file invoca a ogni sezione come ragione per cui i campi devono essere
# leggibili — non poteva distinguere un campo nuovo da un refuso, né un file v1 scritto prima dal
# medesimo scritto dopo. Il numero non e' decorazione: e' l'unico modo che ha un lettore automatico
# di sapere quale contratto sta leggendo.
schema_version: 2

meta:
  status: ACTIVE
  note: >-
    Primo batch dopo D-139. Il parallelismo minimizza il wall-clock, non massimizza il numero di
    branch: le track IDLE non sono un difetto. I write-set delle track ACTIVE sono **dichiarazioni
    da confermare** alla prima apertura del branch, mentre quelli in `preexisting` sono **misurati**.
    ❓ **2026-08-15 — la domanda che questo lotto ha guadagnato: chiudere il batch?** Non la decide
    una riconciliazione, e per questo `status` resta `ACTIVE`. I dati su cui deciderla, misurati oggi:
    · **quattro riconciliazioni in due giorni**, l'ultima a quattro ore dalla precedente;
    · **tre track su cinque IDLE** — restano `client_tools` (#78) e `content_editor` (#451);
    · **due sessioni sullo stesso `integration_only`**, che è la condizione che il paragrafo in fondo
      a questa nota dichiara sufficiente per dire che un lotto ha smesso di essere un lotto: qui è
      `feat/451` contro questa riconciliazione, e stavolta è misurata invece che prevista;
    · **undici** voci in `preexisting` contro le due track vive, cioè un file che descrive soprattutto
      lavoro che non gli appartiene.
    ⚠️ Il costo di tenerlo aperto non è la scrittura: è che `client_tools` e `content_editor` hanno un
    vincolo dichiarato e lo perderebbero. Chiudere il batch **senza** riaprirne uno per quelle due
    track significa lasciarle senza write-set, che è peggio di un file un po' stantio.
    🔴 **Riconciliato il 2026-08-14, e la misura ha trovato il file stantio in quattro punti** —
    `spatial` ACTIVE su una issue chiusa da un'ora, tutte e tre le voci `preexisting` atterrate,
    sei branch vivi non elencati, `base_sha` fermo tredici PR indietro. È il difetto che questo
    file rende visibile applicato a sé stesso: un write-set **si misura**, e un batch che dura più
    di mezza giornata va rimisurato prima di essere riletto come vincolo.
    🔴 **E rimisurato una seconda volta lo stesso giorno, tre ore dopo, con tre difetti nuovi.**
    Non è pignoleria: fra le due riconciliazioni sono atterrate **sette** PR — #859, #860, #861,
    #862, #866, #867 e la coda del giro — e ciascuna ha invalidato qualcosa che la prima aveva
    scritto come misurato. 🔴 La prima stesura di questa riga ne contava **quattro** e ometteva
    proprio #866, che è la PR che ha reso `v0.1-issue-plan.md` una sorgente di `roadmap-map.svg`:
    l'unica omessa era quella il cui effetto è stato poi mancato più sotto. Il conteggio si misura
    con `git log --oneline --merges <base_precedente>..origin/main`, non si ricorda.
    · il `branch:` di `client_tools` è stato **mergiato e cancellato** — la riga lo dava vivo;
    · `roadmap-map.svg` è una **vista generata nuova** (#857), e il file non la conosceva: chi
      tocca una delle sue quattro sorgenti lasciava `generate --check` rosso senza saperlo;
    · i `derives_from` dei test dichiaravano «2 su 8» e «2 su 6» dove la misura dice **8 su 8** e
      **6 su 6** — la condizione `only_if` era falsa in senso permissivo, cioè quello che non
      protegge.
    ⚠️ La lezione della prima riconciliazione era che `gh pr list` non vede i branch senza PR.
    Quella di questa è **il gemello locale dello stesso difetto**: `git ls-remote` non vede un
    branch mai pushato, e all'inizio di questo giro ce n'erano **due**, in due worktree aperti. La
    fotografia vuole **tre** comandi, e il terzo è `git worktree list`.
    🔴 **E uno dei due è diventato remoto mentre lo si scriveva**: `feat/telecamera` è passato da
    zero commit a tre, da locale a pushato, e da write-set vuoto a **nove file** — fra i quali
    *questo*. Il file non è invecchiato fra una riconciliazione e l'altra: è invecchiato **dentro**
    una riconciliazione. Nello stesso intervallo sono comparsi altri due worktree e il branch che
    `simulation` dichiarava sparito è stato ricreato. Non c'è una misura che regga a questo, e la
    conseguenza pratica non è misurare più spesso — è **chiudere il batch**: due consolidamenti
    documentali aperti sullo stesso `integration_only` non sono un difetto di aggiornamento, sono
    un lotto che ha smesso di essere un lotto.
    ⚠️ **Questa fotografia è delle `14:2x` del 2026-08-14, su `base_sha` f521f6b8**, ed è dichiarata
    all'ora e non al giorno per la ragione che il paragrafo sopra dimostra: al terzo giro la
    granularità giusta non è più la data. Chi la rilegge domani non deve chiedersi se sia di
    stamattina o di ieri sera — deve **rimisurarla**, e il costo è tre comandi.

batch:
  # ⚠️ Lo sha è troncato a 8 caratteri, come in tutta la prosa del repository. `base_sha` resta
  # completo: l'identità è leggibile, il confronto è esatto.
  #
  # ⚠️ `id` e `base_sha` **divergono dopo una riconciliazione, ed è voluto.** L'id è coniato una
  # volta sulla base di creazione (`workflow-parallel-claude.md` §«L'identità del batch» lo lega al
  # `base_sha:8` del momento in cui il batch nasce) e nomina le due issue di allora — `gh41`, oggi
  # chiusa, e `gh583`, sostituita da #165 quando la sua premessa si è rivelata falsa. Cambiarlo
  # significherebbe dire che questo è un batch diverso, e non lo è: stesse track, stesso lotto.
  # Il `base_sha` invece **è** la base corrente, ed è il campo su cui si misura: i write-set qui
  # sotto sono calcolati con `git diff --name-only <base_sha>...<branch>` su questo valore, non su
  # quello dell'id.
  id: "BATCH-84cbb70c-gh41-gh583"
  base_sha: "18a19be0246ca563431e6c72698e599f8e329585"
  created_at: "2026-08-14"
  # Base di creazione, tenuta perché è ciò che l'`id` nomina: `84cbb70c6f5082682e59a71d442b71e78fac4322`.
  # Verificato che sia ancora antenato della base corrente (`git merge-base --is-ancestor`): sì —
  # il batch non è stato rebasato via, è avanzato.
  #
  # ⚠️ Anche la base della **prima** riconciliazione (`1b511644c80c45b76e40cda6f262eb525f71f52f`)
  # è antenato di questa, verificato allo stesso modo. Non resta come campo: i write-set qui sotto
  # sono ricalcolati su `base_sha`, e tenere due basi vive significherebbe avere due misure che si
  # somigliano. Serve solo a dire che fra le due riconciliazioni il batch è **avanzato di sette
