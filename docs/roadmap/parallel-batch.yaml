      duplica il criterio di `MixName` invece di condividerlo, perché `Map/` non può dipendere da `Turn/`.
      Se i due criteri divergono, divergono i due hash sullo stesso campo — cioè il difetto che `#986` ha
      chiuso. Il commento lo dice accanto a entrambi.

      ➕ **Track aperta il 2026-08-16 su `#986`**, nello stesso worktree che ha appena chiuso `#593`:
      `unit_presentation` e' IDLE e il suo write-set e' rilasciato, quindi i due elenchi non si toccano
      — nessun path e' condiviso fra le due track.

      `#986` e' il successore di `#832`, aperto da una code review arrivata **dopo** il merge della PR
      #978. Cinque difetti su `HashMatchState` / `ComputeHash`, e le cinque affermazioni della issue
      sono state **rilette sul codice** prima di aprire questa track invece di essere ereditate: tutte
      e cinque reggono. `MixName` mescola `Name.ToString()` senza prefisso di lunghezza
      (`RTMatchStateHash.cpp:16-19`), il giro degli archi salta `bConductsElectricity` (`:118-131`),
      e `ComputeHash` non vede `StableId` ne' per le porte (`RTHexMapAsset.cpp:317-320`) ne' per gli
      archi.

      ⚠️ **`Map/RTHexMapAsset.{h,cpp}` entra, e non per simmetria.** La prima casella del DoD chiede di
      **decidere** se `StableId` entri anche in `ComputeHash`. Il criterio non e' da inventare: e' gia'
      scritto due volte accanto ai campi che ne restano fuori — `RTHexMapAsset.h:112` (`MapClass`) e
      `RTHexCellData.h:71` (`bGenerated`) dicono entrambi che quell'hash risponde alla domanda «la
      stessa geometria produce la stessa partita?». `URTStructureIdentityLibrary::FindDoorEdges`
      risolve i bersagli **per nome**, quindi rinominare una porta cambia quale bordo si apre per
      chiunque la citi: e' dato autorevole nel senso del criterio, come lo e' gia' `DoorId` due righe
      sopra. La decisione va scritta accanto ai due hash, che e' il resto della stessa casella.

      ⚠️ **`Tests/RTHexDoorTests.cpp` entra**: `HexMap.DoorHashDeterminism` e' il test nominato dal DoD
      di `#832`, e la misura di `#986` e' che chiama `ComputeHash()` in tutte e cinque le sue assert —
      cioe' e' rimasto verde perche' non vede nulla di cio' che #978 ha cambiato. Se `StableId` entra
      in `ComputeHash`, quel test copre il rename o resta un gate che non guarda.

      ✅ **Intersezione MISURATA il 2026-08-16 sui tre comandi**, non dedotta: `git ls-remote --heads`
