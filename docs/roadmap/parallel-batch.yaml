      `git diff --name-only origin/main...<ramo>` per tutti e diciannove: **zero** tocca uno dei sei
      path qui sotto.
      ⚠️ **Limite dichiarato**, lo stesso di `unit_presentation`: la misura vede i **commit**, non il
      lavoro non committato negli altri worktree.

      ⚠️ **Il vincolo che resta non e' sui file, e' la macchina**: al momento dell'apertura girano
      **quattro** `UnrealEditor-Cmd` di altre sessioni (`rt-autobattle`, `rt-content`, `rt-simulation`,
      `rt-client`), letti dalla loro command line e non dedotti dal nome del processo. Una run di
