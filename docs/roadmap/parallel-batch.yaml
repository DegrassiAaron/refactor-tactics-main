      `RefactorTactics.UI.IntentCertaintyClassification` e `RefactorTactics.UI.NoEnemyIntentExposed`
      sono in `RTIntentPrivacyTests.cpp` (atterrati con #859) e **nessuna feature del registry li
      cita**: né per riferimento esplicito, né via il pattern `RefactorTactics.Reactions.*`, che non
      li raggiunge perché stanno sotto `UI.`.
      🔴 **Questa riga diceva che `RT-FEAT-UI-CERTAINTY` ne cita uno solo, ed è falso: ne cita due** —
      `Combat.IntentVisibleToAlliesAlwaysEnemiesOnlyIfRevealed` e
      `Reactions.IntentViewSkipsDeadAndKeepsOrder`. La correzione ha un effetto pratico, non solo di
