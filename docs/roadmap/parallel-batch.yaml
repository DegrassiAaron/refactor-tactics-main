# --- Branch già vivi al momento del calcolo ---------------------------------------------------
#
# Non sono parte del batch: sono il vincolo che l'ha determinato. I loro write-set sono
# **misurati**, non intuiti — `git worktree list`, `gh pr list --state open`, e per ciascuno
# `git diff --name-only <base_sha>...<branch>`.
#
# 🔴 La prima stesura di questo file ne aveva **dichiarato** uno a memoria («wt-cap tiene
# RTScenarioCorpusTests.cpp») e sbagliava: il comando ne restituisce **sette**, fra cui una
# directory che una track ACTIVE si era assegnata. L'invariante era violata alla prima
# applicazione del meccanismo, e il difetto era esattamente quello contro cui il meccanismo esiste.
#
# 🔴 **E la seconda stesura ha sbagliato il comando, non la memoria.** Questa sezione elencava tre
# branch — walls-doors, wt-cap, consolidamento-4-processi — ed erano **tutti e tre atterrati**
# (PR #836, #848, #842) quando la riconciliazione del 2026-08-14 li ha riletti: zero worktree
# residui, branch cancellati lato server. Nel frattempo `gh pr list --state open` restituiva
# **vuoto**, e la conclusione ovvia — «nessun branch vivo» — era falsa: `git ls-remote --heads`
# ne mostra **sei**. La lezione è che `gh pr list` non vede i branch senza PR, e un WIP parcheggiato
# è esattamente il branch che una PR non l'ha mai avuta. La fotografia va scattata con **due**
# comandi, e quello che conta è il secondo.
#
# 🔴 **La terza stesura ha trovato il gemello locale dello stesso difetto.** `git ls-remote --heads`
# vedeva sei branch, gli stessi di stamattina; `git worktree list` ne mostrava **due che quel
# comando non può vedere**, perché non erano mai stati pushati — `feat/telecamera` e
# `feat/451-u1-voci-hex-mode`. Il secondo **è** la track `content_editor` di questo batch, che nella
# stesura precedente risultava senza branch: il vincolo era registrato, la sessione che lo esercita
# no. ⚠️ Il primo nel frattempo è stato pushato, quindi oggi lo vede anche `ls-remote` ed è elencato
# più sotto col suo write-set reale — ma questo **non** rende il terzo comando superfluo: lo rende
# necessario *prima*, cioè nella finestra in cui la sessione esiste e il remoto non lo sa ancora.
# Serve un **terzo** comando, e la fotografia completa è:
#
#     git ls-remote --heads origin        # i branch pushati, anche senza PR
#     git worktree list                   # le sessioni aperte, anche mai pushate
#     git diff --name-only <base_sha>...<branch>   # il write-set di ciascuno
#
# ⚠️ Un branch locale con **zero commit** non è un vincolo — il suo write-set è vuoto, misurato —
# ma è una sessione che sta per produrne uno, e va elencata *prima* che scriva, non dopo.
# `state: LOCAL` esiste per questo:
#
#   LOCAL     esiste solo in un worktree, mai pushato. `git ls-remote` non lo vede. Il write-set
#             misurato può essere **0 file**, e in quel caso la voce dichiara una sessione aperta,
#             non un conflitto.
#
# ⚠️ Un `preexisting` è una fotografia, non un lock — vale sia in avanti («era `OPEN` quando il
# write-set è stato calcolato ed è atterrata un'ora dopo», walls-doors) sia all'indietro, come qui.
# `base_sha` va **riletto prima del merge**, sempre.
#
# `state:` qui dentro descrive il **branch**, non una PR — è la correzione che serviva, visto che
# i sei branch vivi una PR non ce l'hanno mai avuta:
#
#   LIVE      divergente da `origin/main`, con almeno un commit nelle ultime 24 h.
#   DORMANT   divergente da `origin/main`, nessuna PR aperta, ultimo commit ≥ 2 giorni.
#   MERGED    già contenuto in `origin/main` (`git merge-base --is-ancestor`). Esce dalla sezione:
#             un branch atterrato non è più un vincolo, e questo file non è un registro storico.
#
# ⚠️ `DORMANT` è un fatto misurato, non un giudizio sul lavoro: dice solo che nessuno ci sta
# scrivendo *adesso*, quindi il conflitto non è simultaneo — è **differito al giorno in cui quel
# branch riprende**, e chi riprende paga il merge. Va riletto a ogni riconciliazione: in questo
# stesso giro `wip/icon-visual-language` è passato da `DORMANT` a `LIVE` mentre lo si scriveva.

