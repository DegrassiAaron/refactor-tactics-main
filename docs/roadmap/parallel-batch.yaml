# --- Viste generate: non si assegnano, seguono la sorgente -------------------------------------
#
# Nessuna track le mette nel proprio `writable`. Chi possiede una `source` la rigenera, e lo
# dichiara nel proprio `derives_from`. Due track che alimentano la stessa vista la dichiarano
# entrambe con `shared_with`: non è un conflitto — lo sarebbe una sovrapposizione dei `writable` —
# ma nessuna delle due copie è autoritativa prima della rigenerazione sull'albero unito.
#
# ⚠️ Il repository ha **due** toolchain (`CONTEXT_INDEX.md` §«Le due toolchain»), e la prima
# stesura di questo elenco copriva solo Python: gli otto SVG dei radar sono versionati con un
# proprio `--check` in Node, e chi tocca `docs/balance/` li rende rossi senza saperlo.

generated_only:
  - path: docs/roadmap/feature-registry.json
    derives_from: [docs/roadmap/feature-registry.yaml]
    tool: "feature_registry.py generate"

  # ⚠️ Alimentata da TUTTO. L'elenco autoritativo e' la chiave `sources` dentro l'artefatto
  # stesso (9 voci) piu' `RTScenarioSession.cpp`, che `available_capabilities()` aggiunge.
  # Questa copia esiste per il validator e si riallinea rileggendo quella chiave, non a memoria.
  - path: docs/roadmap/project-graph.json
    derives_from:
      - docs/roadmap/feature-registry.yaml
      - docs/roadmap/editor-sessions.yaml
      - docs/roadmap/execution-graph.yaml
      - docs/roadmap/roadmap-checkpoint.md
      - docs/roadmap/roadmap-v0.1.md
      - docs/roadmap/roadmap-post-v0.1.md
      - docs/roadmap/v0.1-definition-of-done.md
      - docs/technical/test-manuali-pie.md
      - Scenarios/
      - Source/RefactorTactics/ScenarioHarness/RTScenarioSession.cpp
    tool: "feature_registry.py generate"

  - path: docs/roadmap/roadmap.shortlist.md
    derives_from:
      - docs/roadmap/feature-registry.yaml
      - docs/roadmap/roadmap-v0.1.md
      - docs/roadmap/roadmap-post-v0.1.md
    tool: "feature_registry.py shortlist"

  - path: docs/roadmap/featuremap.shortlist.md
    derives_from: [docs/roadmap/feature-registry.yaml]
    tool: "feature_registry.py shortlist"

  - path: docs/roadmap/scenariomap.shortlist.md
    derives_from:
      - Scenarios/
      - Source/RefactorTactics/ScenarioHarness/RTScenarioSession.cpp
    tool: "feature_registry.py shortlist"

  - path: docs/roadmap/milestonemap.shortlist.md
    derives_from:
      - docs/roadmap/feature-registry.yaml
      - docs/roadmap/roadmap-checkpoint.md
      - docs/roadmap/v0.1-definition-of-done.md
    tool: "feature_registry.py shortlist"

  - path: docs/roadmap/editormap.shortlist.md
    derives_from:
      - docs/roadmap/editor-sessions.yaml
      - docs/roadmap/roadmap-checkpoint.md
      - docs/roadmap/roadmap-v0.1.md
      - docs/technical/test-manuali-pie.md
    tool: "feature_registry.py shortlist"

  # ➕ **Vista nuova, nata il 2026-08-14 con #857 (PR #861 e #862), e questo elenco non la
  # conosceva.** È il terzo target di `generate` accanto a `feature-registry.json` e
  # `project-graph.json`: chi tocca una delle quattro sorgenti qui sotto e non la rigenera lascia
  # `generate --check` rosso — e non c'era una riga in questo file che glielo dicesse.
  # ⚠️ È un SVG, quindi testo diffabile e non un binario da fondere a mano; committato perché la
  # Wiki lo legge via `raw.githubusercontent.com`.
  #
  # Le sorgenti sono **misurate col metodo di §`generated_only`** — si perturba la sorgente, si
  # rigenera, si guarda quale vista si muove — e non lette dalle costanti: `roadmap_map_model()`
  # ne nomina tre in modo diretto e la quarta attraverso `epic_catalog()`, che è esattamente il
  # tipo di arco che al terzo giro questo file ha già sbagliato a dedurre.
  # La controprova conta quanto la prova, e sono **quattro archi che NON esistono**:
  # `roadmap-checkpoint.md`, `v0.1-definition-of-done.md`, `test-manuali-pie.md` e
  # `editor-sessions.yaml` muovono `project-graph.json` (e le rispettive shortlist) ma **non**
  # questa figura. Perturbati uno per uno, verificando ogni volta che la perturbazione fosse
  # davvero applicata (`git diff --numstat`): senza quel controllo un `replace` a vuoto restituisce
  # «nessuna vista cambia», che è la risposta giusta alla domanda sbagliata.
  - path: docs/roadmap/charts/roadmap-map.svg
    derives_from:
      - docs/roadmap/feature-registry.yaml      # area/epic/dependencies → corsia e archi
      - docs/roadmap/execution-graph.yaml       # `domain_groups` → le corsie stesse
      - docs/roadmap/roadmap-v0.1.md            # via `epic_catalog()`: glifo e checkpoint
      - docs/roadmap/roadmap-post-v0.1.md       # via `epic_catalog()`: release e priorità
      - docs/roadmap/v0.1-issue-plan.md         # via `epic_catalog()` → `epic_issue_map()`
    tool: "feature_registry.py generate"
    # 🔴 **La quinta sorgente mancava, e la prima stesura di questa voce dichiarava «quattro».**
    # Trovata dalla code review, riverificata qui col metodo forte — si toglie la sorgente e si
    # rigenera: **37426 → 36260 byte**, mentre la controprova su `roadmap-checkpoint.md` restituisce
    # un SVG identico al byte. I numeri di issue sono visibilmente disegnati nella figura (`#26`,
    # `#330`, `#244`), quindi l'arco non era nemmeno sottile.
    # ⚠️ **Perché era sfuggito, che è la parte utile.** La misura era stata fatta su `86a6844c`, e
    # `v0.1-issue-plan.md` è diventato una sorgente con **#866** — la PR immediatamente successiva,
    # cioè quella che poi è finita in `base_sha`. Un probe misura l'albero su cui gira: se la base si
    # sposta dopo, la misura non è sbagliata, è **scaduta**, e va rifatta sulla base finale. Il primo
    # tentativo aveva anche perturbato un `#nnn` di prosa invece che una riga letta dal parser,
    # ottenendo un «nessuna vista cambia» che era la risposta giusta alla domanda sbagliata.
    # ⚠️ **La conclusione «tutte integration_only, nessuna track può rigenerarla» non reggeva**: la
    # quinta sorgente non era in nessun `writable` **né** in `integration_only`, cioè non assegnata.
    # Ora è in `integration_only` con le altre quattro, e l'affermazione torna vera — ma per averlo
    # scritto, non per fortuna.

  # Seconda toolchain: Node, gate proprio (D-108). `feature_registry.py` non la vede.
  - path: docs/characters/radar/
    derives_from: [docs/balance/]
    tool: "node tools/radar/generate.ts"
