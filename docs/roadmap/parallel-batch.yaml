      i tre test di CP 13.4 fuori dalla guardia — è dell'**11/08 alle 23:45**. Il gate è stato **verde e falso
      per quattro giorni**, ed era vero quando fu timbrato: è la firma di un gate che nessuno riesegue.
      ∴ la track deve poter scrivere §3 — `G1` non nomina il target `Game` Shipping né il comando, e `G12` va
      ridatato su una misura di oggi. Senza quel file, `#923` chiude il sintomo e lascia la terza occorrenza.
