      build, ed e' registrato sulla issue invece di sparire con la track.
      ⚠️ **Il write-set resta descritto qui e il blocco `writable` esce**: dodici path — gli undici test e
      `docs/roadmap/v0.1-definition-of-done.md` — tutti atterrati in `main`, oggi non assegnati. ⛔ **Il DoD
      torna quindi senza proprietario**, ed e' la stessa condizione che la nota di `spatial` descrive: chi
      deve scriverlo se lo fa assegnare, e con esso eredita le due viste che alimenta.
      ➕ **Cosa la track NON ha fatto, detto invece che dedotto**: `G1` ora nomina i tre comandi, ma **nessuno
      li esegue al posto di chi consegna**. Non c'e' CI (`.github/workflows/` assente per scelta), quindi la
      difesa contro la terza occorrenza e' una riga di DoD che una persona deve leggere. E' meglio di prima —
