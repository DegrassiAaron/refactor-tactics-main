      2026-08-15 su un altro file, e si ripete perché *la suite gira sul target Editor e il target `Game` non
      lo compila niente di automatico*. Correggere solo i test lascia in piedi il meccanismo che li rompe.
      ⚠️ **Il dato che lo dimostra, misurato oggi**: `G12` (*«Packaging Windows Development e Shipping →
