# RefactorTactics — Capability Map (dato machine-readable)
#
# Vista umana: capability-map.md (stesso cartella). Questo file e' la sorgente.
#
# ─────────────────────────────────────────────────────────────────────────────
# FOTOGRAFIA
#   misurata su  origin/main = 18065c28b2fc7726b5b31795083aac94b7e4542b
#   data         2026-09-10
#   metodo       audit statico: git ls-tree / git grep su origin/main + GitHub LIVE (gh).
#                NESSUNA build, NESSUN Editor, NESSUNA suite eseguita in questa passata.
#
# ⛔ QUESTO FILE NON POSSIEDE STATO.
#    La source of truth dello stato corrente sono le issue e le milestone GitHub, il codice
#    su main e i test eseguibili. Quando questo file e GitHub non concordano, VINCE GITHUB.
#    Non e' il Feature Registry: quello e' uscito dal repository con D-181 (commit 26f6955a) e
#    gli identificatori `RT-FEAT-*` non sono autorevoli. Gli `RT-CAP-*` qui sotto sono
#    identificatori LOCALI di questa vista, nati il 2026-09-10.
#
# ⛔ NON E' UN OWNER. Ogni capability dichiara l'owner che gia' esiste (epic GitHub, spec, ADR).
#    Qui si linka, non si forka. La vista longitudinale per release resta
#    docs/roadmap/capability-roadmaps.md (identificatori `CR-*`), che questo file referenzia
#    nel campo `owner.capability_view`.
#
# ─────────────────────────────────────────────────────────────────────────────
# SEMANTICA DEGLI STATI  (nessuna percentuale, per decisione: vedi il .md §0)
#
#   status.implementation
#     complete : il comportamento esiste nel codice di produzione ed e' raggiungibile dal
#                percorso di gioco reale (non solo dai test).
#     partial  : esiste ed e' raggiungibile, ma il contratto dichiarato dal suo owner ha
#                buchi misurati (issue aperte che nominano l'assenza).
#     missing  : nessun codice di produzione lo implementa.
#
#   status.validation
#     complete : esistono test automation mirati E scenari/golden che lo esercitano dal
#                percorso di gioco reale.
#     partial  : esistono test, ma manca almeno uno fra scenario/golden, verifica di
#                mutazione, o copertura di un ramo che una issue aperta dichiara scoperto.
#     missing  : nessun test nomina la capability.
#     ⚠️ `validation` misura COSA ESISTE, non cosa e' stato ESEGUITO. L'esecuzione e' in
#        `verification`, e in questa passata e' NOT RUN per costruzione (niente CI: D-182).
#
#   status.presentation
#     complete       : il giocatore/designer puo' vedere l'esito senza leggere un log.
#     partial        : visibile in parte, o solo da un canale di debug.
#     missing        : la logica decide e nulla lo mostra.
#     not_applicable : la capability non ha una superficie player-facing per costruzione.
#
# ─────────────────────────────────────────────────────────────────────────────
# CONVENZIONI DEI CAMPI
#   issues.open / issues.closed : NUMERI, mai conteggi (AGENTS.md §14). `open` elenca solo
#                                 issue verificate OPEN alla fotografia.
#   tests.automation            : PREFISSI di gruppo `RefactorTactics.<Gruppo>.*`, non nomi
#                                 di singolo test, salvo quando il singolo test E' il gate.
#   verification.pie            : voci del registro docs/technical/test-manuali-pie.md.
#   verification.packaged       : gate G* di docs/roadmap/v0.1-definition-of-done.md §3.
#   dependencies                : L'ARCO AUTOREVOLE. «Questa capability non funziona senza».
#   consumers                   : l'INVERSO ESATTO di `dependencies`, generato — non scritto a
#                                 mano. Verificato: il grafo e' ACICLICO e la simmetria e' totale
#                                 (`consumers[A]` == { B : A in dependencies[B] }). Se aggiungi un
#                                 arco, aggiungilo da entrambe le parti o rigeneralo.
#   fact / inference            : dove lo stato non e' leggibile direttamente dal codice, il
#                                 campo `notes` dichiara `FATTO:` o `INFERENZA:`.

# ─────────────────────────────────────────────────────────────────────────────
# COME QUESTA MAPPA SBAGLIA  (regola di metodo, aggiunta dopo il panel del 2026-09-10)
#
# 🔴 **Il titolo di una issue APERTA descrive il difetto al momento dell'apertura, non oggi.**
#    In questo repository il lavoro atterra sotto una issue che poi resta aperta per lo scope
#    residuo — verifica PIE, follow-up, accettazione. Leggere un titolo come stato corrente e' il
#    modo in cui questa mappa e' stata sbagliata TRE volte nella sua prima stesura: #2697, #2742
#    e #2554 erano tutte gia' indirizzate nel codice su `origin/main`.
#
#    ⛔ Nessun campo `status` puo' essere derivato da un titolo. Si deriva da:
#       1. il simbolo nel codice, e i suoi chiamanti fuori dai test;
#       2. `git log origin/main --grep=<numero>` per vedere se il lavoro e' atterrato;
#       3. e solo dopo, la issue — LETTA, non citata dal titolo.
#
# 🔴 **Un `git grep` di un token non distingue un riferimento vivo da una frase sulla sua assenza.**
#    Due difetti di tracciabilita' della prima stesura erano hit di COMMENTO (`WBP_RT_PauseMenu`,
#    `WBP_RT_ScenarioComposer`), e un file di implementazione lo era pure (`RTPlayerState.h`).
#
# 🔴 **Una ricerca case-insensitive corta non e' una misura di assenza.** `git grep -il FMOD`
#    risponde 10 file, tutti `FModuleManager` e `FModeToolkit`.
#
# ⚠️ Le rettifiche restano SCRITTE nelle voci, marcate `⌫`, invece di essere riscritte in silenzio.

meta:
  id_prefix: RT-CAP
  created: 2026-09-10
  revised: 2026-09-10   # panel di revisione: 12 rettifiche, 3 status corretti
  measured_on: origin/main 18065c28b2fc7726b5b31795083aac94b7e4542b
  authority: none          # vedi il banner sopra
  owner_of: "una sola domanda: per ogni capability, chi la possiede, cosa la implementa,
             cosa la verifica, e cosa manca ancora"
  supersedes: none
  related:
    - docs/roadmap/capability-roadmaps.md          # vista longitudinale per release (CR-*)
    - docs/technical/architecture/architettura-codice.md  # mappa per cartella
    - docs/technical/tooling/scenario-map.md       # chi verifica cosa (macchina vs persona)
    - docs/roadmap/v0.1-definition-of-done.md      # i gate di release: G1..G14 + G16
                                                  # (G15 e' ritirato da D-181 e il numero non si riusa;
                                                  #  G16 entra con 1cdd0d03, non e' su 18065c28)

