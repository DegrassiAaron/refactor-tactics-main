<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="64" height="64" viewBox="0 0 64 64">
  <title>RefactorTactics Composite Skill Icon Template 64</title>
  <desc>Modular 64x64 skill icon template for Affinity Designer. Phase, target, shape, delivery, effect, values and modifiers are independent layers.</desc>

  <g id="00_GUIDES_DO_NOT_EXPORT" inkscape:groupmode="layer" inkscape:label="00_GUIDES_DO_NOT_EXPORT"
     fill="none" stroke="#7F8A99" stroke-width="0.5" opacity="0.6">
    <rect x="0.5" y="0.5" width="63" height="63" stroke-dasharray="2 2"/>
    <rect x="4" y="4" width="56" height="56" rx="8" stroke="#56B4E9" stroke-dasharray="2 2"/>
    <rect x="8" y="8" width="48" height="48" rx="6" stroke="#A7ADB5" stroke-dasharray="1.5 1.5"/>
    <path d="M32 0V64 M0 32H64" opacity="0.6"/>
    <circle cx="32" cy="32" r="0.8" fill="#56B4E9" stroke="none"/>
    <!-- slot guides -->
    <circle cx="14" cy="14" r="5"/>
    <circle cx="50" cy="14" r="5"/>
    <circle cx="12" cy="32" r="5"/>
    <circle cx="32" cy="32" r="13"/>
    <circle cx="52" cy="32" r="5"/>
    <circle cx="20" cy="51" r="4.5"/>
    <circle cx="44" cy="51" r="4.5"/>
  </g>

  <g id="05_BASE_FRAME" inkscape:groupmode="layer" inkscape:label="05_BASE_FRAME"
     fill="none" stroke="#F2F4F7" stroke-width="2.2" stroke-linejoin="round">
    <!-- Neutral technical frame. Tint only if the UI design explicitly calls for it. -->
    <path d="M18 5 H46 L59 18 V46 L46 59 H18 L5 46 V18 Z" opacity="0.90"/>
  </g>

  <g id="10_PHASE_MARKER" inkscape:groupmode="layer" inkscape:label="10_PHASE_MARKER"
     fill="none" stroke="#F2F4F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <g id="PHASE_BLAST_DIAMOND" inkscape:label="PHASE_BLAST_DIAMOND">
      <path d="M32 3 L37 8 L32 13 L27 8 Z"/>
    </g>
    <g id="PHASE_DODGE_TRIANGLE" inkscape:label="PHASE_DODGE_TRIANGLE" style="display:none">
      <path d="M32 3 L38 12 H26 Z"/>
    </g>
    <g id="PHASE_MOVE_SQUARE" inkscape:label="PHASE_MOVE_SQUARE" style="display:none">
      <rect x="27" y="3" width="10" height="10" rx="1"/>
    </g>
    <g id="PHASE_REACTION_BROKEN_ARC" inkscape:label="PHASE_REACTION_BROKEN_ARC" style="display:none">
      <path d="M26 10 A7 7 0 0 1 36 5"/>
      <circle cx="38" cy="7" r="1.5" fill="#F2F4F7" stroke="none"/>
      <path d="M38 7 l-4 1.5"/>
    </g>
  </g>

  <g id="20_TARGET_SLOT_TOP_LEFT" inkscape:groupmode="layer" inkscape:label="20_TARGET_SLOT_TOP_LEFT"
     fill="none" stroke="#F2F4F7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Replace placeholder with Target glyph: Self / Ally / Enemy / Cell / Direction / Path. -->
    <circle cx="14" cy="14" r="2.6" opacity="0.45"/>
    <path d="M10 18 q4-3 8 0" opacity="0.45"/>
  </g>

  <g id="30_SHAPE_SLOT_TOP_RIGHT" inkscape:groupmode="layer" inkscape:label="30_SHAPE_SLOT_TOP_RIGHT"
     fill="none" stroke="#F2F4F7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Replace placeholder with Shape glyph: Single / Line / Cone / Circle / Chain / etc. -->
    <circle cx="50" cy="14" r="3.5" opacity="0.45"/>
    <circle cx="50" cy="14" r="0.8" fill="#F2F4F7" stroke="none" opacity="0.45"/>
  </g>

  <g id="40_DELIVERY_SLOT_LEFT" inkscape:groupmode="layer" inkscape:label="40_DELIVERY_SLOT_LEFT"
     fill="none" stroke="#F2F4F7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Direct / Projectile / Beam / Lob / Ground. -->
    <path d="M8 32 h7 m-3-3 3 3-3 3" opacity="0.45"/>
  </g>

  <g id="50_PRIMARY_EFFECT_CORE" inkscape:groupmode="layer" inkscape:label="50_PRIMARY_EFFECT_CORE"
     fill="none" stroke="#F2F4F7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main visual mass. Replace this placeholder with Damage / Shield / Heal / Push / etc. -->
    <path d="M32 21 l3 7 7 1-5 5 1 8-6-4-6 4 1-8-5-5 7-1z" opacity="0.42"/>
  </g>

  <g id="55_ELEMENT_OR_STATUS_ACCENT_OPTIONAL" inkscape:groupmode="layer" inkscape:label="55_ELEMENT_OR_STATUS_ACCENT_OPTIONAL"
     fill="none" stroke="#F2F4F7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
     style="display:none">
    <!-- Optional secondary semantic glyph, e.g. Water/Wet, Electric/Shock, Fire. -->
    <path d="M38 25 l-4 6 h4 l-4 7 9-9 h-4 l3-4z"/>
  </g>

  <g id="60_VALUE_RANGE_SLOT_RIGHT" inkscape:groupmode="layer" inkscape:label="60_VALUE_RANGE_SLOT_RIGHT"
     fill="none" stroke="#F2F4F7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Keep a value coupled to a symbol. This placeholder represents range/size, not bare text. -->
    <path d="M48 32 h8 m-3-3 3 3-3 3" opacity="0.45"/>
  </g>

  <g id="70_MODIFIER_SLOT_BOTTOM_LEFT" inkscape:groupmode="layer" inkscape:label="70_MODIFIER_SLOT_BOTTOM_LEFT"
     fill="none" stroke="#F2F4F7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pierce / Bounce / Ignore Cover / Armor Piercing / etc. -->
    <path d="M16 51 h8 m-2-2 2 2-2 2" opacity="0.45"/>
  </g>

  <g id="75_SECONDARY_EFFECT_SLOT_BOTTOM_RIGHT" inkscape:groupmode="layer" inkscape:label="75_SECONDARY_EFFECT_SLOT_BOTTOM_RIGHT"
     fill="none" stroke="#F2F4F7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Secondary effect / duration / contextual marker. -->
    <circle cx="44" cy="51" r="3.2" opacity="0.45"/>
    <path d="M44 47.8 v3.2 l2 1.4" opacity="0.45"/>
  </g>

  <g id="80_CERTAINTY_OVERLAY" inkscape:groupmode="layer" inkscape:label="80_CERTAINTY_OVERLAY"
     fill="none" stroke="#F2F4F7" stroke-width="1.4">
    <g id="CERTAINTY_CONFIRMED_SOLID" inkscape:label="CERTAINTY_CONFIRMED_SOLID">
      <!-- Default: frame itself is solid. -->
    </g>
    <g id="CERTAINTY_PREDICTED_DASHED" inkscape:label="CERTAINTY_PREDICTED_DASHED" style="display:none">
      <path d="M18 5 H46 L59 18 V46 L46 59 H18 L5 46 V18 Z" stroke-dasharray="4 3"/>
    </g>
    <g id="CERTAINTY_UNCERTAIN_DOTTED" inkscape:label="CERTAINTY_UNCERTAIN_DOTTED" style="display:none">
      <path d="M18 5 H46 L59 18 V46 L46 59 H18 L5 46 V18 Z" stroke-dasharray="1 3"/>
      <path d="M53 8 q4-4 7 0 q2 3-2 5 q-2 1-2 3" stroke-width="1.8"/>
      <circle cx="56" cy="20" r="1" fill="#F2F4F7" stroke="none"/>
    </g>
    <g id="CERTAINTY_INVALID_SLASH" inkscape:label="CERTAINTY_INVALID_SLASH" style="display:none">
      <path d="M10 54 L54 10" stroke-width="3"/>
    </g>
  </g>

  <g id="90_QA_SMALL_SIZE_GUIDE" inkscape:groupmode="layer" inkscape:label="90_QA_SMALL_SIZE_GUIDE" style="display:none">
    <!-- QA exports recommended: 64 / 48 / 32 px. Do not solve 32 px by only lowering opacity. -->
  </g>

  <g id="99_EXPORT_CLEANUP_NOTES" inkscape:groupmode="layer" inkscape:label="99_EXPORT_CLEANUP_NOTES" style="display:none">
    <!-- Before export: hide 00_GUIDES_DO_NOT_EXPORT and remove all unused placeholder groups. -->
    <!-- Keep phase/target/shape/effect information in independent groups whenever possible. -->
  </g>
</svg>
