<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500">
<title>RefactorTactics — Skill Card Legend Consolidata v0.2</title>
<desc>Legenda vettoriale per Affinity Designer consolidata da Icon Grammar e Skill Taxonomy.</desc>
<defs>
<style><![CDATA[
.bg{fill:#0b1016}
.panel{fill:#111821;stroke:#293645;stroke-width:2}
.grid{stroke:#38495a;stroke-width:1.6;stroke-dasharray:7 9;opacity:.55}
.shape{fill:#17212b;stroke:#dce7f1;stroke-width:4}
.shape2{fill:#17212b;stroke:#8ea5b8;stroke-width:3}
.core{fill:#122c37;stroke:#61d8ff;stroke-width:4}
.phase{fill:#24242c;stroke:#ffd166;stroke-width:4}
.call{stroke:#6f879b;stroke-width:2.2;fill:none}
.note{fill:#0f161e;stroke:#344656;stroke-width:2}
.h1{font-family:Inter,Arial,sans-serif;font-size:46px;font-weight:800;fill:#f7fbff}
.h2{font-family:Inter,Arial,sans-serif;font-size:25px;font-weight:800;fill:#f7fbff}
.body{font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:500;fill:#bdcbd8}
.small{font-family:Inter,Arial,sans-serif;font-size:15px;font-weight:500;fill:#91a5b7}
.mono{font-family:"JetBrains Mono",Consolas,monospace;font-size:16px;font-weight:500;fill:#dce7f1}
.center{text-anchor:middle}
.coretxt{font-family:Inter,Arial,sans-serif;font-size:30px;font-weight:900;fill:#f7fbff;text-anchor:middle}
.coresub{font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:600;fill:#bfd0dc;text-anchor:middle}
.warn{fill:#cfd9e2;font-family:Inter,Arial,sans-serif;font-size:15px;font-weight:600}
]]></style>
</defs>

<g id="BACKGROUND">
<rect class="bg" width="2400" height="1500"/>
<rect class="panel" x="34" y="30" width="2332" height="1440" rx="28"/>
</g>

<g id="HEADER">
<text class="h1" x="78" y="92">REFACTORTACTICS — SKILL CARD GRAMMAR · LEGENDA CONSOLIDATA v0.2</text>
<text class="body" x="80" y="128">Affinity SVG · flat-top hex · reticolo radiale 30° · grammatica compositiva ≠ catalogo runtime</text>
</g>

<g id="RADIAL_GRID">
<circle class="grid" cx="1200" cy="690" r="300"/>
<circle class="grid" cx="1200" cy="690" r="430"/>
<line class="grid" x1="730.0" y1="690.0" x2="1670.0" y2="690.0"/>
<line class="grid" x1="793.0" y1="455.0" x2="1607.0" y2="925.0"/>
<line class="grid" x1="965.0" y1="283.0" x2="1435.0" y2="1097.0"/>
<line class="grid" x1="1200.0" y1="220.0" x2="1200.0" y2="1160.0"/>
<line class="grid" x1="1435.0" y1="283.0" x2="965.0" y2="1097.0"/>
<line class="grid" x1="1607.0" y1="455.0" x2="793.0" y2="925.0"/>
</g>

<g id="CORE_PRIMARY_EFFECT">
<polygon class="core" points="1405.0,690.0 1302.5,867.5 1097.5,867.5 995.0,690.0 1097.5,512.5 1302.5,512.5"/>
<circle cx="1200" cy="670" r="34" fill="none" stroke="#61d8ff" stroke-width="4"/>
<path d="M1182 670 H1218 M1200 652 V688" stroke="#61d8ff" stroke-width="4"/>
<text class="coretxt" x="1200" y="752">CORE</text>
<text class="coresub" x="1200" y="780">PRIMARY EFFECT + VALUE</text>
</g>

<g id="PHASE_TIMING">
<path class="phase" d="M1080 330 L1320 330 L1370 378 L1320 426 L1080 426 L1030 378 Z"/>
<text class="h2 center" x="1200" y="386">PHASE</text>
</g>

<g id="COST_COOLDOWN_CHARGES">
<circle class="shape" cx="835" cy="430" r="70"/>
<text class="h2 center" x="835" y="438">COST</text>
</g>

<g id="INTRINSIC_HEX_TARGET">
<polygon class="shape" points="836.0,690.0 803.0,747.2 737.0,747.2 704.0,690.0 737.0,632.8 803.0,632.8"/>
<text class="small center" x="770" y="696">TARGET</text>
</g>

<g id="INTRINSIC_HEX_SHAPE">
<polygon class="shape" points="1696.0,690.0 1663.0,747.2 1597.0,747.2 1564.0,690.0 1597.0,632.8 1663.0,632.8"/>
<text class="small center" x="1630" y="696">SHAPE</text>
</g>

<g id="INTRINSIC_HEX_DELIVERY_NATURE">
<polygon class="shape" points="1584.0,466.0 1551.0,523.2 1485.0,523.2 1452.0,466.0 1485.0,408.8 1551.0,408.8"/>
<text class="small center" x="1518" y="459">DELIVERY</text>
<text class="small center" x="1518" y="480">/ NATURE</text>
</g>

<g id="CONDITION_TRIGGER_REQUIREMENT">
<path class="shape" d="M 820 932 L 900 1065 L 740 1065 Z"/>
<text class="small center" x="820" y="1022">IF / WHEN</text>
</g>

<g id="SKILL_MODIFIER_HIT_RULE">
<polygon class="shape" points="1200,1036.0 1290.0,1090 1200,1144.0 1110.0,1090"/>
<text class="small center" x="1200" y="1086">SKILL</text>
<text class="small center" x="1200" y="1107">MODIFIER</text>
</g>

<g id="CONTEXT_MODIFIERS">
<rect class="shape" x="1535" y="932" width="118" height="118" rx="10"/>
<rect class="shape" x="1665" y="1003" width="104" height="104" rx="10"/>
<text class="small center" x="1594" y="996">CTX</text>
<text class="small center" x="1717" y="1064">CTX</text>
</g>

<g id="CALLOUTS_LEFT">
<path class="call" d="M765 430 H500"/>
<text class="h2" x="75" y="365">CERCHIO — COST / COOLDOWN / CHARGES</text>
<text class="mono" x="75" y="398">AP · Energy · Health · Ammo · Charges</text>
<text class="mono" x="75" y="424">Cooldown N · Recharge N · Shared CD</text>
<text class="small" x="75" y="453">Max 1 · alto-sinistra · mai dentro il Core.</text>

<path class="call" d="M704 690 H500"/>
<text class="h2" x="75" y="610">PICCOLO ESAGONO — TARGET / RELATION</text>
<text class="mono" x="75" y="643">Self · Unit · Cell · Direction · Path</text>
<text class="mono" x="75" y="669">Unit → Ally · Enemy · Any</text>
<text class="small" x="75" y="698">Object/Structure/Objective/Hazard = estensioni, non locked v0.1.</text>

<path class="call" d="M775 1010 H500"/>
<text class="h2" x="75" y="922">TRIANGOLO — CONDITION / TRIGGER / REQUIREMENT</text>
<text class="mono" x="75" y="955">Target Wet · If Flanked · HP&lt;X% · On Hit</text>
<text class="mono" x="75" y="981">On Entry · Requires LoS · Empty Cell · Elevation</text>
<text class="small" x="75" y="1010">Max 1 · requisito/SE/QUANDO competitivo e immediato.</text>
</g>

<g id="CALLOUTS_RIGHT">
<path class="call" d="M1696 690 H1900"/>
<text class="h2" x="1925" y="567">PICCOLO ESAGONO — SHAPE / GEOMETRY</text>
<text class="mono" x="1925" y="600">Single · Line · Ray · Cone · Circle · Ring</text>
<text class="mono" x="1925" y="626">Cross · Arc · Rectangle · Wall · Chain</text>
<text class="mono" x="1925" y="652">ConnectedRegion</text>
<text class="small" x="1925" y="681">Shape ≠ Delivery · geometria prima di tutto.</text>

<path class="call" d="M1580 466 H1900"/>
<text class="h2" x="1925" y="347">PICCOLO ESAGONO — DELIVERY / NATURE</text>
<text class="mono" x="1925" y="380">Delivery: Direct · Projectile · Beam · Lob · Ground</text>
<text class="mono" x="1925" y="406">Nature: Kinetic · Fire · Electric</text>
<text class="mono" x="1925" y="432">Env: Water · Cold · Ice · Metal · Steam · Smoke</text>
<text class="small" x="1925" y="461">Mostrare solo se tatticamente discriminante.</text>

<path class="call" d="M1770 1055 H1900"/>
<text class="h2" x="1925" y="958">QUADRATO — CONTEXT MODIFIER</text>
<text class="mono" x="1925" y="991">Unit · Status · Talent · Cell · High Ground</text>
<text class="mono" x="1925" y="1017">Surface · Ally · Objective · Scenario Rule</text>
<text class="mono" x="1925" y="1043">es. Damage +5 · Range +1 · Cost -1</text>
<text class="small" x="1925" y="1072">Max 2 · esterni alla skill.</text>
</g>

<g id="CALLOUTS_TOP">
<path class="call" d="M1370 378 H1580 V240"/>
<text class="h2" x="1510" y="188">PHASE / TIMING</text>
<text class="mono" x="1510" y="220">Planning · Prep · Dash · Blast · Move · Cleanup</text>
<text class="small" x="1510" y="247">Timing qualifier: Immediate · Delayed · Persistent · Triggered…</text>
<text class="small" x="1510" y="272">Reaction NON è una macro-fase · Dodge è nella fase Dash.</text>
</g>

<g id="CALLOUTS_BOTTOM">
<path class="call" d="M1200 1144 V1210"/>
<text class="h2 center" x="1200" y="1250">ROMBO — SKILL MODIFIER / HIT RULE RILEVANTE</text>
<text class="mono center" x="1200" y="1280">Piercing · Chain N · Bounce · Ignore Cover · Stop on Blocker · Hits All</text>
<text class="mono center" x="1200" y="1306">Armor Piercing · Friendly Fire Possible · Stop on First Target</text>
<text class="small center" x="1200" y="1334">Max 1 · Hit Rule può essere mini-glyph o rombo se proprietà intrinseca della skill.</text>
</g>

<g id="CORE_CALLOUT">
<path class="call" d="M1200 485 V270 H790"/>
<text class="h2" x="75" y="184">CORE — PRIMARY EFFECT + VALORE</text>
<text class="mono" x="75" y="217">Damage · Heal · Shield · Armor · Push · Pull</text>
<text class="mono" x="75" y="243">Displace · Status · Control · Resource · Environment</text>
<text class="mono" x="75" y="269">Cover/Structure · Graph/Traversal · Utility</text>
<text class="small" x="75" y="298">Numero sempre contestualizzato: Damage 5, Heal +3, Push 2…</text>
</g>

<g id="QUANTIFIERS_STRIP">
<rect class="note" x="80" y="1365" width="1500" height="88" rx="16"/>
<text class="h2" x="105" y="1397">QUANTIFICATORI — BADGE / LABEL + NUMERO</text>
<text class="mono" x="105" y="1427">Range · Min/Max Range · Radius · Width · Length · Targets · Hits · Duration · Cooldown</text>
</g>

<g id="UI_STATES_STRIP">
<rect class="note" x="1605" y="1365" width="715" height="88" rx="16"/>
<text class="h2" x="1630" y="1397">STATO UI — FUORI DALLA GRAMMATICA CORE</text>
<text class="mono" x="1630" y="1427">Availability · Validity · Certainty · Knowledge</text>
</g>

<g id="READING_RULE">
<rect class="note" x="560" y="114" width="1260" height="90" rx="18"/>
<text class="h2 center" x="1190" y="147">LETTURA COMPLETA</text>
<text class="mono center" x="1190" y="178">PHASE → TARGET + SHAPE + DELIVERY + HIT RULE → EFFECT + VALUE → RANGE/SIZE/DURATION + MODIFIERS</text>
</g>

<g id="OPEN_POINTS">
<rect class="note" x="1870" y="1135" width="450" height="180" rx="16"/>
<text class="h2" x="1895" y="1170">OPEN POINTS — NON INVENTARE</text>
<text class="small" x="1895" y="1201">• palette HEX finale delle 6 fasi</text>
<text class="small" x="1895" y="1227">• marker geometrico finale delle fasi</text>
<text class="small" x="1895" y="1253">• slot canonici dei 1–3 piccoli esagoni</text>
<text class="small" x="1895" y="1279">• layout denso Range/Radius/Duration/Targets</text>
<text class="small" x="1895" y="1305">• mapping Hit Rule multiple → mini-glyph</text>
</g>

<g id="SEMANTIC_COLLISIONS">
<rect class="note" x="80" y="1088" width="420" height="235" rx="16"/>
<text class="h2" x="105" y="1122">COLLISIONI DA EVITARE</text>
<text class="small" x="105" y="1155">Piercing ≠ Armor Piercing ≠ Armor Shred</text>
<text class="small" x="105" y="1182">Electric possiede il fulmine · Reaction no</text>
<text class="small" x="105" y="1209">Shape ≠ Delivery</text>
<text class="small" x="105" y="1236">Damage Type ≠ Damage Source</text>
<text class="small" x="105" y="1263">Cover ≠ Guard ≠ Brace ≠ Shield</text>
<text class="small" x="105" y="1290">Numero senza simbolo/contesto = NO</text>
</g>

</svg>