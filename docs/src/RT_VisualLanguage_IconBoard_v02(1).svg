<rect width="2400" height="1800" fill="#0B1118"/><text x="70" y="78" class="title">RefactorTactics - Visual Skill Language v0.2</text><text x="70" y="112" class="small">Vector-safe edition: all semantic symbols are paths/shapes, not font glyphs.</text><text x="70" y="175" class="section">1. Phase markers</text><text x="70" y="200" class="small">Top marker = turn phase.</text><rect x="70" y="205" width="200" height="120" rx="18" class="card"/><use href="#i-dodge" x="138" y="223" width="64" height="64"/><text x="170" y="307" text-anchor="middle" class="label">DODGE</text><rect x="300" y="205" width="200" height="120" rx="18" class="card"/><use href="#i-blast" x="368" y="223" width="64" height="64"/><text x="400" y="307" text-anchor="middle" class="label">BLAST</text><rect x="530" y="205" width="200" height="120" rx="18" class="card"/><use href="#i-move" x="598" y="223" width="64" height="64"/><text x="630" y="307" text-anchor="middle" class="label">MOVE</text><rect x="760" y="205" width="200" height="120" rx="18" class="card"/><use href="#i-reaction" x="828" y="223" width="64" height="64"/><text x="860" y="307" text-anchor="middle" class="label">REACTION</text><text x="70" y="390" class="section">2. Target</text><text x="70" y="415" class="small">What the player selects.</text><rect x="70" y="420" width="200" height="150" rx="18" class="card"/><polygon points="199.4,461.0 199.4,495.0 170.0,512.0 140.6,495.0 140.6,461.0 170.0,444.0" fill="none" stroke="#E9EDF2" stroke-width="6"/><circle cx="170" cy="478" r="11" fill="#E9EDF2"/><text x="170" y="548" text-anchor="middle" class="label">SELF</text><rect x="300" y="420" width="200" height="150" rx="18" class="card"/><circle cx="400" cy="462" r="16" fill="#E9EDF2"/><path d="M 372 508 Q 400 473 428 508" fill="none" stroke="#E9EDF2" stroke-width="10" stroke-linecap="round"/><text x="400" y="548" text-anchor="middle" class="label">UNIT</text><rect x="530" y="420" width="200" height="150" rx="18" class="card"/><polygon points="659.4,461.0 659.4,495.0 630.0,512.0 600.6,495.0 600.6,461.0 630.0,444.0" fill="none" stroke="#E9EDF2" stroke-width="6"/><text x="630" y="548" text-anchor="middle" class="label">CELL</text><rect x="760" y="420" width="200" height="150" rx="18" class="card"/><path d="M 818 478 H 890 M 870 458 L 892 478 L 870 498" class="icon"/><text x="860" y="548" text-anchor="middle" class="label">DIRECTION</text><rect x="990" y="420" width="200" height="150" rx="18" class="card"/><path d="M 1046 500 C 1080 458,1094 506,1132 460" class="icon"/><path d="M 1118 458 L 1135 460 L 1128 475" class="icon"/><text x="1090" y="548" text-anchor="middle" class="label">PATH</text><text x="70" y="645" class="section">3. Shape / Area</text><text x="70" y="670" class="small">Geometry or connected graph region.</text><rect x="70" y="675" width="200" height="145" rx="18" class="card"/><circle cx="170" cy="730" r="18" fill="#E9EDF2"/><text x="170" y="797" text-anchor="middle" class="label">SINGLE</text><rect x="300" y="675" width="200" height="145" rx="18" class="card"/><path d="M 345 730 H 455" class="icon"/><text x="400" y="797" text-anchor="middle" class="label">LINE</text><rect x="530" y="675" width="200" height="145" rx="18" class="card"/><circle cx="575" cy="730" r="7" fill="#E9EDF2"/><path d="M 587 730 H 676 M 656 712 L 678 730 L 656 748" class="icon"/><text x="630" y="797" text-anchor="middle" class="label">RAY</text><rect x="760" y="675" width="200" height="145" rx="18" class="card"/><path d="M 812 730 L 910 690 M 812 730 L 910 770" class="icon"/><circle cx="812" cy="730" r="7" fill="#E9EDF2"/><text x="860" y="797" text-anchor="middle" class="label">CONE</text><rect x="990" y="675" width="200" height="145" rx="18" class="card"/><circle cx="1090" cy="730" r="40" class="icon"/><text x="1090" y="797" text-anchor="middle" class="label">CIRCLE</text><rect x="1220" y="675" width="200" height="145" rx="18" class="card"/><circle cx="1320" cy="730" r="42" class="icon"/><circle cx="1320" cy="730" r="19" class="icon"/><text x="1320" y="797" text-anchor="middle" class="label">RING</text><rect x="70" y="840" width="200" height="145" rx="18" class="card"/><path d="M 122 923 A 58 58 0 0 1 215 871" class="icon"/><text x="170" y="962" text-anchor="middle" class="label">ARC</text><rect x="300" y="840" width="200" height="145" rx="18" class="card"/><path d="M 352 895 H 448 M 400 847 V 943" class="icon"/><text x="400" y="962" text-anchor="middle" class="label">CROSS</text><rect x="530" y="840" width="200" height="145" rx="18" class="card"/><rect x="580" y="866" width="100" height="58" class="icon"/><text x="630" y="962" text-anchor="middle" class="label">RECTANGLE</text><rect x="760" y="840" width="200" height="145" rx="18" class="card"/><path d="M 802 920 V 870 H 840 V 920 H 880 V 870 H 918 V 920" class="icon"/><text x="860" y="962" text-anchor="middle" class="label">WALL</text><rect x="990" y="840" width="200" height="145" rx="18" class="card"/><path d="M 1056 895 H 1076 M 1104 895 H 1124" class="icon"/><circle cx="1042" cy="895" r="12" fill="#E9EDF2"/><circle cx="1090" cy="895" r="12" fill="#E9EDF2"/><circle cx="1138" cy="895" r="12" fill="#E9EDF2"/><text x="1090" y="962" text-anchor="middle" class="label">CHAIN</text><rect x="1220" y="840" width="200" height="145" rx="18" class="card"/><polygon points="1305.9,869.0 1305.9,885.0 1292.0,893.0 1278.1,885.0 1278.1,869.0 1292.0,861.0" fill="none" stroke="#E9EDF2" stroke-width="4"/><polygon points="1341.9,869.0 1341.9,885.0 1328.0,893.0 1314.1,885.0 1314.1,869.0 1328.0,861.0" fill="none" stroke="#E9EDF2" stroke-width="4"/><polygon points="1323.9,905.0 1323.9,921.0 1310.0,929.0 1296.1,921.0 1296.1,905.0 1310.0,897.0" fill="none" stroke="#E9EDF2" stroke-width="4"/><polygon points="1359.9,905.0 1359.9,921.0 1346.0,929.0 1332.1,921.0 1332.1,905.0 1346.0,897.0" fill="none" stroke="#E9EDF2" stroke-width="4"/><text x="1320" y="962" text-anchor="middle" class="label">CONNECTED</text><text x="1510" y="175" class="section">4. Delivery</text><text x="1510" y="200" class="small">How the attack/effect reaches the target.</text><rect x="1510" y="205" width="350" height="120" rx="18" class="card"/><path d="M 1547 255 H 1615 M 1595 237 L 1617 255 L 1595 273" class="icon"/><text x="1660" y="263" class="label">DIRECT</text><rect x="1900" y="205" width="350" height="120" rx="18" class="card"/><circle cx="1941" cy="255" r="7" fill="#E9EDF2"/><path d="M 1955 255 H 2003 M 1985 238 L 2005 255 L 1985 272" class="icon"/><text x="2050" y="263" class="label">PROJECTILE</text><rect x="1510" y="350" width="350" height="120" rx="18" class="card"/><path d="M 1545 392 H 1613 M 1545 408 H 1613 M 1594 382 L 1617 400 L 1594 418" class="icon"/><text x="1660" y="408" class="label">BEAM</text><rect x="1900" y="350" width="350" height="120" rx="18" class="card"/><path d="M 1935 420 Q 1975 356 2013 418" class="icon"/><circle cx="2013" cy="418" r="7" fill="#E9EDF2"/><text x="2050" y="408" class="label">LOB</text><rect x="1510" y="495" width="350" height="120" rx="18" class="card"/><path d="M 1540 559 Q 1560 531 1580 559 T 1620 559" class="icon"/><path d="M 1605 542 L 1623 559 L 1605 576" class="icon"/><text x="1660" y="553" class="label">GROUND</text><text x="1510" y="690" class="section">5. Effect families</text><text x="1510" y="715" class="small">Color is semantic; icon is mandatory.</text><rect x="1510" y="720" width="260" height="96" rx="18" class="card"/><use href="#i-damage" x="1532" y="738" width="56" height="56"/><text x="1606" y="775" class="label">DAMAGE</text><rect x="1795" y="720" width="260" height="96" rx="18" class="card"/><use href="#i-shield" x="1817" y="738" width="56" height="56"/><text x="1891" y="775" class="label">SHIELD</text><rect x="2080" y="720" width="260" height="96" rx="18" class="card"/><use href="#i-armor" x="2102" y="738" width="56" height="56"/><text x="2176" y="775" class="label">ARMOR</text><rect x="1510" y="840" width="260" height="96" rx="18" class="card"/><use href="#i-heal" x="1532" y="858" width="56" height="56"/><text x="1606" y="895" class="label">HEAL</text><rect x="1795" y="840" width="260" height="96" rx="18" class="card"/><use href="#i-push" x="1817" y="858" width="56" height="56"/><text x="1891" y="895" class="label">PUSH</text><rect x="2080" y="840" width="260" height="96" rx="18" class="card"/><use href="#i-pull" x="2102" y="858" width="56" height="56"/><text x="2176" y="895" class="label">PULL</text><rect x="1510" y="960" width="260" height="96" rx="18" class="card"/><use href="#i-water" x="1532" y="978" width="56" height="56"/><text x="1606" y="1015" class="label">WATER</text><rect x="1795" y="960" width="260" height="96" rx="18" class="card"/><use href="#i-electric" x="1817" y="978" width="56" height="56"/><text x="1891" y="1015" class="label">ELECTRIC</text><rect x="2080" y="960" width="260" height="96" rx="18" class="card"/><use href="#i-fire" x="2102" y="978" width="56" height="56"/><text x="2176" y="1015" class="label">FIRE</text><rect x="1510" y="1080" width="260" height="96" rx="18" class="card"/><use href="#i-status" x="1532" y="1098" width="56" height="56"/><text x="1606" y="1135" class="label">STATUS</text><rect x="1795" y="1080" width="260" height="96" rx="18" class="card"/><use href="#i-utility" x="1817" y="1098" width="56" height="56"/><text x="1891" y="1135" class="label">UTILITY</text><text x="70" y="1080" class="section">6. Numeric satellites</text><text x="70" y="1105" class="small">Every value is paired with a vector symbol.</text><rect x="70" y="1110" width="300" height="100" rx="18" class="card"/><use href="#i-range" x="92" y="1130" width="58" height="58"/><text x="162" y="1173" class="value">6</text><text x="245" y="1168" class="label">RANGE</text><rect x="400" y="1110" width="300" height="100" rx="18" class="card"/><use href="#i-radius" x="422" y="1130" width="58" height="58"/><text x="492" y="1173" class="value">2</text><text x="575" y="1168" class="label">RADIUS</text><rect x="730" y="1110" width="300" height="100" rx="18" class="card"/><use href="#i-push" x="752" y="1130" width="58" height="58"/><text x="822" y="1173" class="value">3</text><text x="905" y="1168" class="label">PUSH</text><rect x="1060" y="1110" width="300" height="100" rx="18" class="card"/><use href="#i-duration" x="1082" y="1130" width="58" height="58"/><text x="1152" y="1173" class="value">2</text><text x="1235" y="1168" class="label">DURATION</text><rect x="70" y="1235" width="300" height="100" rx="18" class="card"/><use href="#i-targets" x="92" y="1255" width="58" height="58"/><text x="162" y="1298" class="value">3</text><text x="245" y="1293" class="label">TARGETS</text><rect x="400" y="1235" width="300" height="100" rx="18" class="card"/><use href="#i-cooldown" x="422" y="1255" width="58" height="58"/><text x="492" y="1298" class="value">4</text><text x="575" y="1293" class="label">COOLDOWN</text><rect x="730" y="1235" width="300" height="100" rx="18" class="card"/><use href="#i-armor" x="752" y="1255" width="58" height="58"/><text x="822" y="1298" class="value">-2</text><text x="905" y="1293" class="label">ARMOR SHRED</text><rect x="1060" y="1235" width="300" height="100" rx="18" class="card"/><use href="#i-shield" x="1082" y="1255" width="58" height="58"/><text x="1152" y="1298" class="value">+4</text><text x="1235" y="1293" class="label">SHIELD</text><text x="70" y="1380" class="section">7. Modifiers</text><rect x="70" y="1410" width="200" height="110" rx="18" class="card"/><use href="#m-pierce" x="110" y="1425" width="120" height="60"/><text x="170" y="1503" text-anchor="middle" class="small">PIERCE</text><rect x="290" y="1410" width="200" height="110" rx="18" class="card"/><use href="#m-stop" x="330" y="1425" width="120" height="60"/><text x="390" y="1503" text-anchor="middle" class="small">STOP FIRST</text><rect x="510" y="1410" width="200" height="110" rx="18" class="card"/><use href="#m-hitall" x="550" y="1425" width="120" height="60"/><text x="610" y="1503" text-anchor="middle" class="small">HIT ALL</text><rect x="730" y="1410" width="200" height="110" rx="18" class="card"/><use href="#m-bounce" x="770" y="1425" width="120" height="60"/><text x="830" y="1503" text-anchor="middle" class="small">BOUNCE</text><rect x="950" y="1410" width="200" height="110" rx="18" class="card"/><use href="#m-ignorecover" x="990" y="1425" width="120" height="60"/><text x="1050" y="1503" text-anchor="middle" class="small">IGNORE COVER</text><rect x="1170" y="1410" width="200" height="110" rx="18" class="card"/><use href="#m-friendly" x="1210" y="1425" width="120" height="60"/><text x="1270" y="1503" text-anchor="middle" class="small">FRIENDLY FIRE</text><text x="1510" y="1230" class="section">8. Skill examples</text><text x="1510" y="1255" class="small">Complete combinations.</text><rect x="1510" y="1260" width="350" height="195" rx="22" fill="#162231" stroke="#5EC8FF" stroke-width="4"/><text x="1532" y="1292" class="label">BARRIER</text><use href="#i-blast" x="1805" y="1270" width="38" height="38"/><use href="#i-shield" x="1582" y="1320" width="66" height="66"/><text x="1685" y="1372" text-anchor="middle" style="font:900 56px Arial;fill:white">+4</text><text x="1685" y="1408" text-anchor="middle" class="small">UNIT / ALLY</text><text x="1685" y="1434" text-anchor="middle" class="small">DURATION 1</text><rect x="1900" y="1260" width="350" height="195" rx="22" fill="#162231" stroke="#FF5E57" stroke-width="4"/><text x="1922" y="1292" class="label">RAIL SHOT</text><use href="#i-blast" x="2195" y="1270" width="38" height="38"/><use href="#i-damage" x="1972" y="1320" width="66" height="66"/><text x="2075" y="1372" text-anchor="middle" style="font:900 56px Arial;fill:white">5</text><text x="2075" y="1408" text-anchor="middle" class="small">LINE / BEAM</text><text x="2075" y="1434" text-anchor="middle" class="small">PIERCE / RANGE 7</text><rect x="1510" y="1485" width="350" height="195" rx="22" fill="#162231" stroke="#FF5E57" stroke-width="4"/><text x="1532" y="1517" class="label">INCENDIARY</text><use href="#i-blast" x="1805" y="1495" width="38" height="38"/><use href="#i-damage" x="1582" y="1545" width="66" height="66"/><text x="1685" y="1597" text-anchor="middle" style="font:900 56px Arial;fill:white">3</text><text x="1685" y="1633" text-anchor="middle" class="small">CELL / CIRCLE 2 / LOB</text><text x="1685" y="1659" text-anchor="middle" class="small">FIRE 2 / RANGE 5</text><rect x="1900" y="1485" width="350" height="195" rx="22" fill="#162231" stroke="#5EC8FF" stroke-width="4"/><text x="1922" y="1517" class="label">BRACE</text><use href="#i-dodge" x="2195" y="1495" width="38" height="38"/><use href="#i-shield" x="1972" y="1545" width="66" height="66"/><text x="2075" y="1597" text-anchor="middle" style="font:900 56px Arial;fill:white">+6</text><text x="2075" y="1633" text-anchor="middle" class="small">SELF</text><text x="2075" y="1659" text-anchor="middle" class="small">DURATION 1</text></svg>