schema_version: 1
status: PROPOSED
note: Bozza per consolidamento. Non sostituisce fonti canoniche esistenti finche'
  non mergiata dopo audit.
execution_lanes:
- id: code
  title: CODE
  actor_default: agent_or_developer
  description: 'Lavoro eseguibile sul repository: C++, Python, dati, UI, test, documentazione
    tecnica.'
- id: pie
  title: PIE
  actor_default: user
  description: Lavoro che richiede Unreal Editor/PIE e un verdetto umano o un artefatto
    editoriale.
- id: asset
  title: ASSET
  actor_default: user
  description: Download, Migrate/import, configurazione e verifica di asset esterni.
domain_groups:
- id: core_simulation
  title: Core & Simulation
  order: 10
  feature_areas:
  - Core
- id: map_environment
  title: Map & Environment
  order: 20
  feature_areas:
  - Map
  - Environment
- id: actions_reactions
  title: Actions & Reactions
  order: 30
  feature_areas:
  - Actions
  - Reactions
- id: perception_network
  title: Perception & Networking
  order: 40
  feature_areas:
  - Perception
  - Networking
- id: characters_content
  title: Characters & Content
  order: 50
  feature_areas:
  - Characters
  - Factions
- id: objectives_match
  title: Objectives & Match
  order: 60
  feature_areas:
  - Objectives
  - Match
- id: ui_presentation
  title: UI & Presentation
  order: 70
  feature_areas:
  - UI
  - Presentation
- id: ai_bots
  title: AI & Bots
  order: 80
  feature_areas:
  - AI
  - Bot
- id: tooling_data_qa
  title: Tooling, Data, QA & Release
  order: 90
  feature_areas:
  - Tooling
  - Data
  - QA
  - Release
relation_types:
  hard:
  - requires
  - requires_capability
  soft:
  - follows
  - related
  partial:
  - partial_block
  evidence:
  - implements
  - verifies
  - provides
  - contributes_to_gate
legacy_lane_mapping:
- legacy: Spatial / Map
  maps_to:
  - execution_lane: code
    domain_group: map_environment
- legacy: Simulation / Turn
  maps_to:
  - execution_lane: code
    domain_group: core_simulation
  - execution_lane: code
    domain_group: actions_reactions
- legacy: Client / UX
  maps_to:
  - execution_lane: code
    domain_group: ui_presentation
- legacy: Editor / Tooling
  maps_to:
  - execution_lane: code
    domain_group: tooling_data_qa
  - execution_lane: pie
    domain_group: tooling_data_qa
- legacy: Replay / Audit
  maps_to:
  - execution_lane: code
    domain_group: core_simulation
  - execution_lane: code
    domain_group: tooling_data_qa
- legacy: Character
  maps_to:
  - execution_lane: code
    domain_group: characters_content
  - execution_lane: pie
    domain_group: characters_content
  - execution_lane: asset
    domain_group: characters_content
- legacy: VFX / AssetFab
  maps_to:
  - execution_lane: asset
    domain_group: ui_presentation
  - execution_lane: asset
    domain_group: characters_content
  - execution_lane: code
    domain_group: ui_presentation
