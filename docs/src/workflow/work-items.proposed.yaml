# Regole schema:
#
# - `id`: stabile nel graph source.
# - `issue`: riferimento operativo; lo stato viene da GitHub, non dal YAML.
# - `features`: Feature ID esistenti nel registry.
# - `execution_lane`: code | pie | asset.
# - `domain_group`: uno dei gruppi definiti da workstreams.yaml.
# - `requires`: dipendenze hard work-item -> work-item.
# - `requires_capabilities`: evita dipendenze artificialmente rigide verso intere epic.
# - `provides_capabilities`: capability prodotte da questo lavoro.
# - `follows`: ordine raccomandato, non blocker.
#
# NON aggiungere:
# - status manuale;
# - percentuali;
# - titolo feature duplicato;
# - stato issue duplicato;
# - gate release duplicato.
