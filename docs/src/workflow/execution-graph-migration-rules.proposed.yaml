# Execution graph migration rules — PROPOSED

schema_version: 1
status: PROPOSED

discovery:
  features:
    source: docs/roadmap/feature-registry.yaml
    key: feature_id

  epics_v01:
    source: docs/roadmap/roadmap-v0.1.md
    range: E1-E21

  epics_post_v01:
    source: docs/roadmap/roadmap-post-v0.1.md
    releases:
      v0.2: [E22, E23, E24, E25, E26, E35, E36, E38, E39]
      v0.3: [E27, E28, E29, E33]
      v0.4: [E30, E31, E32, E34]

  editor_sessions:
    source: docs/roadmap/editor-sessions.yaml

  pie:
    source: docs/technical/test-manuali-pie.md

  scenarios:
    source: Scenarios/

derivable_relations:
  - release_contains_feature
  - release_contains_epic
  - epic_contains_checkpoint
  - feature_tracked_by_roadmap
  - feature_linked_issue
  - feature_verified_by_scenario
  - feature_verified_by_pie
  - session_verifies_pie
  - session_unblocked_by
  - session_unblocks

non_derivable_relations_live_in_execution_graph:
  hard:
    - requires
    - requires_capability
  soft:
    - follows
    - related
    - extends
  trace:
    - implements
    - verifies
    - provides
    - contributes_to_gate

forbidden_in_source:
  - status
  - readiness
  - blocks
  - junction
  - progress_percentage

derived:
  - blocks
  - incoming
  - outgoing
  - junction
  - readiness
  - project_stats

execution_lane_defaults:
  issue: code
  checkpoint: code
  session: pie

session_overrides_initial:
  U7: asset
  U8: asset
  U9: pie

completeness_gates:
  v0.1:
    enabled_after_migration: true
    require:
      - all_release_features_reachable
      - all_epics_present
      - all_checkpoints_present
      - all_declared_scenarios_present_or_planned
      - all_declared_pie_refs_resolvable
      - all_editor_sessions_resolvable
      - no_hard_cycles

  v0.2:
    enabled_after_migration: true
    require:
      - all_canonical_epics_present
      - all_existing_v02_features_reachable
      - no_hard_cycles

  v0.3:
    enabled_after_release_realignment: true

  v0.4:
    enabled_after_release_realignment: true
