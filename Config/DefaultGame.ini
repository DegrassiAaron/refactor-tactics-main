[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=RefactorTactics
Description=Gioco tattico a turni simultanei — progetto didattico Unreal Engine
; La versione che il Main Menu mostra a schermo (CP 46.3, #938: «version/build label leggibile»). Sta qui e
; non in una costante C++ perche' una label letterale resta identica dopo il bump: l'unico segnale che
; qualcosa non torna arriverebbe da chi segnala un difetto su una build che crede di essere un'altra.
; ⚠️ Senza questa riga UE risponde `1.0.0.0` di default — cioe' un numero plausibile e sbagliato, non un
; vuoto che si nota. `RefactorTactics.Frontend.MainMenuVersionLabelCarriesProjectVersion` la esige.
ProjectVersion=0.1.0

; ─── Le schermate del frontend (CP 46.3, #938) ──────────────────────────────────────────────────────
;
; Il navigatore (`URTFrontendNavigator`) legge queste righe in `RegisterScreensFromConfig` e le trasforma
; in binding nome -> widget. Stanno in configurazione e non in C++ perche' il lato destro e' un percorso
; d'asset: metterlo nel codice legherebbe una ricompilazione a ogni spostamento di `.uasset`.
;
; ⚠️ **`ScreenId` e' testo, e nessun compilatore lo confronta con `RTScreenIds::Main`.** E' l'unico punto
; in cui un refuso qui non produce un errore ma una schermata che non disegna niente, ed e' la ragione per
; cui `RTFrontendMainMenuTests.cpp` verifica che `StartFrontend` trovi davvero `Main` e `Settings` fra le
; registrate: e' li' che i due mondi si toccano.
;
; ✅ **I due `.uasset` nominati qui ESISTONO dal 2026-08-22** (`WBP_RT_MainMenu`, `WBP_RT_SettingsPanel`,
; seduta U28 / #1275), quindi il **caricamento riesce**.
; ⚠️ Questo commento diceva «non esistono ancora» fino al 2026-08-23 (#1277): chi lo leggeva ne deduceva
; che una schermata bianca fosse il comportamento atteso, e non lo e' piu'.
;
; ⛔ **Cio' che e' provato e' il CARICAMENTO, non il disegno.** `RefactorTactics.Frontend.*` verifica che
; ogni voce qui sotto risolva e costruisca il widget (`EveryConfiguredScreenLoads`); che finisca davvero a
; schermo non lo puo' stabilire, perche' la `UGameInstance` dei test non ha un `WorldContext` e
; `AddToViewport` non mette nulla in viewport. La verifica a schermo e' d'editor, e la sua voce PIE non
; esiste ancora.
;
; ⚠️ E un refuso in queste righe **non** produce un fallimento da solo: il warning «non si carica» e' un
; `Warning`, e in automation non fa cadere una run. A coglierlo e' l'asserzione sul widget vivo — misurato,
; perche' senza di essa un path storpiato lasciava la suite 45/45 verde.
;
; Resta vero il resto: un `TSoftClassPtr` e' un percorso, la registrazione riesce anche senza l'asset, e
; `RTFrontendNavigator.h` chiama «una schermata senza binding non e' un errore di navigazione» — ma quel
; caso ora e' un difetto da correggere, non lo stato normale.
[/Script/RefactorTactics.RTFrontendNavigator]
+Screens=(ScreenId="Main",WidgetClass="/Game/RT/UI/Framework/WBP_RT_MainMenu.WBP_RT_MainMenu_C")
+Screens=(ScreenId="Settings",WidgetClass="/Game/RT/UI/Framework/WBP_RT_SettingsPanel.WBP_RT_SettingsPanel_C")
; 🔴 **Il modale d'errore ha un binding, e senza sarebbe un SOFT-LOCK.** `ShowModal` lo mette nello stack e
; `SyncPresentation` disabilita la schermata sotto: senza questa riga il menu resta a schermo grigio e non
; cliccabile, con nessun modale visibile e nessun BACK raggiungibile. Trovato in code review su #939 —
; peggio del ritorno silenzioso che quel lavoro voleva impedire.
+Screens=(ScreenId="Error",WidgetClass="/Game/RT/UI/Framework/WBP_RT_ErrorModal.WBP_RT_ErrorModal_C")
; ⛔ **La voce `Pause` di CP 46.6 NON sta qui, e l'assenza e' deliberata.** `WBP_RT_PauseMenu` e' la seduta
; d'editor `U30`, il cui `done_when` chiede l'asset **con la sua voce in `DefaultGame.ini`**: scriverla ora
; farebbe fallire `RefactorTactics.Frontend.EveryConfiguredScreenLoads`, che esige che OGNI riga qui sopra
; punti a un widget che carica davvero. Il C++ di `#941` non ne ha bisogno — una schermata senza binding
; naviga lo stesso (`RTFrontendNavigator.h`), e `ESC` apre la pausa anche prima che ci sia da disegnarla.

; ⛔ **Anche `MatchHudWidgetClass` di CP 11.7 (#613) NON sta ancora qui, e per la stessa disciplina.**
; Il HUD tattico e' l'unica riga di questa sezione che NON e' un `+Screens=`: e' il layer sotto le
; schermate, presentato da `EnterMatch` e non dallo stack — «nessun widget» resta la definizione di
; `RTScreenIds::Match`, e dargli un binding rimetterebbe qualcosa sopra il gioco a ogni `RESUME`.
;
; ⚠️ **Proprio perche' non e' un `+Screens=`, `EveryConfiguredScreenLoads` non lo vedrebbe**: quel test
; itera `GetRegisteredScreenIds()`. Un refuso nel percorso non farebbe fallire nulla — produrrebbe solo la
; warning che `PresentMatchHud` logga a runtime. E' la ragione in piu' per scrivere la riga **insieme**
; all'asset, invece che prima:
;
; ✅ **L'asset esiste dal 2026-08-26**, quindi la riga e' dichiarata.
MatchHudWidgetClass="/Game/RT/UI/Match/WBP_RT_TacticalHUD.WBP_RT_TacticalHUD_C"

; Il livello che `PLAY` apre (CP 46.4, #939).
;
; ⚠️ **Sta qui e non in `DefaultEngine.ini`**: `GameDefaultMap` dichiara da dove il PACCHETTO avvia — il
; menu — e non quale partita il menu apre. Erano due dati diversi, e finche' non si e' scritta questa riga
; il secondo non esisteva affatto: nessuna config nominava la mappa del vertical slice.
;
; ⛔ Un refuso qui **non** e' silenzioso: `StartMatch` rifiuta l'avvio con il modale d'errore e la causa.
; E' il primo punto del DoD di #939, ed e' scritto cosi' perche' il progetto ha gia' la famiglia di difetti
; che il silenzio produce.
MatchLevel=/Game/RT/Maps/Dev/L_HexArena/L_HexArena

; Il livello che `RETURN TO MAIN MENU` apre (CP 46.6, #941).
;
; ⛔ **Non si legge `GameDefaultMap`**, benche' oggi punti allo stesso `.umap`. Quella chiave sta in
; `[/Script/EngineSettings.GameMapsSettings]` di `DefaultEngine.ini` e dichiara **da dove il pacchetto
; avvia**: far dipendere una transizione di gioco da un'impostazione di packaging le farebbe divergere il
; primo giorno in cui una build di test avvia altrove. E' la stessa separazione gia' scelta per
; `MatchLevel`, applicata all'altro verso del ciclo.
;
; ⛔ Un refuso qui **non** e' silenzioso: `RequestReturnToMainMenu` rifiuta con il modale d'errore e la
; causa (`FrontendLevelUnset`). Senza, il pulsante non farebbe niente — il soft-lock che CP 46.1 vieta,
; con l'aggravante che il giocatore crede di aver lasciato la partita.
FrontendLevel=/Game/RT/Maps/Shared/L_Frontend/L_Frontend

[/Script/UnrealEd.ProjectPackagingSettings]
; I materiali del progetto sono referenziati SOLO via TSoftObjectPtr (colore-team, anelli): senza questa
; direttiva il cook non li include, e nella build packaged le unita' restano grigie senza colore di squadra.
; Scoperto al CP 7.4 avviando la build impacchettata: il warning «Materiale del tint assente» compariva solo li'.
+DirectoriesToAlwaysCook=(Path="/Game/RT")

; ⛔ **E questa riga la RESTRINGE, perche' `/Game/RT` copre anche gli strumenti d'authoring.**
; `D-280` istituisce `/Game/RT/Editor/` come namespace degli strumenti solo-Editor, e il suo punto 2 dice
; che **la cartella e' organizzazione, non una garanzia di packaging**. (#1804)
;
; 🔴 **ATTENZIONE a cosa questa riga fa DAVVERO oggi, misurato su pacchetti veri il 2026-09-03**
; (#1804). Questo commento diceva: *"senza questa riga il `DirectoriesToAlwaysCook` qui sopra li
; includerebbe tutti nel pacchetto"*. **E' FALSO per gli strumenti che esistono adesso.** Cotto due volte
; con `BuildCookRun`, una con questa riga e una senza, i due container sono risultati **identici**: stessi
; 697 `.uasset`, `diff` sui percorsi vuoto. `WBP_RT_ScenarioComposer` e `WBP_RT_GrayKitPlayground` sono
; `EditorUtilityWidget`, quindi editor-only, e il cook li scarta **per classe** prima che una directory
; conti qualcosa: `LogCook: SkipOnlyEditorOnly is enabled`. Nessuno li referenzia (`get_referencers` = []),
; quindi non entrano nemmeno trascinati.
;
; ✅ **La riga non e' inutile, ed e' stato misurato anche questo.** Il meccanismo funziona e batte
; `DirectoriesToAlwaysCook` su una sottodirectory: aggiungendo un never-cook di CONTROLLO su
; `/Game/RT/UI/Icons` e ricuocendo, i 62 package delle icone **spariscono** (`Content/RT/` da 112 a 50).
; Senza quel controllo "non cambia nulla" sarebbe indistinguibile da "il cook non e' ripartito".
; ∴ **Questa riga e' la garanzia della FAMIGLIA, non di questi due asset**: una texture, una mesh o un
; data asset sotto `/Game/RT/Editor/` NON sono editor-only, `AlwaysCook` li includerebbe, e allora sara'
; solo questa riga a escluderli. ⛔ Chi la togliesse vedendo che "non cambia niente" starebbe misurando
; il caso in cui e' ridondante e concludendo per quello in cui non lo e'.
;
; ⚠️ **La meccanica delle MAPPE non si applica agli asset, e confonderle e' l'errore facile.** Una mappa e'
; esclusa per ASSENZA da `MapsToCook` (vedi il commento su `L_GrayKitPlayground` piu' sotto); un `.uasset`
; sotto `/Game/RT` e' incluso per PRESENZA della regola qui sopra. Sono due meccaniche opposte.
;
; 🔑 **Misurato nel sorgente del motore, non dedotto**: `UCookOnTheFlyServer::GetNeverCookPackageNames`
; (`CookOnTheFlyServer.cpp:12463`) legge `PackagingSettings->DirectoriesToNeverCook` e ne fa un filtro sui
; package. ⚠️ **Solo dentro `IsDirectorCookByTheBook()`** — cioe' la via di `BuildCookRun`, che e' quella
; che produce i pacchetti. In cook-on-the-fly la riga non ha effetto, e non deve averne.
;
; 🔴 **E' una FAMIGLIA APERTA: tutto cio' che finira' sotto `/Game/RT/Editor/` sara' escluso, per sempre e
; in silenzio.** E' lo scopo del namespace, ma chi ci mettesse un asset necessario a runtime non riceverebbe
; nessun avviso — sparirebbe solo dal pacchetto. Se serve a runtime, non va li'.
; ✅ **Dal 2026-09-03 questa avvertenza non e' piu' sola** (#2150): l'altra via d'ingresso — un asset di
; fuori che ne referenzia uno di dentro, e cosi' lo trascina nel cook — e' presidiata da
; `RefactorTactics.Packaging.NoReferencesIntoEditorNamespace`. ⛔ Quel gate NON copre i riferimenti scritti
; in C++ o in un `.ini`: quelli restano prosa, e il 2026-09-03 erano zero (`git grep "/Game/RT/Editor"`).
+DirectoriesToNeverCook=(Path="/Game/RT/Editor")

; ⛔ **La mappa di partita va elencata QUI, e `DirectoriesToAlwaysCook` non la copre.** Misurato il
; 2026-08-29 su un pacchetto vero: `UnrealPak -List` sul container mostrava **due soli `.umap`** —
; `Engine/Content/Maps/Entry` e `L_Frontend` — e di `L_HexArena` c'era il solo `Data/DA_HexMap_Arena.uasset`,
; cotto perche' referenziato da un asset. Premendo Play il gioco impacchettato rispondeva:
;
;   LogStreaming: Warning: LoadPackage: SkipPackage: /Game/RT/Maps/Dev/L_HexArena/L_HexArena
;                 - The package to load does not exist on disk or in the loader
;   LogNet: Warning: Travel Failure: [ClientTravelFailure]
;
; e tornava al frontend. **In PIE non si vede**: li' la mappa e' sul disco e il travel riesce sempre.
;
; ⚠️ **La riga sopra non basta perche' il cook segue i RIFERIMENTI, e qui non ce n'e' nessuno da seguire.**
; `MatchLevel` (§`[/Script/RefactorTactics.RTFrontendSettings]`) e' una **stringa** risolta a runtime: nessun
; `TSoftObjectPtr`, nessuna dipendenza nell'asset registry, quindi niente che leghi `L_Frontend` alla mappa
; che apre. `DirectoriesToAlwaysCook` ha salvato i materiali del CP 7.4 — che sono asset — ma una mappa entra
; nel cook solo se e' la `GameDefaultMap`, se e' referenziata, o se e' elencata qui.
;
; 🔑 **Oracolo, e non e' il log di packaging**: quello esce `BUILD SUCCESSFUL` in entrambi i casi e non nomina
; nessuna mappa. Si guarda il container:
;   UnrealPak.exe <...>/RefactorTactics-Windows.utoc -List | findstr ".umap"
; ⚠️ E **non** basta cercare `L_HexArena` nel `.utoc`: quella stringa e' presente comunque, perche' e' il path
; della cartella `Data/`. Cercare il nome trova un riferimento; cercare il `.umap` trova la mappa.
+MapsToCook=(FilePath="/Game/RT/Maps/Dev/L_HexArena/L_HexArena")

; ⛔ **L_GrayKitPlayground NON va elencata qui, ed e' la sua esclusione dal cook.**
; E' la scena del Gray Kit Playground (#1990, #1991, D-304): un laboratorio editor-only dove si
; guarda la grammatica visuale. In un pacchetto non ha niente da fare.
;
; 🔑 **L'esclusione e' l'ASSENZA da questa lista piu' l'assenza di riferimenti**, esattamente come il
; commento qui sopra dichiara per L_HexArena al contrario. Per una MAPPA basta questo: non serve un
; `DirectoriesToNeverCook`, e non basterebbe comunque il percorso, perche'
; `DirectoriesToAlwaysCook=(Path="/Game/RT")` copre tutto /Game/RT (D-280 punto 2: la cartella e'
; organizzazione, non una garanzia di packaging).
; ⚠️ **Aggiornato il 2026-09-02 (#1804)**: questo commento diceva anche che `DirectoriesToNeverCook` «in
; questo progetto non esiste, misurato: git grep da' 0». **Ora esiste**, in cima a questa sezione, e serve
; per gli ASSET d'authoring — che hanno la meccanica opposta a quella delle mappe. La frase valeva finche'
; l'unico oggetto da escludere era una `.umap`.
;
; ✅ **PROVATO su un pacchetto vero il 2026-09-01**, con l'oracolo che questo file gia' prescrive:
;   RunUAT.bat BuildCookRun -project=<uproject> -noP4 -platform=Win64 -clientconfig=Development ;     -cook -build -stage -pak -archive -archivedirectory=<dir>/Packaged -utf8output
;   UnrealPak.exe <...>/RefactorTactics-Windows.utoc -List | findstr ".umap"
;
; Il container porta TRE .umap e nessuno e' il Playground:
;   Content/RT/Maps/Dev/L_HexArena/L_HexArena.umap      (elencata qui sopra)
;   Engine/Content/Maps/Entry.umap                      (default del motore)
;   Content/RT/Maps/Shared/L_Frontend/L_Frontend.umap   (GameDefaultMap)
;
; 🔴 **E lo zero e' stato validato per MUTAZIONE, non letto e basta**: aggiungendo qui la riga
; `+MapsToCook=(FilePath=".../L_GrayKitPlayground/L_GrayKitPlayground")` e ricuocendo, la mappa
; COMPARE nel container; togliendola e ricuocendo, sparisce. Senza quel giro un conteggio a zero
; poteva significare «l'oracolo non sa guardare» invece di «la mappa non c'e'».
; ⚠️ Nella stessa misura il container porta 108 asset di Content/RT/: il cook ha lavorato su quella
; cartella, quindi lo zero non e' per un cook che non e' mai partito.
;
; ⚠️ Chi aggiunge una riga qui per il Playground rompe quella prova, e nessun test se ne accorge:
; questo commento e' il solo presidio, come lo e' per la riga sopra.

; Gli scenari sono file `.json` FUORI da `Content/`: il cook non li vede e senza questa riga lo staging non
; li copia. Misurato il 2026-08-16 su un pacchetto vero — l'indice diceva «0 scenari sotto
; ../../../RefactorTactics/Scenarios» e l'auto-run falliva prima di partire (#926). Non era una regressione:
; non era mai stato configurato, perche' fino a quel giorno nessuno aveva eseguito uno scenario da un
; pacchetto. UFS e non NonUFS: il runner li legge con il file system virtuale, come ogni altro asset.
; ⚠️ Il path e' relativo a `Content/`, NON alla radice del progetto, e da qui il `../`: UAT fa
; `Combine(ProjectContentRoot, RelativePath)` (`CopyBuildToStagingDirectory.Automation.cs`, «these dirs are
; relative to the game content directory»). Scritto `Scenarios` cerca `Content/Scenarios`, non lo trova, e
; **stagea zero file lasciando la build SUCCESSFUL**: l'unico segnale e' un warning nel log della cottura.
+DirectoriesToAlwaysStageAsUFS=(Path="../Scenarios")

; ─── Asset Manager: la regola per `GameFeatureData` (Load Errors, 2026-08-28) ────────────────────────
;
; ⛔ **Senza questa riga ogni avvio dell'editor apre il Message Log con un errore**: «Asset Manager
; settings do not include an entry for assets of type GameFeatureData, which is required for game feature
; plugins to function». Non e' un avviso cosmetico di una feature che non usiamo: e' rumore permanente in
; `LoadErrors`, la stessa casella dove atterrano gli errori di caricamento veri, e chi la apre per un
; difetto d'asset trova prima questo.
;
; ⚠️ **Il progetto non dichiara nessun Game Feature, e la riga serve lo stesso.** Il plugin `GameFeatures`
; e' montato comunque all'avvio (log: «Mounting Engine plugin GameFeatures») perche' lo tira dentro
; `AllToolsets` -> `GameFeaturesToolset`, abilitati in `RefactorTactics.uproject`. Il sottosistema si
; inizializza e il controllo scatta a prescindere dai contenuti del gioco: lo fanno DUE punti diversi,
; `UGameFeaturesSubsystem::OnAssetManagerCreated` (che logga in `LogGameFeatures`) e
; `FGameFeaturesEditorModule::OnAssetManagerCreated` (che scrive in `LoadErrors`), con la stessa
; condizione — `UAssetManager::GetPrimaryAssetRules(GameFeatureData)` che torna il default. Una sola voce
; qui li spegne entrambi.
;
; ✅ **`Directories` e `SpecificAssets` restano VUOTI di proposito.** Cio' che serve e' che il tipo sia
; REGISTRATO: `GetPrimaryAssetRules` alza `Priority` da -1 a 1 appena trova il tipo in `AssetTypeMap`, e
; da li' `IsDefault()` e' falso. Con zero percorsi `ScanPathsForPrimaryAssets` non indicizza niente e non
; emette warning — nessun costo d'avvio per dichiarare un tipo di cui non abbiamo asset.
;
; ⚠️ **Non aggiungere una seconda voce per lo stesso tipo.** `ScanPrimaryAssetTypesFromConfig` logga
; «Found multiple "GameFeatureData" Primary Asset Type entries» ed e' un `Error`. Il link «Add entry to
; PrimaryAssetTypesToScan?» del Message Log non comparira' piu' — la condizione che lo mostra e' proprio
; l'assenza di questa riga — ma i valori qui sotto sono identici a quelli che scriverebbe
; (`AddDefaultGameDataRule`: `FPrimaryAssetTypeInfo(GameFeatureData, ..., false, false)` con
; `Rules.CookRule = AlwaysCook`), cosi' cliccarlo su un branch che non ha ancora questa riga non produce
; una configurazione divergente.
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=,SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
