Description=Gioco tattico a turni simultanei — progetto didattico Unreal Engine
; La versione che il Main Menu mostra a schermo (CP 46.3, #938: «version/build label leggibile»). Sta qui e
; non in una costante C++ perche' una label letterale resta identica dopo il bump: l'unico segnale che
; qualcosa non torna arriverebbe da chi segnala un difetto su una build che crede di essere un'altra.
; ⚠️ Senza questa riga UE risponde `1.0.0.0` di default — cioe' un numero plausibile e sbagliato, non un
; vuoto che si nota. `RefactorTactics.Frontend.MainMenuVersionLabelCarriesProjectVersion` la esige.
ProjectVersion=0.1.0

; ─── Le schermate del frontend (CP 46.3, #938) ──────────────────────────────────────────────────────
;
; Il navigatore (`URTFrontendNavigator`) legge queste righe in `RegisterScreensFromConfig` e le trasforma
; in binding nome -> widget. Stanno in configurazione e non in C++ perche' il lato destro e' un percorso
; d'asset: metterlo nel codice legherebbe una ricompilazione a ogni spostamento di `.uasset`.
;
; ⚠️ **`ScreenId` e' testo, e nessun compilatore lo confronta con `RTScreenIds::Main`.** E' l'unico punto
; in cui un refuso qui non produce un errore ma una schermata che non disegna niente, ed e' la ragione per
; cui `RTFrontendMainMenuTests.cpp` verifica che `StartFrontend` trovi davvero `Main` e `Settings` fra le
; registrate: e' li' che i due mondi si toccano.
;
; ⚠️ **I due `.uasset` nominati qui non esistono ancora**: sono lavoro d'editor (`WBP_RT_MainMenu`,
; `WBP_RT_SettingsPanel`), e i binari si toccano da Unreal, uno per volta. Finche' mancano, la
; registrazione riesce lo stesso — un `TSoftClassPtr` e' un percorso e non carica — e la presentazione
; non disegna: e' il comportamento voluto, quello che `RTFrontendNavigator.h` chiama «una schermata senza
; binding non e' un errore di navigazione», applicato a un binding che non risolve.
[/Script/RefactorTactics.RTFrontendNavigator]
