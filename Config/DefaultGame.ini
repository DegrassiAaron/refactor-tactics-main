; I materiali del progetto sono referenziati SOLO via TSoftObjectPtr (colore-team, anelli): senza questa
; direttiva il cook non li include, e nella build packaged le unita' restano grigie senza colore di squadra.
; Scoperto al CP 7.4 avviando la build impacchettata: il warning «Materiale del tint assente» compariva solo li'.
+DirectoriesToAlwaysCook=(Path="/Game/RT")

; Gli scenari sono file `.json` FUORI da `Content/`: il cook non li vede e senza questa riga lo staging non
; li copia. Misurato il 2026-08-16 su un pacchetto vero — l'indice diceva «0 scenari sotto
; ../../../RefactorTactics/Scenarios» e l'auto-run falliva prima di partire (#926). Non era una regressione:
; non era mai stato configurato, perche' fino a quel giorno nessuno aveva eseguito uno scenario da un
; pacchetto. UFS e non NonUFS: il runner li legge con il file system virtuale, come ogni altro asset.
; ⚠️ Il path e' relativo a `Content/`, NON alla radice del progetto, e da qui il `../`: UAT fa
; `Combine(ProjectContentRoot, RelativePath)` (`CopyBuildToStagingDirectory.Automation.cs`, «these dirs are
; relative to the game content directory»). Scritto `Scenarios` cerca `Content/Scenarios`, non lo trova, e
; **stagea zero file lasciando la build SUCCESSFUL**: l'unico segnale e' un warning nel log della cottura.
+DirectoriesToAlwaysStageAsUFS=(Path="../Scenarios")
