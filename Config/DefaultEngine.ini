[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Game/RT/Core/Framework/BP_GameMode.BP_GameMode_C
; Il gioco avvia dal MENU, non da una mappa (CP 46.3, #938). E' la voce del DoD che rende `G13`
; verificabile: fino al 2026-08-22 il pacchetto partiva su `L_DevSandbox` e, prima ancora, su
; `MapSource=GeneratedTestArena` — e la DoD annotava che «una build che avvia sull'arena di prova
; soddisfa la lettera ma non la cosa».
; ⚠️ La riga era stata deliberatamente NON committata insieme al C++ di CP 46.3: allora `L_Frontend` non
; esisteva, e un `GameDefaultMap` che punta a una mappa assente e' un progetto che non si apre. Entra ora
; che la mappa e' versionata (seduta U28).
; ⚠️ `G13` resta comunque 🟡: le sue due riserve sono DATI — la mappa d'autore di U1 e la via a punti mai
; esercitata — e nessuna si chiude con un menu.
GameDefaultMap=/Game/RT/Maps/Shared/L_Frontend/L_Frontend.L_Frontend
; `EditorStartupMap` resta sulla sandbox: aprire l'editor sul menu non serve a nessuno.
EditorStartupMap=/Game/RT/Maps/Dev/L_DevSandbox/L_DevSandbox.L_DevSandbox


