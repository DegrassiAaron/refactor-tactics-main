; Default per `UModelContextProtocolSettings` (config = EditorPerProjectUserSettings).
;
; Unreal legge questo file come BASE e lascia che
; `Saved/Config/<Piattaforma>/EditorPerProjectUserSettings.ini` lo sovrascriva. Qui
; sta quindi il valore che vale su un checkout appena clonato, prima che qualcuno
; abbia eseguito l'installer.
;
; (!!) Il default e' SPENTO, ed e' la meta' versionabile della policy "il bridge
; parte solo in MAIN".
;
; Il bridge MCP e' uno per macchina, ospitato dal workspace MAIN. Un Editor che ne
; avvia un secondo espone una porta che nessuno governa, e dietro `call_tool` ci
; sono 56 toolset fra cui `AutomationTestToolset`: `RunTests` avvia una suite senza
; passare da `rt-suite.ps1`, dal suo mutex e dal lease, e `StopTests` ferma quella
; di un'altra sessione.
;
; Un checkout nuovo parte quindi spento e non apre quel canale per inerzia. MAIN
; accende il proprio bridge in `Saved/`, che e' per utente e non versionato:
;
;     .\scripts\rt-mcp-server.ps1 -RepoRoot (Get-Location).Path -AutoStart On
;
; L'installer lo fa da se': `On` in MAIN, `Off` altrove.
;
; (!) `Saved/` NON e' versionabile - 5,4 GB in 4990 file fra StagedBuilds,
; Packaged, Autosaves e Logs - ed e' per questo che la parte accesa della policy
; resta una leva di macchina, mentre il default sicuro sta qui.
;
; Porta ed endpoint restano fuori di proposito: variano per checkout (8765, 8766,
; 8767) e un valore versionato li renderebbe tutti uguali, cioe' in collisione.

[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
bAutoStartServer=False
