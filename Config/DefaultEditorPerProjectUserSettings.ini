; Default per `UModelContextProtocolSettings` (config = EditorPerProjectUserSettings).
;
; Unreal legge questo file come BASE e lascia che
; `Saved/Config/<Piattaforma>/EditorPerProjectUserSettings.ini` lo sovrascriva. Qui
; sta quindi il valore che vale su un checkout appena clonato, prima che qualcuno
; abbia eseguito l'installer.
;
; (!!) Il default e' SPENTO, ed e' la meta' versionabile della policy "il bridge
; parte solo in MAIN".
;
; Il bridge MCP e' uno per macchina, ospitato dal clone che lo accende. Un Editor che
; ne avvia un secondo espone una porta che nessuno governa, e dietro `call_tool` ci
; sono 56 toolset fra cui `AutomationTestToolset`: `RunTests` avvia una suite senza
; che nessun'altra sessione lo sappia, e `StopTests` ferma quella di un'altra sessione.
; Fino al 2026-09-08 un mutex e un lease lo impedivano; sono stati rimossi, il rischio no.
;
; Un checkout nuovo parte quindi spento e non apre quel canale per inerzia. MAIN
; accende il proprio bridge in `Saved/`, che e' per utente e non versionato:
;
;     Saved/Config/WindowsEditor/EditorPerProjectUserSettings.ini
;     [/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
;     bAutoStartServer=True
;
; (!) Lo script che lo impostava e' stato rimosso: ora si scrive a mano, e solo nel
; clone che ospita il bridge.
;
; ⚠️ La sezione e' quella, ed e' la STESSA che sta qui sotto alla riga del default:
; una sezione che Unreal non conosce viene ignorata in silenzio, quindi il default
; sicuro resterebbe in vigore e il bridge non partirebbe - senza errore, solo una
; porta che non c'e'. Se si copia questa ricetta, si copi anche il nome esatto.
;
; (!) `Saved/` NON e' versionabile - 5,4 GB in 4990 file fra StagedBuilds,
; Packaged, Autosaves e Logs - ed e' per questo che la parte accesa della policy
; resta una leva di macchina, mentre il default sicuro sta qui.
;
; Porta ed endpoint ORA sono dichiarati qui, e fino al 2026-09-10 non lo erano. La
; riga che li teneva fuori diceva: "variano per checkout (8765, 8766, 8767) e un
; valore versionato li renderebbe tutti uguali, cioe' in collisione".
;
; (!!) Era gia' falsa quando fu scritta, e non e' una sfumatura: entro' alle 15:02:57
; del 2026-09-06, VENTICINQUE MINUTI dopo dc53989c, che alle 14:37:26 aveva misurato i
; tre checkout registrati - MAIN, DEV, TECHNICAL_DESIGNER - BYTE IDENTICI su
; http://127.0.0.1:8765/mcp, e aveva versionato .mcp.json proprio perche' non variava.
; Due file versionati, lo stesso pomeriggio, dicevano cose opposte.
;
; ⚠️ E il file che si legge MENTRE si sta per impostare la porta e' questo: la frase
; non descriveva la deriva, la autorizzava. Il 2026-09-10 MAIN e' stato trovato su 8766
; mentre .mcp.json chiedeva 8765 - ponte vivo e irraggiungibile insieme (#2849).
;
; Cosa vale, misurato:
;
;   - la porta varia con QUALE CLONE OSPITA, non per checkout. Un clone che non accende
;     il bridge non ha una porta da far variare, ed e' il caso normale: il default qui
;     sotto e' SPENTO;
;   - l'ospite canonico e' MAIN, su 8765. Lo nomina ff2488f7: ".mcp.json e' versionato
;     con 8765, la porta di refactor-tactics-main";
;   - un ALTRO clone che ospita e' una divergenza LOCALE e muove i due lati INSIEME -
;     ServerPortNumber in Saved/ e l'url in .mcp.json. Committarne uno solo e'
;     esattamente ff2488f7: "la porta del clone designer era finita in main";
;   - MAIN fuori canone non e' una variazione, e' un difetto. E il sintomo lato Claude
;     Code non e' un errore: unreal-mcp semplicemente non compare.
;
; Le porte non erano in collisione nemmeno allora, per la ragione dichiarata piu' su:
; il bridge e' UNO per macchina, quindi due porte non si contendono niente.
;
; ── Perche' il valore canonico e' dichiarato qui, e cosa questo NON risolve ──────────
;
; La deriva accadeva perche' nessuno diceva il valore giusto DOVE L'EDITOR LO LEGGE.
; Questo file e' un layer che l'Editor legge davvero, quindi una macchina che non ha
; mai fatto un override prende la porta canonica da sola: derivare torna a essere un
; ATTO ESPLICITO invece che inerzia.
;
; (!!) Due cose che questo NON fa, scritte perche' non vengano scoperte dopo:
;
;   - NON ripara una macchina che ha gia' un override. Il layer Saved/ vince, sempre.
;     E' il caso in cui MAIN e' stato trovato su 8766 il 2026-09-10, e si e' corretto
;     a mano - a Editor CHIUSO, perche' Unreal riscrive quel file allo shutdown;
;   - NON rileva niente. Il confronto fra i due lati lo fa `node tools/mcp/check.ts
;     --check`, che e' rosso solo dove `bAutoStartServer` e' acceso: una porta che non
;     verra' mai aperta non contraddice nessuno.
;
; ⚠️ E cambia un comportamento, deliberatamente. Un clone NON-MAIN che accendesse il
; proprio ponte prenderebbe 8765 per default e, con MAIN gia' su, fallirebbe il bind:
; "porta occupata". E' un fallimento RUMOROSO al posto dell'assenza silenziosa di oggi,
; ed e' il motivo per cui si accetta. Chi vuole ospitare da un altro clone scriva la
; propria porta in Saved/ E l'url in .mcp.json - INSIEME, e senza committare ne' l'uno
; ne' l'altro (ff2488f7: "la porta del clone designer era finita in main").
;
; Come si diagnostica un ponte muto: brief-mcp-developer-bridge.md §9.2.

[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
bAutoStartServer=False
ServerPortNumber=8765
ServerUrlPath=/mcp
